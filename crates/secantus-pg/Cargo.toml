[package]
name = "secantus-pg"
version = "0.1.0-beta.8"
edition = "2021"
description = "A surrogate PostgreSQL server for tests: the real PostgreSQL wire protocol and grammar (libpg_query) over WiredTiger, single-node. Embed it (secantus_pg::PgServer) or run the secantusd-pg binary."
# GPL in effect: it links secantus-core / -storage / -wt / -auth (GPL-2.0-only)
# and WiredTiger (GPL v2 or v3). tasks/rust-packages-plan.md section 2.2.
license = "GPL-2.0-only"
repository = "https://github.com/jdrumgoole/SecantusDB"
rust-version = "1.98"
readme = "README.md"
keywords = ["postgresql", "database", "testing", "server", "wiredtiger"]
categories = ["database-implementations", "development-tools::testing"]

# `cargo binstall secantus-pg` fetches the prebuilt binary that
# release-pg-binaries.yml attaches to the `secantusd-pg-v<version>` release,
# instead of compiling WiredTiger and libpg_query. Targets without an archive
# (no Windows, no aarch64 Linux, no x86_64 macOS yet) fall back to a source build.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/secantusd-pg-v{ version }/secantusd-pg-{ version }-{ target }.tar.gz"
bin-dir = "secantusd-pg-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.docs.rs]
# secantus-wt / secantus-wiredtiger-sys skip the native WiredTiger build under
# DOCS_RS. pg_query still compiles libpg_query there (its build script runs
# bindgen); that is the dependency's build, not ours to skip.
rustdoc-args = ["--cfg", "docsrs"]

# EXCLUDED from the clean workspace: links WiredTiger through
# secantus-storage, which is not present in the maturin manylinux build
# containers or the default cargo test/clippy CI job. Gate it from this
# directory with SECANTUS_WT_INCLUDE / SECANTUS_WT_LIB set, exactly as the
# other WT-linked crates are -- `cargo clippy -p ...` in the clean workspace
# will NEVER compile this crate, and Cargo does not warn about that.
[workspace]

[lib]
name = "secantus_pg"
path = "src/lib.rs"

[features]
# mimalloc is default-on and optional, as it is for `secantusd-rs`: a build
# can leave it out (`--no-default-features --features bin`) to compare
# allocators or to instrument for PGO.
default = ["bin", "mimalloc"]
# Builds the `secantusd-pg` binary (signal handling). Off, the crate is the
# library alone -- what a dev-dependency or the Python handle wants.
bin = ["dep:ctrlc", "dep:libc"]

[dependencies]
# Anonymous files for an external sort's runs (`external_sort`).
tempfile = "3"
bson = "2"
async-trait = "0.1"
futures = "0.3"
# SecantusDB's fork of pgwire 0.40.7 (crates/secantus-pgwire), renamed back to
# `pgwire` here. A fork rather than `[patch.crates-io]`, because crates.io
# ignores `[patch]` in a published crate: see that crate's README for what it
# changes, and tasks/rust-packages-plan.md section 5.2 step 2.
pgwire = { package = "secantus-pgwire", version = "=0.1.0-beta.8", path = "../secantus-pgwire", default-features = false, features = ["server-api"] }
# "sync" is for the shutdown `watch` channel the accept loop and every
# connection task select on -- do not rely on another crate's feature
# unification to supply it.
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"] }
# The pure query engine, for filtering VIRTUAL tables' computed rows --
# storage filters real tables, but a virtual row never reaches storage.
secantus-core = { version = "=0.5.3-beta.177", path = "../secantus-core" }
secantus-pgcatalog = { version = "=0.1.0-beta.8", path = "../secantus-pgcatalog" }
secantus-pgplan = { version = "=0.1.0-beta.8", path = "../secantus-pgplan" }
secantus-storage = { version = "=0.5.3-beta.177", path = "../secantus-storage" }
# The SCRAM-SHA-256 verifier `CREATE ROLE ... PASSWORD` stores, derived as
# PostgreSQL derives it, and the exchange a login is checked by.
secantus-auth = { version = "=0.5.3-beta.177", path = "../secantus-auth" }
# PostgreSQL's own PL/pgSQL grammar (`parse_plpgsql`) and scanner, for user
# functions; the JSON tree the former returns.
pg_query = "6"
serde_json = "1"
rand = "0.9"
# "termination" so SIGTERM is caught too, not just SIGINT: a supervisor or a
# test harness stops the daemon with SIGTERM, and an uncaught one skips the
# WiredTiger close entirely -- which loses acknowledged writes.
ctrlc = { version = "3", features = ["termination"], optional = true }
# The binary's allocator (see the `#[global_allocator]` note in main.rs).
mimalloc = { version = "0.1", optional = true }
bytes = "1.12.1"
# The trait pgwire encodes BINARY values through -- same version as its own,
# or the `ToSql` we implement is a different trait from the one it calls.
postgres-types = "0.2.14"
# Grows a user function's stack on demand: every PL/pgSQL call level
# re-enters the planner and executor, and a recursive function (`fact(n-1)`)
# overflowed a worker thread's fixed stack within a few levels -- aborting
# the whole server -- long before the 54001 depth guard could answer.
stacker = "0.1"

# `main` unblocks SIGINT / SIGTERM and resets an inherited SIG_IGN at
# startup: a blocked mask and an ignored disposition both survive exec, and a
# server started under either could not be stopped by its supervisor.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
# A real PostgreSQL client for the embedded-server tests: the durability test
# has to prove that writes the SERVER acknowledged over the wire survive
# `stop()`, which a direct `Storage` call would not show.
tokio-postgres = "0.7"
tempfile = "3"

[[bin]]
name = "secantusd-pg"
path = "src/main.rs"
required-features = ["bin"]
