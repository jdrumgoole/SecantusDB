[package]
name = "secantus-mdb"
version = "0.5.3-beta.166"
edition = "2021"
description = "A surrogate MongoDB server for tests: the real wire protocol over WiredTiger, single-node. Embed it (secantus_mdb::Server) or run the secantusd-rs binary."
license = "GPL-2.0-only"
repository = "https://github.com/jdrumgoole/SecantusDB"

# Links WiredTiger (via secantus-storage / secantus-storage-adapter), so — like
# those crates — it is EXCLUDED from the `crates` workspace and is NOT built by
# the WT-less `rust` CI job. It is compiled + smoked only where WiredTiger is
# available (the `storage-engine` CI job / a WT machine). R7: the non-Python
# entry point over the same crates the embedded `_secantus_server` handle uses.

# Standalone (own [workspace]) so `cargo` invoked inside this dir isn't pulled
# into the parent `crates` workspace, matching secantus-storage-adapter.
rust-version = "1.98"
readme = "README.md"
keywords = ["mongodb", "database", "testing", "server", "wiredtiger"]
categories = ["database-implementations", "development-tools::testing"]

# `cargo binstall secantus-mdb` fetches the prebuilt, PGO-optimised binary that
# release-binaries.yml attaches to the `secantusdb-v<version>` release, instead
# of compiling WiredTiger. Targets without an archive fall back to a source build.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/secantusdb-v{ version }/secantusdb-{ version }-{ target }.tar.gz"
bin-dir = "secantusdb-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[workspace]

# Binary name follows the `secantusd-<engine>` daemon scheme so the compiled
# Rust server is distinguishable from the Python one (`secantusd-py`). The Cargo
# package stays `secantusdb`; only the emitted binary is `secantusd-rs`.
[lib]
name = "secantus_mdb"
path = "src/lib.rs"

[[bin]]
name = "secantusd-rs"
path = "src/main.rs"
# The binary's own dependencies (signal handling, logging, the allocator) are
# not the library's: a test that uses `secantus_mdb::Server` as a
# dev-dependency can turn `bin` off and skip them.
required-features = ["bin"]

[dependencies]
bson = "2"
ctrlc = { version = "3", features = ["termination"], optional = true }
secantus-storage = { version = "=0.5.3-beta.166", path = "../secantus-storage" }
secantus-storage-adapter = { version = "=0.5.3-beta.166", path = "../secantus-storage-adapter" }
secantus-commands = { version = "=0.5.3-beta.166", path = "../secantus-commands" }
secantus-server = { version = "=0.5.3-beta.166", path = "../secantus-server" }
# --log-level: init a logger to the resolved level before storage opens.
log = { version = "0.4", optional = true }
env_logger = { version = "0.11", optional = true }
# Fast allocator — same rationale as the embedded extension (Finding 1). Optional
# + default-on so the PGO instrumented build can opt out (`--no-default-features`)
# to avoid instrumenting mimalloc's internals (see the `#[global_allocator]` note
# in main.rs).
mimalloc = { version = "0.1", optional = true }

[features]
# mimalloc is default-on but optional so the Linux PGO instrumented stage can
# drop it (`--no-default-features`) — instrumenting mimalloc's internals crashed
# the arm64-macOS build; the habit is kept for Linux too, harmlessly.
default = ["bin", "mimalloc"]
# Builds the `secantusd-rs` binary. Off, the crate is the library alone.
bin = ["dep:ctrlc", "dep:log", "dep:env_logger"]
# Enabled only for the PGO instrumented stage-1 build: writes the profile to
# SECANTUS_PGO_OUT on shutdown via __llvm_profile_set_filename/write_file, because
# the arm64-macOS profiling runtime never wires up its own LLVM_PROFILE_FILE
# at-exit write. Never enabled for a normal build (the symbols exist only under
# -Cprofile-generate).
pgo-instrument = []

[dev-dependencies]
# The official driver, so the tests and the example use the server the way a
# user's tests would.
mongodb = { version = "3", features = ["sync"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures-util = "0.3"

# Cross-crate inlining of the hot serde/matcher/aggregate paths (matches the
# embedded extension's profile).
[profile.release]
lto = "thin"
codegen-units = 1
