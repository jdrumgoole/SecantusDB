[package]
name = "secantusdb"
version = "0.5.3-beta.146"
edition = "2021"
description = "Standalone SecantusDB server binary (Rust): WiredTiger-backed, MongoDB wire protocol."
license = "GPL-2.0-only"
repository = "https://github.com/jdrumgoole/SecantusDB"
publish = false

# Links WiredTiger (via secantus-storage / secantus-storage-adapter), so — like
# those crates — it is EXCLUDED from the `crates` workspace and is NOT built by
# the WT-less `rust` CI job. It is compiled + smoked only where WiredTiger is
# available (the `storage-engine` CI job / a WT machine). R7: the non-Python
# entry point over the same crates the embedded `_secantus_server` handle uses.

# Standalone (own [workspace]) so `cargo` invoked inside this dir isn't pulled
# into the parent `crates` workspace, matching secantus-storage-adapter.
[workspace]

# Binary name follows the `secantusd-<engine>` daemon scheme so the compiled
# Rust server is distinguishable from the Python one (`secantusd-py`). The Cargo
# package stays `secantusdb`; only the emitted binary is `secantusd-rs`.
[[bin]]
name = "secantusd-rs"
path = "src/main.rs"

[dependencies]
bson = "2"
ctrlc = { version = "3", features = ["termination"] }
secantus-storage = { path = "../secantus-storage" }
secantus-storage-adapter = { path = "../secantus-storage-adapter" }
secantus-commands = { path = "../secantus-commands" }
secantus-server = { path = "../secantus-server" }
# --log-level: init a logger to the resolved level before storage opens.
log = "0.4"
env_logger = "0.11"
