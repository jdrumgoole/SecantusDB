# PyO3 bindings for the Rust storage layer (secantus-storage), built with
# maturin. UNLIKE secantus-core, this extension links the vendored WiredTiger C
# library, so it cannot build in maturin's plain manylinux container — shipping
# it across the wheel matrix is Phase 4's go/no-go gate (see
# tasks/rust-rewrite-phase4-scoping.md). For now it builds where WiredTiger is
# present (set SECANTUS_WT_INCLUDE/_LIB or use a probed build dir; bindgen needs
# libclang via LIBCLANG_PATH).
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "secantus-storage"
version = "0.5.2b15"
description = "Rust storage layer for SecantusDB (the _secantus_storage extension)"
requires-python = ">=3.10"
license = "GPL-2.0-only"

[tool.maturin]
module-name = "_secantus_storage"
features = ["pyo3/abi3-py310"]
