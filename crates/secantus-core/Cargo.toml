[package]
name = "secantus-core"
version = "0.5.3-beta.78"
edition = "2021"
description = "Pure-Rust operator engines for SecantusDB (sort keys, query matcher, update operators, aggregation-expression evaluator, projection, change-stream diff, aggregation pipeline)."
license = "GPL-2.0-only"
repository = "https://github.com/jdrumgoole/SecantusDB"
# Not yet released to crates.io — that's a tracked follow-up (tasks/backlog.md).
# Flip to publish once the public API is settled and the standalone server lands.
publish = false

# Pure Rust: no PyO3, no Python. The engines operate on `bson` values only, so
# this crate links into anything (the PyO3 bindings crate today; a standalone
# Rust server binary tomorrow). The PyO3 boundary lives in `secantus-core-py`.
[lib]
name = "secantus_core"
crate-type = ["rlib"]

[dependencies]
bson = { workspace = true }
# Planar geometry (DE-9IM `Relate`) for the `$geoWithin` / `$geoIntersects`
# query operators — the same OGC lineage as Shapely, so containment semantics
# line up with the pure-Python geo path.
geo = "0.28"
# `$regex` / `$options` + BSON-regex field matching. A linear-time
# (finite-automaton) engine, so unlike Python's `re` it can't catastrophically
# backtrack; it's tried first for every pattern. Patterns it can't compile
# (backreferences / lookaround) fall back to `fancy-regex` below.
regex = "1"
# Backtracking regex with lookaround + backreference support (Python `re`-style),
# used only when the linear `regex` engine above can't compile a pattern — e.g.
# the negative-lookahead `^(?!system\.)` pymongo emits for listCollections name
# filters. The standalone server has no Python to defer to, so it evaluates here.
fancy-regex = "0.14"
# `$rand` — a uniform random double in [0, 1). Inherently non-deterministic, so
# it's NOT byte-pinned to the Python evaluator (no parity corpus case); both
# engines independently produce a fresh value in range.
rand = "0.9"
