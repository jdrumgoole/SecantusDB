# Standalone maturin build for the Phase 1 Rust core. Kept separate from the
# top-level SecantusDB wheel (scikit-build-core + vendored WiredTiger) on
# purpose: merging the two native build systems into one wheel is a Phase 6
# packaging task. For now `maturin build` / `maturin develop` here produces an
# importable `_secantus_core` extension the `secantus.sortkey` shim can pick up.
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "secantus-core"
version = "0.0.0"
requires-python = ">=3.10"
description = "Rust core for SecantusDB (Phase 1: sortkey)"

[tool.maturin]
module-name = "_secantus_core"
# Build a single abi3 wheel valid for CPython 3.10+ (matches the project's
# requires-python), so we don't need a wheel per interpreter version.
features = ["pyo3/abi3-py310"]
