[package]
name = "secantus-server"
version = "0.5.3-beta.175"
edition = "2021"
description = "The standalone SecantusDB Rust server: TCP accept loop + connection handling over secantus-wire + secantus-commands."
license = "GPL-2.0-only"
repository = "https://github.com/jdrumgoole/SecantusDB"

# The connection loop is **generic over the command `Storage` trait**, so this
# crate is WT-free: it builds and runs over real TCP in the WT-less `rust` CI
# job (and this dev sandbox) with any `Storage` impl. The WiredTiger-backed
# adapter (`secantus_storage::Storage` → the command `Storage` trait) lives
# elsewhere (R4b) so this crate doesn't link the C library.
rust-version = "1.98"
readme = "README.md"
keywords = ["mongodb", "database", "server", "testing"]
categories = ["database-implementations", "network-programming"]

[lib]
name = "secantus_server"
crate-type = ["rlib"]

[dependencies]
bson = { workspace = true }
secantus-wire = { version = "=0.5.3-beta.175", path = "../secantus-wire" }
secantus-commands = { version = "=0.5.3-beta.175", path = "../secantus-commands" }
# TLS / mTLS in the accept loop (R5c). `ring` crypto backend (no cmake/nasm
# build, unlike aws-lc-rs). `rustls-pemfile` loads the PEM cert/key/CA;
# `x509-parser` extracts the verified client cert's subject DN for MONGODB-X509.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
x509-parser = "0.16"
# TOML config-file loader for the standalone `secantusdb` daemon (`--config`).
toml = "0.8"
# The slow-operation log line (`Slow query`), at `info`.
log = "0.4"
# The slow-operation log's sample draw.
rand = "0.9"

[dev-dependencies]
# Self-signed cert generation for the TLS integration tests (ring backend).
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
