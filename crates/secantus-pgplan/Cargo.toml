[package]
name = "secantus-pgplan"
version = "0.1.0-beta.4"
edition = "2021"
description = "PostgreSQL parse trees lowered to MQL for the SecantusDB PostgreSQL server"
license = "Apache-2.0"
repository = "https://github.com/jdrumgoole/SecantusDB"
rust-version = "1.98"
readme = "README.md"
keywords = ["postgresql", "sql", "planner", "database"]
categories = ["database-implementations", "parser-implementations"]

[dependencies]
# `regexp_replace` -- linear-time, which covers the POSIX-ARE subset any
# measured client sends.
regex = "1"

# `normalize(text [, form])`. Unicode normalisation is TABLE-driven -- the
# composition and decomposition mappings are data, not an algorithm -- so there
# is no honest way to approximate it in a few lines. Half-implementing it (say,
# ASCII passthrough) would answer most inputs correctly and a minority
# silently wrongly, which is the divergence shape this project refuses.
unicode-normalization = "0.1"

bson = "2"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
# The IANA tz database, for `timestamptz`: PostgreSQL interprets a zone-less
# literal in the session TimeZone and renders every timestamptz in it, so a
# named zone like `Europe/Rome` has to resolve to a real offset (with its DST
# rule) rather than to a guess. Already used by `secantus-core` for the same
# reason on the MongoDB side.
chrono-tz = { version = "0.10", default-features = false }
pg_query = "6"
# pg_query hands its parse tree over as protobuf, and prost refuses a message
# nested past 100 levels -- a 50-term `a || b || ...` was a 42601 "Error
# decoding result". PostgreSQL takes 1,000 terms; depth is policed by the
# planner's own 54001 guard (`check_depth`) instead.
prost = { version = "0.13", features = ["no-recursion-limit"] }
secantus-pgcatalog = { version = "=0.1.0-beta.4", path = "../secantus-pgcatalog" }
# `numeric` arithmetic beyond Decimal128's 34 digits: PostgreSQL's numeric is
# arbitrary precision, and a sum or product of two wide values has to be exact.
num-bigint = "0.4"
num-traits = "0.2"
# The Snowball stemmers behind PostgreSQL's `<language>_stem` dictionaries
# (french, german, russian, ...), the same algorithms libstemmer runs.
rust-stemmers = "1"
# The Snowball languages `rust-stemmers` does not carry (basque, catalan,
# hindi, ...). Used for those ten only: its Dutch is Snowball 3's rewrite,
# while PostgreSQL 14 runs the older one `rust-stemmers` matches.
snowball_stemmers_rs = "1.0.1"
# `xpath()` / `xmlexists()`: an XPath 1.0 engine over a parsed document,
# as PostgreSQL has libxml2's.
sxd-document = "0.3.2"
sxd-xpath = "0.4.2"
# `sha224()` .. `sha512()` over bytea (the digest `secantus-auth` already
# carries for SCRAM).
sha2 = "0.10"
pwhash = "1"
hmac = "0.12"
md-5 = "0.10"
sha1 = "0.10"
getrandom = "0.2"
# pgcrypto's `pgp_sym_*`: OpenPGP symmetric encryption (RFC 4880) with the
# ciphers pgcrypto offers and its ZIP / ZLIB compression packets.
aes = "0.8"
des = "0.8"
blowfish = "0.9"
cast5 = "0.11"
flate2 = "1"
# ICU collation (`COLLATE "und-x-icu"`, `CREATE COLLATION ... provider = icu`):
# the CLDR root collation and its tailorings, compiled in.
icu_collator = "2"
icu_locale = "2"
