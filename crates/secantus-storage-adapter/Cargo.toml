[package]
name = "secantus-storage-adapter"
version = "0.5.3-beta.163"
edition = "2021"
description = "Adapts the WiredTiger-backed secantus-storage Storage to the secantus-commands Storage trait for the Rust server."
license = "GPL-2.0-only"
repository = "https://github.com/jdrumgoole/SecantusDB"
publish = false

# Links WiredTiger (via secantus-storage), so — like secantus-storage itself —
# this crate is EXCLUDED from the `crates` workspace and is NOT built by the
# WT-less `rust` CI job or this dev sandbox. It is compiled + tested only where
# WiredTiger is available (the `rust-storage` CI job / a WT machine). It is the
# R4b bridge: the Rust server (R4a, generic over `secantus_commands::Storage`)
# runs against real WiredTiger by wrapping a `secantus_storage::Storage` in the
# `StorageAdapter` here.

# Standalone (own [workspace]) so `cargo` invoked inside this dir — as the
# rust-storage CI job does — isn't pulled into the parent `crates` workspace
# (where it's excluded), matching secantus-storage / secantus-server-py.
[workspace]

[lib]
name = "secantus_storage_adapter"
crate-type = ["rlib"]

[dependencies]
bson = "2"
secantus-storage = { path = "../secantus-storage" }
secantus-commands = { path = "../secantus-commands" }

# Test-only: the server-roundtrip integration tests (moved here from the
# WiredTiger-free secantus-server crate) bind the real Rust server over real
# WiredTiger, so they need both secantus-server and this crate's StorageAdapter.
# secantus-server is itself WT-free, so this adds no WiredTiger to the dep graph
# beyond what secantus-storage already pulls in.
[dev-dependencies]
secantus-server = { path = "../secantus-server" }
