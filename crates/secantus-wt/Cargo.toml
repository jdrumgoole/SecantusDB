[package]
name = "secantus-wt"
version = "0.5.3-beta.177"
edition = "2021"
description = "Safe Rust bindings over the vendored WiredTiger C library — the storage foundation for SecantusDB's Rust engine (Phase 4)."
license = "GPL-2.0-only"
repository = "https://github.com/jdrumgoole/SecantusDB"

# Standalone (own [workspace] table) so it isn't pulled into the secantus-core
# workspace's default cargo build — it needs the WiredTiger C library, which the
# core crates and their CI don't.
rust-version = "1.98"
readme = "README.md"
keywords = ["wiredtiger", "storage-engine", "database"]
categories = ["database-implementations", "api-bindings"]


[package.metadata.docs.rs]
# The build scripts skip the native WiredTiger build under DOCS_RS; the
# committed bindings are all rustdoc needs.
rustdoc-args = ["--cfg", "docsrs"]

[workspace]

[lib]
name = "secantus_wt"

[features]
# `bundled` (default): link WiredTiger through secantus-wiredtiger-sys, which
# builds it from bundled source -- or links SECANTUS_WT_INCLUDE / _LIB when set,
# which is how this repo's wheel, release workflows and CI use it.
#
# `bindgen`: regenerate the bindings with bindgen (needs libclang) and fail the
# build if they differ from the committed src/bindings.rs. Off by default so a
# crates.io build needs no libclang; `./inv rust-wt-test` turns it on.
#
# With `--no-default-features` the crate links a prebuilt WiredTiger itself
# (SECANTUS_WT_INCLUDE / _LIB, or this repo's build/*/wt-build).
default = ["bundled"]
bundled = ["dep:secantus-wiredtiger-sys"]
bindgen = ["dep:bindgen"]

[dependencies]
secantus-wiredtiger-sys = { version = "=0.5.3-beta.177", path = "../secantus-wiredtiger-sys", optional = true }

[build-dependencies]
bindgen = { version = "0.70", optional = true }
