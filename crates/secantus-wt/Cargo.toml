[package]
name = "secantus-wt"
version = "0.5.3-beta.165"
edition = "2021"
description = "Safe Rust bindings over the vendored WiredTiger C library — the storage foundation for SecantusDB's Rust engine (Phase 4)."
license = "GPL-2.0-only"
repository = "https://github.com/jdrumgoole/SecantusDB"
publish = false

# Standalone (own [workspace] table) so it isn't pulled into the secantus-core
# workspace's default cargo build — it needs the WiredTiger C library, which the
# core crates and their CI don't.
[workspace]

[lib]
name = "secantus_wt"

[features]
# Regenerate the WiredTiger bindings with bindgen (needs libclang) and check
# them against the committed src/bindings.rs. Without it the committed file is
# used as-is, so a crates.io build needs no libclang.
default = ["bindgen"]
bindgen = ["dep:bindgen"]
# Build WiredTiger from the bundled source in `secantus-wiredtiger-sys` instead
# of linking a prebuilt one. Off by default for now: the wheel, the release
# workflows and CI link the CMake build via SECANTUS_WT_INCLUDE / _LIB.
bundled = ["dep:secantus-wiredtiger-sys"]

[dependencies]
secantus-wiredtiger-sys = { path = "../secantus-wiredtiger-sys", optional = true }

[build-dependencies]
bindgen = { version = "0.70", optional = true }
