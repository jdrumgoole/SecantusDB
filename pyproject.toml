[project]
# PyPI project name. The Python *import* name stays `secantus` (the package
# at src/secantus/) — pip-the-PyPI-name vs import-the-module-name is normal
# Python (Pillow → PIL, scikit-learn → sklearn). PyPI normalizes
# `SecantusDB` → `secantusdb` for URLs and lookup; pip is case-insensitive.
name = "SecantusDB"
version = "0.6.0b16"
description = "An embeddable, MongoDB compatible, document database, built on WiredTiger"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Joe Drumgoole", email = "joe@joedrumgoole.com" }]
license = "GPL-2.0-only AND CC-BY-4.0"
# Compound SPDX expression: code (src/, build glue, vendored WiredTiger
# headers we ship) is GPL-2.0-only; written content (README.md, docs/,
# validation reports, pymongo_validation/README.md) is CC-BY-4.0. Both
# license files travel with the wheel via `license-files` below.
license-files = ["LICENSE", "LICENSE-DOCS"]
dependencies = [
    "pymongo>=4.6",
    # `wiredtiger` is bundled in the binary wheel via vendor/wiredtiger;
    # no PyPI dependency on the standalone wiredtiger package.
    "s2sphere>=0.2.5",
    "shapely>=2.0",
    # python-dateutil powers variable-length date arithmetic in
    # ``$densify`` (month / quarter / year units). Pure-Python, no
    # native components; on virtually every box already as a
    # transitive dep of botocore / pytest / etc.
    "python-dateutil>=2.8",
    # tomllib backport for the config loader (secantus.config); stdlib
    # from 3.11, so 3.10 installs need the API-identical tomli.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "pytest-json-report>=1.5",  # for pymongo-validation report generation
    "pytest-benchmark>=4.0",  # for tests/test_perf_regression.py
    "pytest-timeout>=2.4",  # per-test deadline; names hung tests instead of letting CI hang at 97%
    "pytest-asyncio>=0.24",  # drives pymongo's async test suite in the validate-pymongo-async gauge
    # Duration-balanced CI sharding. The test lanes split the suite with
    # ``--splits N --group K`` against the per-platform files in ci/durations/;
    # see .github/workflows/record-durations.yml for how those are produced.
    "pytest-split>=0.10",
    # starlette's TestClient prefers httpx2 and emits a
    # StarletteDeprecationWarning on every construction when only httpx is
    # importable ("Using `httpx` with `starlette.testclient` is deprecated").
    # That was the last warning left in the default suite — six of them, from
    # the admin websocket tests. Test-only: nothing under src/secantus imports
    # httpx at runtime, so this does not belong in the admin/opsboard extras.
    "httpx2>=2.12",
    "trustme>=1.2",  # ephemeral CA + self-signed certs for tests/test_tls.py
    "sqlglot>=25",  # SQL parser for the secantus.sql tests (mirrors the [sql] extra)
    "pg8000>=1.31",  # pure-Python Postgres driver: real-driver gauge for the SQL server
    # Pinned exactly: the validate-psycopg gauge runs the vendored psycopg test
    # suite (vendor/psycopg, same tag) against the installed wheel — the two
    # must stay in lockstep. Bump both together.
    "psycopg[binary]==3.3.4",
    "sqlalchemy>=2.0",  # ORM smoke for the SQL server (drives pg8000 + psycopg)
    # psycopg's test-suite plugins (its [test] extra) for validate-psycopg:
    "anyio>=4.0",
    "pytest-cov>=3.0",
    "pytest-randomly>=3.5",
    # psycopg's tests/test_typing.py shells out to a bare `mypy` (125 tests) —
    # uv run puts .venv/bin on PATH, so carrying mypy here makes them count.
    "mypy>=1.14",
    "invoke>=2.2",
    # Pinned exactly: ruff's formatter output changes between releases, so an
    # unpinned floor let CI silently pull a newer ruff that reformatted an
    # untouched file and failed the `ruff format --check` gate on every PR. Bump
    # this deliberately (and re-run `ruff format`) when adopting a new ruff.
    "ruff==0.15.20",
    "sphinx>=7.2",
    "myst-parser>=2.0",
    "furo>=2024.1",
]
website = [
    # Pelican + markdown plugin pull in Jinja2, feedgenerator, etc.
    "pelican>=4.9",
    "markdown>=3.6",
    # AWS SDK for the boto3-based provisioner / deployer in
    # website/infra/aws.py. Confined to the website extra so it never
    # ships in the runtime dependency closure.
    "boto3>=1.34",
]
admin = [
    # Local FastAPI app served behind a pywebview window. Loopback-only
    # with a per-launch token; no external services. See docs/admin.md.
    "fastapi>=0.110",
    # starlette>=1.0.1 fixes CVE-2026-48710 ("BadHost"): pre-1.0.1 builds
    # request.url from an unvalidated Host header, letting a crafted Host
    # shift request.url.path and bypass the admin token middleware's
    # /healthz + /static/ prefix allowlist. Pinned explicitly (fastapi pulls
    # starlette transitively, but an explicit floor guarantees the patched
    # version). The middleware also reads the ASGI scope path directly now
    # (admin/middleware.py) as defence-in-depth.
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pywebview>=5.0",
    # python-multipart>=0.0.30 fixes CVE-2026-53539: a quadratic-CPU DoS in
    # the urlencoded-form parser on bodies containing semicolons.
    "python-multipart>=0.0.30",
    # OS-level process-name override — makes the macOS menu bar / Dock
    # / Activity Monitor say "SecantusDB admin" instead of "Python".
    "setproctitle>=1.3",
]
opsboard = [
    # Local FastAPI + pywebview app that drives the build/test/release cycle
    # for all three servers. Same web stack as the admin extra; dev-only. The
    # job-tracking core (secantus.jobkit) is pure-stdlib and needs no extra.
    "fastapi>=0.110",
    "starlette>=1.0.1",  # CVE-2026-48710 fix (see the admin extra note)
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pywebview>=5.0",
    "python-multipart>=0.0.30",  # form posts from the task buttons
    "setproctitle>=1.3",
]
screenshots = [
    # Documentation screenshots of the admin UI (scripts/admin_screenshots.py,
    # `invoke admin-screenshots`). Deliberately its own extra rather than part
    # of `dev`: every CI lane installs `dev`, and none of them drive a browser
    # — the docs drift test that guards the shots is browser-free. Needs
    # `uv run playwright install chromium` once to fetch the browser itself.
    "playwright>=1.44",
]
rust = [
    # The Rust engine core (`_secantus_core`) as a separate companion wheel: the
    # reusable engines behind the Rust server + the byte-for-byte parity-test
    # oracle. The Python server does NOT import it (the in-process engine
    # selection was retired); installing this extra is only useful for the
    # parity tests / using the engines as a library. Built from the PyO3 bindings
    # crate crates/secantus-core-py/ (wrapping crates/secantus-core/).
    "secantus-core==0.5.2b15",
]
sql = [
    # The embedded SQL engine + (later) the PostgreSQL-wire server. sqlglot is
    # a pure-Python SQL parser (no native build), so this extra is opt-in and
    # never enters the core Mongo wheel's dependency closure. The Python server
    # does NOT import `secantus.sql`; installing this extra is only needed to
    # use the SQL interface. See tasks/sql-postgres-plan.md.
    "sqlglot>=25",
]

[project.urls]
Homepage = "https://secantusdb.com/"
Documentation = "https://secantusdb.com/docs/index.html"
"Rust server docs" = "https://secantusdb.com/docs/rust/index.html"
Repository = "https://github.com/jdrumgoole/SecantusDB"
Changelog = "https://secantusdb.com/docs/changelog.html"

[project.scripts]
# Daemon naming: `secantusd-<engine>[-<protocol>]`. `-d` signals a daemon
# (like `mongod`); the engine tag (`-py` / `-rs`) disambiguates the Python and
# Rust builds that would otherwise both be `secantusd`; a protocol tag (`-pg`)
# names the wire protocol when it isn't the default MongoDB wire.
#   secantusd-py     — Python MongoDB-wire server (this package)
#   secantusd-py-pg  — Python PostgreSQL-wire server (secantus.sql.pgserver)
#   secantusd-rs     — Rust MongoDB-wire server (crates/secantusdb [[bin]])
secantusd-py = "secantus.cli:main"
secantusd-py-pg = "secantus.sql.pgserver:main"
# Utility commands carry the bare `secantus` import-name prefix (they aren't
# daemons, so the `secantusd-` prefix doesn't apply).
secantus-admin = "secantus.admin.cli:main"
# Ops Board: local web app to drive the build/test/release cycle (dev tool).
secantus-opsboard = "secantus.opsboard.cli:main"
# Offline restore tool: extract a SecantusDB backup archive into a
# fresh directory the user then points a new `secantusd-py` at.
secantus-restore-archive = "secantus.restore_cli:main"

[build-system]
# SWIG is required at build time but pulled from the host (Homebrew /
# apt / dnf / apk / choco) rather than the PyPI `swig` wrapper package.
# The PyPI wrapper's `swig4.0 -help` shim trips CMake's FindSWIG
# language-detection probe, so we rely on a real system swig instead.
# Installation prerequisites are documented in docs/installation.md and
# satisfied by tool.cibuildwheel.{linux,macos,windows} `before-build`.
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

# Dev-only resolution for the optional `rust` extra: point `secantus-core` at the
# in-repo crate so `uv lock` / `uv sync` resolve it locally (it isn't on PyPI
# until a release publishes it in lockstep). This is uv-specific config and is
# NOT part of the built wheel's metadata — `pip install "secantus[rust]"` reads
# the `secantus-core==<version>` pin from project.optional-dependencies and
# resolves it from PyPI as normal.
[tool.uv.sources]
secantus-core = { path = "crates/secantus-core-py" }

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.21"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/secantus"]
# vendor/wiredtiger contains GPL'd C source; cibuildwheel needs it.
sdist.include = ["vendor/wiredtiger/**"]
sdist.exclude = [
    "vendor/wiredtiger/test/**",
    "vendor/wiredtiger/bench/**",
    "vendor/wiredtiger/examples/**",
    # pymongo-validation is a dev-only fixture: pymongo's tests live as a
    # git submodule (Apache-2.0; we don't redistribute), and our adapter
    # code is invoked locally via `invoke validate`. Neither belongs in
    # the wheel or the sdist.
    "vendor/pymongo-tests/**",
    "pymongo_validation/**",
    "pymongo-validation/**",
    # pymongo-async reuses the vendor/pymongo-tests submodule (the async
    # suite under test/asynchronous/); only its adapter dir needs excluding.
    "pymongo_async_validation/**",
    "vendor/mongo-go-driver/**",
    "go_validation/**",
    "vendor/node-mongodb-native/**",
    "node_validation/**",
    # mongo-java-driver hosts both the Java and the Kotlin driver; the
    # vendor tree is already excluded above, so the Kotlin gauge just adds
    # its own adapter dir.
    "vendor/mongo-java-driver/**",
    "java_validation/**",
    "kotlin_validation/**",
    "vendor/mongo-ruby-driver/**",
    "ruby_validation/**",
    "vendor/mongo-php-library/**",
    "php_lib_validation/**",
    "vendor/mongo-php-driver/**",
    "php_ext_validation/**",
    "vendor/mongo-c-driver/**",
    "c_validation/**",
    "vendor/mongo-cxx-driver/**",
    "cxx_validation/**",
    "vendor/mongo-csharp-driver/**",
    "dotnet_validation/**",
    # SQL-server gauges: psycopg's own test suite and the sqllogictest
    # corpus, both vendored dev-only (invoke validate-psycopg / validate-slt).
    "vendor/psycopg/**",
    "psycopg_validation/**",
    "vendor/sqllogictest/**",
    "slt_validation/**",
    "sqlalchemy_validation/**",
    "vendor/pgx/**",
    "pgx_validation/**",
    "pgtest_validation/**",
    "vendor/pgjdbc/**",
    "pgjdbc_validation/**",
    "sqlstress_validation/**",
    ".validation/**",
    # brandkit/ is marketing content (logos, brand-guide HTML); not
    # needed at install or run time. The docs that need it pull from
    # docs/_static/ (a small subset checked in there too). Cloners
    # and the GitHub release page are the right place for the full kit.
    "brandkit/**",
    # website/ is the marketing site (Pelican source + boto3 provisioner).
    # Dev-only; never shipped in the wheel or sdist.
    "website/**",
    # tests/cross_driver/ holds Go and Node smoke programs that exercise
    # SecantusDB through non-Python drivers. The Python orchestrator
    # (tests/test_geo_cross_driver.py) ships, but the JS/Go sources
    # don't need to live in the wheel — they're dev-only scaffolding.
    "tests/cross_driver/**",
    # Dev-only trees that aren't needed to build or install the package: the
    # Sphinx docs, the invoke task defs, the benchmark harness, and the CI
    # workflow config. Trimming them keeps the source tarball lean without
    # touching what the build actually consumes (src/, CMakeLists, cmake/,
    # vendor/wiredtiger, pyproject). (security review §I7)
    "docs/**",
    "tasks/**",
    "bench/**",
    ".github/**",
]

[tool.cibuildwheel]
# Skip 32-bit and pypy targets. Build for every supported CPython ABI
# (requires-python is ">=3.10") so users on cp310/cp311/cp312/cp313
# always pip-install a pre-built wheel.
build = "cp310-* cp311-* cp312-* cp313-*"
skip = ["*-win32", "*-manylinux_i686", "pp*"]
build-verbosity = 1
# Real smoke tests against the installed wheel: server bind, pymongo
# handshake (hello/ping/serverInfo), unknown-command resilience. A broken
# wheel that imports cleanly but mishandles requests fails here, not
# silently in the user's pip install. pytest-xdist is needed because
# pyproject.toml's [tool.pytest.ini_options] addopts="-n auto" is picked
# up when pytest walks up from {project}/tests/.
test-requires = ["pytest", "pytest-xdist"]
test-command = "pytest -v {project}/tests/test_smoke.py {project}/tests/test_pymongo_smoke.py"

[tool.cibuildwheel.linux]
# manylinux_2_28 (AlmaLinux 8, dnf) + musllinux_1_2 (Alpine, apk). The
# storage-engine build (SECANTUS_BUILD_STORAGE_ENGINE=ON) compiles the Rust
# extensions, which need (a) swig for WiredTiger's Python module, (b) a Rust
# toolchain, (c) libclang for `secantus-wt`'s bindgen, and (d) **lz4**, the
# default block compressor since 2026-08-22 — WiredTiger's builtin lz4
# extension links against it (zlib is already present on every image). We pin manylinux to
# 2_28 (glibc 2.28+) because its `dnf install clang clang-libs` gives a modern
# libclang (the CentOS-7 manylinux2014 SCL clang is far more painful). The
# install path of libclang.so differs by distro (manylinux /usr/lib64, musllinux
# /usr/lib), so we symlink whichever we find into a fixed /opt/libclang and point
# LIBCLANG_PATH there (set in the workflows). `$HOME/.cargo/bin` is on PATH via
# CIBW_ENVIRONMENT so the build sees the rustup-installed cargo.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
archs = ["x86_64", "aarch64"]
before-build = """
(dnf install -y swig clang clang-libs clang-devel llvm-libs lz4-devel || apk add --no-cache swig clang clang-dev llvm-dev lz4-dev)
mkdir -p /opt/libclang
lc=$(find /usr -name 'libclang.so*' 2>/dev/null | head -1); [ -n "$lc" ] && ln -sf "$lc" /opt/libclang/libclang.so
command -v cargo >/dev/null 2>&1 || (curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable)
"""

[tool.cibuildwheel.macos]
# arm64 only; x86_64 isn't a supported wheel target. The storage-engine build
# needs swig + Rust + libclang: the macos-14 runner ships Rust and Xcode's clang.
# We deliberately do NOT install/point at Homebrew's `llvm` — its newer libclang
# parses WiredTiger's headers into broken bindings (missing WT_CURSOR fields);
# bindgen auto-discovers Xcode's libclang, which is what the storage-engine CI
# job uses successfully. `brew install` is idempotent.
#
# lz4 is built from source rather than `brew install lz4` (tools/build_lz4_macos.sh).
# Homebrew builds for the runner's own OS, so its liblz4 carries a minimum
# target of macOS 14 and `delocate` refuses to bundle it into a wheel targeting
# macOS 11 — accepting it would mean raising the wheel's floor to 14 and
# dropping every Apple Silicon user on macOS 11-13. The script builds a STATIC
# liblz4 at the wheel's own deployment target, so there is no dylib to bundle.
archs = ["arm64"]
before-build = "brew install swig && (command -v cargo >/dev/null 2>&1 || brew install rust) && bash tools/build_lz4_macos.sh"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
# SWIG (preinstalled, re-installed idempotently) + LLVM for bindgen's libclang.
# Rust ships preinstalled on the windows-2022 runner, so we don't choco-install
# it (that would risk shadowing the runner's rustup cargo). Then copy libclang.dll
# to a SPACE-FREE path: bindgen could not find it at "C:\Program Files\LLVM\bin"
# (`invalid: []`) because the space in the path doesn't survive cibuildwheel's
# env serialization on Windows; a no-space LIBCLANG_PATH sidesteps that.
before-build = 'choco install -y swig llvm && (if not exist C:\libclang mkdir C:\libclang) && copy /Y "C:\Program Files\LLVM\bin\libclang.dll" C:\libclang'
# Flag + libclang + shared cargo target for the storage-engine bundle
# (_secantus_storage / _secantus_server extensions + secantusd-rs.exe). Set here,
# not in a workflow CIBW_ENVIRONMENT_WINDOWS (none exists, so this isn't
# overridden). Raw values — cibuildwheel quotes table values itself, so our own
# quotes once produced a doubled-quote "Malformed environment option".
# SECANTUS_CARGO_TARGET (no ccache on Windows) just shares one target dir across
# the 4 CPython builds in the job so the Rust deps compile once, not 4×.
# Forward slashes: a backslash in C:\... gets eaten when the path flows through
# CMake (`\c` escape), turning it into the invalid drive-relative `C:cargo-target`.
# CMake, cargo and clang-sys all accept forward slashes on Windows.
environment = { SKBUILD_CMAKE_DEFINE = "SECANTUS_BUILD_STORAGE_ENGINE=ON", LIBCLANG_PATH = 'C:/libclang', SECANTUS_CARGO_TARGET = 'C:/cargo-target' }

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m 'not perf and not online'`: keep perf-regression and network-
# dependent tests out of the default run. Perf benchmarks fight for
# CPU under xdist and would amplify variance (run via `invoke perf`).
# Online tests hit the public internet (PyPI, GitHub, RTD) and depend
# on a published release, so they belong in `invoke validate-readme`
# rather than every dev pytest run.
addopts = "-n auto --dist=loadgroup -m 'not perf and not online and not slow'"
# Per-test deadline (pytest-timeout, already in the dev extras). A hung
# test otherwise blocks CI until the runner's 6-hour kill with zero
# diagnostics — seen once in tests/test_admin_skeleton.py's websocket
# change-stream tail, which pinned a core for 15+ minutes and never
# produced a stack. 600s is ~4x the whole suite's wall-clock, so only a
# genuine hang trips it. `thread` method dumps every thread's stack
# before killing the worker (the signal method can't interrupt blocking
# C calls and is unreliable under xdist). Ini keys (not addopts) so the
# deadline survives runs that override addopts, e.g. the conformance
# gauges' `-o addopts=`.
timeout = 600
timeout_method = "thread"
markers = [
    "perf: performance regression tests (run via `invoke perf`, not in default suite)",
    "online: tests that hit the public internet (run via `invoke validate-readme` or `pytest -m online`, not in default suite)",
    "slow: long-running benchmarks / scaling regressions (run via `pytest -m slow`, not in default suite)",
    "differential: same operation against SecantusDB and a real mongod (skipped when no mongod is on PATH; run via `pytest -m differential`)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
