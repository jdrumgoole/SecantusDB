[project]
name = "secantus"
version = "0.1.0"
description = "A fake MongoDB server in Python for testing pymongo applications without running a real mongod."
requires-python = ">=3.12"
authors = [{ name = "Joe Drumgoole", email = "joe@joedrumgoole.com" }]
license = { text = "MIT" }
dependencies = [
    "pymongo>=4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "invoke>=2.2",
    "ruff>=0.6",
    "sphinx>=7.2",
    "myst-parser>=2.0",
    "furo>=2024.1",
]

[project.scripts]
secantus = "secantus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secantus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
