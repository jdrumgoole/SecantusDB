[project]
name = "secantus"
version = "0.1.0"
description = "A fake MongoDB server in Python for testing pymongo applications without running a real mongod."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Joe Drumgoole", email = "joe@joedrumgoole.com" }]
license = "GPL-2.0-only"
license-files = ["LICENSE"]
dependencies = [
    "pymongo>=4.6",
    # `wiredtiger` is bundled in the binary wheel via vendor/wiredtiger;
    # no PyPI dependency on the standalone wiredtiger package.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "invoke>=2.2",
    "ruff>=0.6",
    "sphinx>=7.2",
    "myst-parser>=2.0",
    "furo>=2024.1",
]

[project.scripts]
secantus = "secantus.cli:main"

[build-system]
requires = ["scikit-build-core>=0.10", "swig>=4.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.21"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/secantus"]
# vendor/wiredtiger contains GPL'd C source; cibuildwheel needs it.
sdist.include = ["vendor/wiredtiger/**"]
sdist.exclude = [
    "vendor/wiredtiger/test/**",
    "vendor/wiredtiger/bench/**",
    "vendor/wiredtiger/examples/**",
]

[tool.cibuildwheel]
# Skip 32-bit and pypy targets; only CPython 3.12 on supported platforms.
build = "cp312-*"
skip = ["*-win32", "*-manylinux_i686", "pp*"]
build-verbosity = 1
test-command = "python -c \"import secantus, wiredtiger; print(secantus.__name__, wiredtiger.__version__)\""

[tool.cibuildwheel.linux]
# manylinux x86_64 + aarch64; install swig in the build container.
archs = ["x86_64", "aarch64"]
before-build = "yum install -y swig || apt-get update && apt-get install -y swig"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
before-build = "brew install swig"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
