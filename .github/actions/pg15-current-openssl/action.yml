name: pg15-current-openssl
description: >
  Provide a PostgreSQL 15 linked against a current OpenSSL (3.5 LTS), built
  from checksum-verified source and kept in the Actions cache, for the login
  comparisons. Linux runners only. Outputs the `bin` directory the probes
  take as SECANTUS_PG15_BIN.

# Why (RP-747, Joe 2026-11-25): PostgreSQL leaves revocation checking to the
# OpenSSL it links, and OpenSSL's answer moved. With OpenSSL 3.5.9 and 4.1.0
# a delta CRL is never a certificate's list (PostgreSQL sets no
# X509_V_FLAG_USE_DELTAS), so an issuer with only a delta has no list and the
# client is told "unknown ca"; the runner's PGDG postgresql-15 links Ubuntu's
# OpenSSL 3.0, which read the delta as a full list. secantusd-pg keeps the
# current OpenSSL's answer, so the reference the login comparisons run
# against must link a current OpenSSL too -- which no package for this runner
# does. Built once per (runner image, versions) and restored after that.
#
# Which scope saves it: a cache saved by a pull_request run is readable by
# that PR alone, and one saved on the default branch by every PR. Each
# tarball is checked against its release's published SHA-256 before it is
# built, so a cache entry only ever holds what those sources build.

inputs:
  openssl-version:
    description: The OpenSSL release to link (3.5 is the current LTS line).
    required: false
    default: "3.5.9"
  postgresql-version:
    description: The PostgreSQL 15 release to build.
    required: false
    default: "15.20"

outputs:
  bin:
    description: "Absolute path of the PostgreSQL bin directory (initdb, pg_ctl, postgres)"
    value: ${{ steps.dir.outputs.bin }}

runs:
  using: composite
  steps:
    - name: Name the build
      id: dir
      shell: bash
      env:
        OSSL: ${{ inputs.openssl-version }}
        PG: ${{ inputs.postgresql-version }}
      run: |
        set -euo pipefail
        d="$HOME/.cache/secantus-pg15-openssl/pg$PG-openssl$OSSL"
        {
          echo "dir=$d"
          echo "bin=$d/pg/bin"
          echo "key=pg15-openssl-$RUNNER_OS-${ImageOS:-unknown}-$RUNNER_ARCH-pg$PG-openssl$OSSL-v1"
        } >> "$GITHUB_OUTPUT"

    - name: Restore the PostgreSQL build
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ steps.dir.outputs.dir }}
        key: ${{ steps.dir.outputs.key }}

    - name: Build OpenSSL and PostgreSQL 15
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        OSSL: ${{ inputs.openssl-version }}
        PG: ${{ inputs.postgresql-version }}
        DIR: ${{ steps.dir.outputs.dir }}
      run: |
        set -euo pipefail
        tmp="$RUNNER_TEMP/pg15-openssl-build"
        rm -rf "$tmp" "$DIR" && mkdir -p "$tmp" "$DIR"
        fetch() {
          for attempt in 1 2 3 4; do
            if curl --fail --silent --show-error --location --max-time 300 \
                 --retry 3 --retry-all-errors --retry-delay 10 -o "$2" "$1"; then
              return 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "download of $1: attempt $attempt failed; retrying in $((attempt * 30))s"
              sleep $((attempt * 30))
            fi
          done
          echo "::error::download of $1 failed after 4 attempts"
          return 1
        }
        cd "$tmp"
        ossl="openssl-$OSSL.tar.gz"
        fetch "https://github.com/openssl/openssl/releases/download/openssl-$OSSL/$ossl" "$ossl"
        fetch "https://github.com/openssl/openssl/releases/download/openssl-$OSSL/$ossl.sha256" "$ossl.sha256"
        # The release's .sha256 is `<hash> *<file>`.
        echo "$(cut -d' ' -f1 "$ossl.sha256")  $ossl" | sha256sum --check --strict
        pg="postgresql-$PG.tar.bz2"
        fetch "https://ftp.postgresql.org/pub/source/v$PG/$pg" "$pg"
        fetch "https://ftp.postgresql.org/pub/source/v$PG/$pg.sha256" "$pg.sha256"
        sha256sum --check --strict "$pg.sha256"

        tar xzf "$ossl"
        (cd "openssl-$OSSL" \
          && ./Configure --prefix="$DIR/openssl" --libdir=lib shared no-tests no-docs \
          && make -j"$(nproc)" >/dev/null \
          && make install_sw >/dev/null)

        tar xjf "$pg"
        # Only what the login probes reach: TLS. The rpath makes the server
        # load this OpenSSL, never the runner's.
        (cd "postgresql-$PG" \
          && ./configure --prefix="$DIR/pg" --with-openssl --without-readline \
               --without-zlib --without-icu \
               CPPFLAGS="-I$DIR/openssl/include" \
               LDFLAGS="-L$DIR/openssl/lib -Wl,-rpath,$DIR/openssl/lib" >/dev/null \
          && make -j"$(nproc)" >/dev/null \
          && make install >/dev/null)
        rm -rf "$tmp"

    - name: Check it links the OpenSSL it was built with
      shell: bash
      env:
        DIR: ${{ steps.dir.outputs.dir }}
        BIN: ${{ steps.dir.outputs.bin }}
        OSSL: ${{ inputs.openssl-version }}
      run: |
        set -euo pipefail
        "$BIN/postgres" --version
        ldd "$BIN/postgres" | grep -E "libssl|libcrypto"
        if ! ldd "$BIN/postgres" | grep -q "$DIR/openssl/lib/libssl"; then
          echo "::error::$BIN/postgres does not load $DIR/openssl/lib/libssl"
          exit 1
        fi
        got=$("$DIR/openssl/bin/openssl" version | cut -d' ' -f2)
        if [ "$got" != "$OSSL" ]; then
          echo "::error::OpenSSL reports $got, expected $OSSL"
          exit 1
        fi

    # Saved straight after the build, so a comparison that fails later still
    # leaves it cached.
    - name: Save the PostgreSQL build
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ steps.dir.outputs.dir }}
        key: ${{ steps.dir.outputs.key }}
