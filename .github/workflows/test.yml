name: Tests

on:
  push:
    branches: [main]
    # Skip the matrix when a commit only touches docs / license / markdown.
    # GitHub considers paths-ignore satisfied (and skips the run) when EVERY
    # changed file matches one of these patterns. Anything else here — code,
    # tests, pyproject.toml, the workflows themselves — runs the full matrix.
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - 'docs/**'
  # Weekly full-matrix run: every Monday 06:00 UTC, exercises all
  # supported CPython versions (3.10–3.13) across Linux/Windows.
  # Push/PR runs only test 3.10 on each OS to keep latency tight; this
  # cron catches version-specific regressions before they accumulate.
  # macOS is intentionally excluded from this CI workflow — its runners
  # build vendored WiredTiger from source on a slow, contended pool (10–40+
  # min, occasionally hanging), which is too costly to gate every push/PR on.
  # macOS wheels are still built and validated at release time (publish.yml).
  schedule:
    - cron: '0 6 * * 1'
  # Manual full-matrix trigger from the Actions tab. Same effect as the
  # cron firing — useful when you want to revalidate against all
  # versions on demand without waiting for Monday.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only check out the repo, restore caches, and run
# the test suite — none of which need write access to repo contents. Declaring
# an explicit read-only scope drops the default token's broader grant. (§I6)
permissions:
  contents: read

jobs:
  test:
    # The Linux lane. Windows runs as the sharded ``test-windows`` job below;
    # macOS is excluded from CI entirely — built at release only (see
    # top-of-file note).
    runs-on: ubuntu-latest
    # The whole suite runs in ~4 min locally; 30 min is generous for CI. Without
    # this, a hung run (a daemon/thread not reaped — historically a rust-server
    # stop() / change-stream-tail wedge, see the faulthandler watchdog in
    # tests/conftest.py) blocks the runner until GitHub's 6-hour kill with no
    # diagnostics. macOS is dropped from this matrix for the same flakiness
    # (9e16e49); the cap also protects the release-time macOS run.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Push / PR: 3.10 only (fast feedback). Schedule / workflow_dispatch:
        # full version sweep.
        python-version: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["3.10","3.11","3.12","3.13"]' || '["3.10"]') }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - name: Checkout the WiredTiger submodule
        # Only vendor/wiredtiger feeds the build. ``submodules: recursive``
        # cloned all 12 vendored submodules — 11 of them driver-gauge repos
        # (mongo-java-driver, mongo-c-driver, ...) whose gigabytes of history
        # only the weekly validate workflow reads. Shallow-init just WT; fall
        # back to a full fetch if the shallow probe is refused.
        shell: bash
        run: >-
          git submodule update --init --depth 1 vendor/wiredtiger ||
          git submodule update --init vendor/wiredtiger

      - name: Free up disk space
        # The durable-storage lane (ubuntu only) keeps thousands of on-disk
        # WiredTiger homes for the whole session — tmp_path_retention_policy is
        # pinned to "all" because deleting a passed test's WT home mid-session
        # races WT's background threads → WT_PANIC (see tests/conftest.py). Each
        # instance is already minimised (~10 MB via log=(prealloc=false)), but
        # thousands of them approach the runner's ~21 GB free and tipped over
        # with "No space left on device". Reclaim ~15-20 GB of preinstalled
        # toolchains this build never uses (kept: the hostedtoolcache that
        # setup-python reads). See tasks/backlog.md.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
          df -h /

      - name: Install swig
        run: sudo apt-get update && sudo apt-get install -y swig

      - name: Install MongoDB CLI tools
        # mongosh + Database Tools so the CLI-tool conformance tests
        # (tests/test_mongosh.py, test_mongodump_restore.py,
        # test_mongoimport_export.py, test_mongofiles.py,
        # test_mongostat_mongotop.py) run instead of skipping — they
        # skipif the binaries are absent. Windows is intentionally
        # omitted: the mongosh tests skip on win32 by design
        # (PowerShell --eval quoting), leaving only marginal coverage
        # for a slow, flake-prone choco install.
        run: |
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo "deb [signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-mongosh mongodb-database-tools

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
          # Default ``cache-dependency-glob`` is ``**/uv.lock``; on
          # Windows the recursive walk trips over deep paths under
          # vendor/mongo-ruby-driver (EPERM at .evergreen/atlas).
          # We only have one lock file at the repo root, so the
          # narrower glob both fixes Windows and avoids the wasted
          # filesystem traversal on every runner.
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        # ``--extra admin`` brings in httpx / fastapi / uvicorn used by
        # tests/test_admin_*.py; without it those tests error at import
        # time. ``website`` is intentionally excluded — pelican / boto3
        # aren't exercised by pytest and would just slow CI down.
        # ``--python`` pins the venv to the MATRIX interpreter: without it
        # ``uv sync`` honours the repo's ``.python-version`` (3.12), so every
        # matrix cell — including the scheduled 3.10-3.13 sweep — was silently
        # testing 3.12 (a "3.10" job's traceback showed hostedtoolcache
        # Python 3.12.10).
        run: uv sync --python ${{ matrix.python-version }} --extra dev --extra admin  # also builds vendored WT via scikit-build-core

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Tests
        # ``--timeout=120 --timeout-method=thread`` catches deadline-
        # exceeded hangs (test body busy-loops or blocks on a stuck
        # producer) — independently of worker restarts.
        #
        # ``--max-worker-restart=3``: a few subprocess/threading-heavy tests
        # (admin websocket change-streams, cross-driver smokes) intermittently
        # crash their xdist worker on a teardown race (native "node down: not
        # properly terminated"). With ``=0`` that fatally fails the whole run
        # ~half the time, blocking every PR on an unrelated flake. A bounded
        # restart budget lets xdist restart the dead worker and re-run the
        # crashed test, so a *transient* crash retries to green; a
        # *deterministic* crash re-crashes on retry and exhausts the budget,
        # still failing loudly with the test's name. The original ``=0`` was
        # set to avoid a silent "hang at 97%" where the parent waited forever
        # on a dead worker — but that hang mode is now caught by the
        # ``--timeout`` above regardless, so the restart budget is safe.
        run: uv run python -m pytest --timeout=120 --timeout-method=thread --max-worker-restart=3


  # The Windows lane, split from the ``test`` job and sharded two ways so the
  # slowest platform stops being the workflow's critical path (~20 min in one
  # job on a 4-vCPU runner). The split is complete by construction: the ``sql``
  # shard runs exactly the files the ``core`` shard ``--ignore-glob``s, so a new
  # test file always lands in exactly one shard. Lint runs on Linux only — it is
  # platform-independent.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Push / PR: 3.10 only. Schedule / workflow_dispatch: full sweep.
        python-version: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["3.10","3.11","3.12","3.13"]' || '["3.10"]') }}
        shard: [sql, core]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - name: Checkout the WiredTiger submodule
        # See the ``test`` job's twin step for why this replaces
        # ``submodules: recursive``.
        shell: bash
        run: >-
          git submodule update --init --depth 1 vendor/wiredtiger ||
          git submodule update --init vendor/wiredtiger

      - name: Disable Defender real-time scanning
        # Every test opens its own on-disk WiredTiger home under tmp_path —
        # thousands of short-lived small files per run. Defender's real-time
        # engine scans each one synchronously on create/write/close, which
        # taxes exactly this workload; the runner VM is ephemeral and builds
        # only this checkout, so scanning it buys nothing. Best-effort: if the
        # image ever locks the preference, fall through rather than fail.
        shell: pwsh
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true }
          catch { Write-Warning "could not disable Defender real-time scanning: $_" }

      - name: Put temp files on the runner work disk
        # pytest's tmp_path (→ every WT home) follows TMP/TEMP, which points at
        # the small OS-disk profile temp dir; RUNNER_TEMP lives on the runner's
        # work disk, provisioned for build I/O and wiped between jobs anyway.
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install swig
        # SWIG ships preinstalled on windows-2022 runners, but choco
        # re-installs idempotently to defend against runner image
        # refreshes that drop it. Same line cibuildwheel uses for
        # publish-time wheel builds.
        run: choco install -y swig

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
          # Same narrow glob as the ``test`` job: one lock file at the repo
          # root, and the default recursive walk trips on deep vendor paths.
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        # ``--python`` pins the venv to the MATRIX interpreter: without it
        # ``uv sync`` honours the repo's ``.python-version`` (3.12), so every
        # matrix cell — including the scheduled 3.10-3.13 sweep — was silently
        # testing 3.12 (a "3.10" job's traceback showed hostedtoolcache
        # Python 3.12.10).
        run: uv sync --python ${{ matrix.python-version }} --extra dev --extra admin  # also builds vendored WT via scikit-build-core

      - name: Install tzdata
        # Windows ships no IANA timezone database; Python's
        # ``zoneinfo`` returns nothing for ``ZoneInfo("Europe/Dublin")``
        # without it. ``tzdata`` is a tiny pure-Python package that
        # bundles the IANA data.
        run: uv pip install tzdata

      - name: Tests (${{ matrix.shard }} shard)
        # Same pytest flags as the ``test`` job (see the comments there). The
        # ``sql`` shard is the SQL engine + PG-wire suites; ``core`` is
        # everything else. git-bash expands the globs.
        shell: bash
        run: |
          if [ "${{ matrix.shard }}" = "sql" ]; then
            uv run python -m pytest tests/test_sql_*.py tests/test_pgserver*.py \
              --timeout=120 --timeout-method=thread --max-worker-restart=3
          else
            uv run python -m pytest \
              --ignore-glob='tests/test_sql_*.py' --ignore-glob='tests/test_pgserver*.py' \
              --timeout=120 --timeout-method=thread --max-worker-restart=3
          fi

  # The slow + durable lanes, split out of the ``test`` matrix job so they run
  # in PARALLEL with the fast suite instead of serially after it: the durable
  # pass re-runs the whole suite and roughly doubled the Linux lane's wall
  # time (~708s fast + ~618s durable + ~59s slow serial in one job). Same
  # commands, same coverage, same python-version sweep on schedule — only the
  # job boundary moved. Setup cost (~3 min) is paid once more in exchange for
  # taking ~11 min off the workflow's critical path.
  test-durable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["3.10","3.11","3.12","3.13"]' || '["3.10"]') }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - name: Checkout the WiredTiger submodule
        # See the ``test`` job's twin step for why this replaces
        # ``submodules: recursive``.
        shell: bash
        run: >-
          git submodule update --init --depth 1 vendor/wiredtiger ||
          git submodule update --init vendor/wiredtiger

      - name: Free up disk space
        # The durable lane keeps thousands of on-disk WiredTiger homes for the
        # whole session (tmp_path_retention_policy is pinned to "all" — see the
        # ``test`` job's twin step and tests/conftest.py) and tipped over the
        # runner's ~21 GB free without this.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
          df -h /

      - name: Install swig
        run: sudo apt-get update && sudo apt-get install -y swig

      - name: Install MongoDB CLI tools
        # Same rationale as the ``test`` job: without mongosh + Database Tools
        # the CLI-tool conformance tests skip, and the durable pass must cover
        # exactly what the fast pass covers.
        run: |
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo "deb [signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-mongosh mongodb-database-tools

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        # ``--python`` pins the venv to the MATRIX interpreter: without it
        # ``uv sync`` honours the repo's ``.python-version`` (3.12), so every
        # matrix cell — including the scheduled 3.10-3.13 sweep — was silently
        # testing 3.12 (a "3.10" job's traceback showed hostedtoolcache
        # Python 3.12.10).
        run: uv sync --python ${{ matrix.python-version }} --extra dev --extra admin  # also builds vendored WT via scikit-build-core

      - name: Slow tests
        # Long-running stress / scaling tests carry ``@pytest.mark.slow`` and are
        # excluded from the default suite (addopts ``-m 'not ... slow'``) to keep
        # the inner loop fast. Run them here — once, on Linux — so the races they guard (the xdist-worker-crash
        # teardown drain in test_server_shutdown; the WT concurrency-ceiling
        # benchmark in test_concurrency) stay covered instead of running nowhere.
        # A command-line ``-m slow`` overrides the addopts marker filter while
        # ``-n auto``/``--dist=loadgroup`` from addopts are retained.
        run: uv run python -m pytest -m slow --timeout=120 --timeout-method=thread --max-worker-restart=3

      - name: Durable-storage tests
        # The default suite above runs FAST (the test conftest sets
        # ``SECANTUS_TEST_FAST_STORAGE=1``: journal on, close-checkpoint skipped),
        # so it does NOT exercise the checkpoint-durability path. Re-run the whole
        # suite here with ``SECANTUS_FORCE_DURABLE=1`` — which overrides the fast
        # default inside ``Storage`` — so the real journal + close-checkpoint
        # durability behaviour (schema, persistence, close-and-reopen, PITR /
        # backup) is exercised on every push. Once, on Linux. This is the
        # "real durable disk testing" path.
        env:
          SECANTUS_FORCE_DURABLE: "1"
        run: uv run python -m pytest --timeout=120 --timeout-method=thread --max-worker-restart=3

  # The matrix above runs the pure-Python server. This job builds the Rust core
  # (``_secantus_core``) and pins each Rust engine byte-for-byte against its
  # pure-Python counterpart via the engine-parity suites (the operator oracle).
  # NOTE: the old ``SECANTUS_ENGINE=rust`` full-suite step was removed when the
  # in-process engine selection was retired (two-server model) — with no Python
  # module delegating to ``_secantus_core`` any more, running the full suite
  # under that env var was a no-op re-run of the ``test`` job and a flake source.
  # The Rust engines are now exercised only as the separate Rust server and via
  # these parity suites.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - name: Checkout the WiredTiger submodule
        # Only vendor/wiredtiger feeds the build. ``submodules: recursive``
        # cloned all 12 vendored submodules — 11 of them driver-gauge repos
        # (mongo-java-driver, mongo-c-driver, ...) whose gigabytes of history
        # only the weekly validate workflow reads. Shallow-init just WT; fall
        # back to a full fetch if the shallow probe is refused.
        shell: bash
        run: >-
          git submodule update --init --depth 1 vendor/wiredtiger ||
          git submodule update --init vendor/wiredtiger

      - name: Install swig
        run: sudo apt-get update && sudo apt-get install -y swig

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable
        with:
          components: clippy, rustfmt

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev --extra admin  # also builds vendored WT

      - name: Cargo fmt / clippy / unit tests
        # Run across the whole Rust workspace (the pure-engine `secantus-core`
        # lib crate + the `secantus-core-py` PyO3 bindings crate).
        working-directory: crates
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build & install the Rust core
        run: |
          uvx maturin build --release \
            --manifest-path crates/secantus-core-py/Cargo.toml --out dist-rust
          uv pip install dist-rust/secantus_core-*.whl

      - name: Engine-parity suites (pure-Python vs Rust)
        run: >-
          uv run python -m pytest
          tests/test_rust_sortkey_parity.py tests/test_rust_query_parity.py
          tests/test_rust_update_parity.py tests/test_rust_expressions_parity.py
          tests/test_rust_projection_parity.py tests/test_rust_diff_parity.py
          tests/test_rust_aggregate_parity.py

  # The WiredTiger-linking Rust storage crate (`secantus-storage`, Phase 4) — the
  # secondary-index + CRUD storage layer. It's excluded from the `crates/`
  # workspace (it links the vendored WiredTiger C library and needs libclang), so
  # the `rust` job above doesn't cover it. Here we build the vendored WiredTiger
  # exactly as the wheel does (`uv sync` → scikit-build-core → `build/*/wt-build`,
  # static `libwiredtiger.a` from `-DENABLE_STATIC=ON`), point `secantus-wt`'s
  # build script at it, and run fmt / clippy / the crate's WT-backed test suite.
  # Linux-only — cross-platform WiredTiger *linking* is already proven by the
  # `storage-engine` 3-OS wheel build below.
  rust-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - name: Checkout the WiredTiger submodule
        # Only vendor/wiredtiger feeds the build. ``submodules: recursive``
        # cloned all 12 vendored submodules — 11 of them driver-gauge repos
        # (mongo-java-driver, mongo-c-driver, ...) whose gigabytes of history
        # only the weekly validate workflow reads. Shallow-init just WT; fall
        # back to a full fetch if the shallow probe is refused.
        shell: bash
        run: >-
          git submodule update --init --depth 1 vendor/wiredtiger ||
          git submodule update --init vendor/wiredtiger

      # swig builds WT's Python module; clang/libclang for secantus-wt's bindgen;
      # ninja is the generator the WT ExternalProject forces.
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y swig clang libclang-dev llvm-dev ninja-build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable
        with:
          components: clippy, rustfmt

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        # Builds the vendored WiredTiger into build/<wheel_tag>/wt-build
        # (scikit-build-core's build-dir), the same output the wheel ships.
        run: uv sync --extra dev

      - name: Point secantus-wt at the vendored WiredTiger
        # Resolve the build-dir WT output explicitly rather than relying on
        # build.rs's probe, and fail loudly if the build didn't produce it.
        run: |
          wt=$(ls -d "$PWD"/build/*/wt-build 2>/dev/null | head -1)
          if [ -z "$wt" ] || [ ! -f "$wt/include/wiredtiger.h" ] || [ ! -f "$wt/libwiredtiger.a" ]; then
            echo "vendored WiredTiger not found under build/*/wt-build" >&2
            ls -R build 2>/dev/null | head -50 >&2 || true
            exit 1
          fi
          echo "SECANTUS_WT_INCLUDE=$wt/include" >> "$GITHUB_ENV"
          echo "SECANTUS_WT_LIB=$wt" >> "$GITHUB_ENV"
          echo "Using WiredTiger at $wt"

      - name: Cargo fmt / clippy / test (secantus-storage)
        working-directory: crates/secantus-storage
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Cargo fmt / clippy / test (secantus-storage-adapter, R4b)
        # The WiredTiger → command-`Storage` adapter (R4b). Like secantus-storage
        # it links WiredTiger and is excluded from the workspace, so it's built
        # here against the vendored WT resolved above. clippy/build also settle
        # whether `secantus_storage::Storage` is `Send + Sync` (the command
        # `Storage` trait's supertrait). Its `tests/command_*_wt.rs` drive the
        # command layer end-to-end through the real WT adapter — the layer that
        # catches command-behaviour regressions — so run them here.
        working-directory: crates/secantus-storage-adapter
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  # Builds the main `secantus` wheel with the off-by-default storage-engine flag
  # flipped ON (SECANTUS_BUILD_STORAGE_ENGINE=ON): the Rust `_secantus_storage`
  # extension links the SAME bundled WiredTiger this wheel already builds and
  # ships inside it. Proves the "bundle behind a build flag" packaging end to end
  # across Linux / Windows (macOS at release only — see top-of-file note). The
  # DEFAULT wheel build (flag OFF, no Rust/clang needed) is covered by the
  # `test` matrix and wheels.yml.
  storage-engine:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS excluded — built at release only (see top-of-file note).
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - name: Checkout the WiredTiger submodule
        # Only vendor/wiredtiger feeds the build. ``submodules: recursive``
        # cloned all 12 vendored submodules — 11 of them driver-gauge repos
        # (mongo-java-driver, mongo-c-driver, ...) whose gigabytes of history
        # only the weekly validate workflow reads. Shallow-init just WT; fall
        # back to a full fetch if the shallow probe is refused.
        shell: bash
        run: >-
          git submodule update --init --depth 1 vendor/wiredtiger ||
          git submodule update --init vendor/wiredtiger

      # bindgen needs libclang; the WT ExternalProject forces the Ninja
      # generator; swig builds WT's (unused-here but configured) Python module.
      - name: Disable Defender real-time scanning (Windows)
        if: runner.os == 'Windows'
        # Real-time scanning synchronously inspects every file the build
        # creates (cargo + CMake object files, the WT tree, wheel staging) on
        # an ephemeral VM that builds only this checkout. Best-effort.
        shell: pwsh
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true }
          catch { Write-Warning "could not disable Defender real-time scanning: $_" }

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y swig clang libclang-dev llvm-dev ninja-build

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        # clang/libclang come from the Xcode command line tools already on the
        # runner; just add swig + ninja.
        run: brew install swig ninja

      - name: Install toolchain (Windows)
        if: runner.os == 'Windows'
        run: choco install -y swig ninja llvm

      - name: Point bindgen at libclang (Windows)
        if: runner.os == 'Windows'
        # clang-sys doesn't always find choco's LLVM on PATH within the same job;
        # pin it explicitly for the build step below.
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build the secantus wheel with the storage engine ON
        # scikit-build-core forwards SKBUILD_CMAKE_DEFINE entries as -D defines,
        # so this flips the CMake option ON for this build only. The cargo build
        # of the extension runs inside CMake, linking the WiredTiger built above.
        env:
          SKBUILD_CMAKE_DEFINE: SECANTUS_BUILD_STORAGE_ENGINE=ON
        run: uv build --wheel --out-dir dist-storage

      - name: Assert the extensions are bundled in the wheel
        # importorskip in the smoke tests would silently pass if an extension
        # were missing — the whole point here is that they're PRESENT, so fail
        # hard. Both the storage engine (_secantus_storage) and the Rust server
        # handle (_secantus_server, R6) are built by CMake under the flag.
        # bash on all three OSes (git-bash on Windows) for the glob expansion.
        shell: bash
        run: >-
          uv run --no-project --with "$(ls dist-storage/*.whl)"
          python -c "import _secantus_storage, _secantus_server;
          print('bundled OK:', _secantus_storage.__file__, _secantus_server.__file__)"

      - name: Assert the wheel bundles secantusd-rs on PATH + it runs (non-Windows)
        # CMake installs the standalone binary into the wheel's scripts dir
        # (SKBUILD_SCRIPTS_DIR), so installing the wheel puts `secantusd-rs` on
        # PATH — distinct from the pure-Python `secantus.cli:main` `secantusd-py`
        # console script. Drive the bundled binary through the same smoke test
        # via SECANTUSDB_BIN. Windows is skipped (the bin isn't built there; see
        # CMakeLists.txt / tasks/backlog.md §7).
        if: runner.os != 'Windows'
        shell: bash
        run: |
          whl=$(ls dist-storage/*.whl)
          uv run --no-project --with pymongo --with pytest --with "$whl" bash -c '
            set -e
            bin=$(command -v secantusd-rs) || { echo "secantusd-rs not on PATH after install" >&2; exit 1; }
            echo "secantusd-rs -> $bin"
            "$bin" --version
            SECANTUSDB_BIN="$bin" python -m pytest tests/test_rust_binary_smoke.py \
              -o addopts= -p no:cacheprovider -q
          '

      - name: Storage + Rust-server smoke tests
        # test_rust_storage_smoke.py drives the storage engine; test_rust_server
        # _smoke.py drives the embedded Rust server (R6) end-to-end via pymongo —
        # the first pymongo → Rust → WiredTiger conformance check.
        shell: bash
        run: >-
          uv run --no-project --with pymongo --with pytest
          --with "$(ls dist-storage/*.whl)"
          python -m pytest tests/test_rust_storage_smoke.py tests/test_rust_server_smoke.py
          -o addopts= -p no:cacheprovider -q

      - name: Build + smoke the standalone secantusd-rs binary (R7)
        # The bin crate links the SAME vendored WiredTiger the wheel build above
        # produced under build/*/wt-build (scikit-build-core's build-dir), via
        # build.rs's SECANTUS_WT_INCLUDE / SECANTUS_WT_LIB override. Windows is
        # skipped: build.rs probes libwiredtiger.a/.so, which the MSVC build
        # doesn't produce — the Windows artifact ships via the wheel's CMake
        # path only (tracked in tasks/backlog.md §7).
        if: runner.os != 'Windows'
        shell: bash
        run: |
          wt=$(ls -d "$PWD"/build/*/wt-build 2>/dev/null | head -1)
          if [ -z "$wt" ] || [ ! -f "$wt/include/wiredtiger.h" ]; then
            echo "vendored WiredTiger not found under build/*/wt-build" >&2
            exit 1
          fi
          export SECANTUS_WT_INCLUDE="$wt/include" SECANTUS_WT_LIB="$wt"
          cargo build --manifest-path crates/secantusdb/Cargo.toml
          uv run --no-project --with pymongo --with pytest \
            python -m pytest tests/test_rust_binary_smoke.py \
            -o addopts= -p no:cacheprovider -q
