name: Tests

on:
  push:
    branches: [main]
    # Skip the run when a commit only touches docs / license / markdown /
    # the marketing site (website/** — excluded from sdist/wheel, no runtime code).
    # GitHub considers paths-ignore satisfied (and skips the run) when EVERY
    # changed file matches one of these patterns. Anything else here — code,
    # tests, pyproject.toml, the workflows themselves — runs the workflow.
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - 'docs/**'
      - 'website/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - 'docs/**'
      - 'website/**'
  # Weekly run, every Monday 06:00 UTC, so a week without merges still gets
  # a result against the current runner images and dependencies.
  schedule:
    - cron: '0 6 * * 1'
  # Manual trigger from the Actions tab.
  workflow_dispatch:

# Per-ref lane: a newer push to the same ref cancels that ref's stale run, but
# distinct refs never cancel each other (one feature branch per session = one CI
# lane per session).
#
# Cancellation is disabled on `main`, where every merge lands on the same ref:
# with unconditional cancel-in-progress, a run of merges cancels each other's
# post-merge matrix, so the default branch goes long stretches with no completed
# result and a breakage can't be attributed to the commit that caused it. On
# `main` runs now queue and each completes; PR branches keep newest-push-wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: these jobs only check out the repo, restore caches, and run
# the test suite — none of which need write access to repo contents. Declaring
# an explicit read-only scope drops the default token's broader grant. (§I6)
permissions:
  contents: read

jobs:
  test:
    # Lint, format, and the tests that are not Python-server tests.
    #
    # The Python servers are FULLY DEPRECATED (Joe, 2026-10-20) and CI no
    # longer tests them. This job replaced three: ``test`` (4 Linux + 4 macOS
    # groups), ``test-windows`` (4 groups) and ``test-durable`` (up to 8
    # groups), all of which ran the whole pytest suite, which is mostly the
    # Python servers. ``tools/ci_test_selection.py`` picks the files that run
    # here, by a rule (a file importing the ``secantus`` package is a
    # Python-server test), so a new file lands on the right side without a list
    # to keep. The Rust-server tests that need a built server skip here and run
    # in ``storage-engine`` and ``pg-oracle`` below.
    #
    # What is lost, by decision: every Python-server test, the macOS and
    # Windows runs of them, the SECANTUS_FORCE_DURABLE lane (which governed the
    # Python ``Storage``) and the CPython 3.10-3.13 sweep. Ubuntu, 3.12 only.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.12"
      # Where the crash faulthandler (tests/conftest.py) writes a per-worker
      # stack on a fatal signal; uploaded below on failure.
      SECANTUS_FAULTHANDLER_DIR: ${{ github.workspace }}/faulthandler-dumps
      # CI keeps the 25-min hang deadline (job cap is 30 min); the local
      # conftest default is 90 min so shared-box runs don't self-destruct.
      SECANTUS_HANG_SECONDS: "1500"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Move the host time zone off UTC
        # Every hosted runner is UTC, which hides any code that wrongly uses
        # the host's local time. See .github/actions/non-utc-host.
        uses: ./.github/actions/non-utc-host
      - name: Checkout the WiredTiger submodule
        # The ``secantus`` package build still compiles WiredTiger, and the
        # dev sync needs it. Shallow-init just WT.
        shell: bash
        run: >-
          git submodule update --init --depth 1 vendor/wiredtiger ||
          git submodule update --init vendor/wiredtiger

      - name: Install toolchain
        uses: ./.github/actions/apt-install
        with:
          packages: swig liblz4-dev

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
          # setup-uv keys its cache on the interpreter at ITS step, not on
          # UV_PYTHON, and prunes pre-built wheels before saving by default;
          # both made the cache useless (see the ``rust`` job).
          prune-cache: false
          cache-suffix: py3.12
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      # --- WiredTiger build cache -------------------------------------
      # Restored by exact key or not at all; see the ``rust`` job for
      # why the build interpreter is pinned and what goes into the key.
      - name: Pin the build interpreter so the cache can actually be reused
        id: pybuild
        shell: bash
        run: |
          p=$(uv python find 3.12 2>/dev/null || uv python find)
          echo "SKBUILD_CMAKE_DEFINE=Python3_EXECUTABLE=$p" >> "$GITHUB_ENV"
          echo "path=$p" >> "$GITHUB_OUTPUT"
          echo "pinned build interpreter: $p"

      - name: Compute WiredTiger build-cache key
        id: wtkey
        shell: bash
        run: |
          echo "wt=$(git rev-parse HEAD:vendor/wiredtiger)" >> "$GITHUB_OUTPUT"
          echo "py=$(printf %s '${{ steps.pybuild.outputs.path }}' | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
          cfg=$(cat CMakeLists.txt cmake/*.py cmake/*.cmake pyproject.toml | sha256sum | cut -c1-16)
          echo "cfg=$cfg" >> "$GITHUB_OUTPUT"
          echo "img=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore the WiredTiger build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build
          # NO restore-keys, deliberately: exact key or cold build.
          key: wtbuild-${{ runner.os }}-${{ steps.wtkey.outputs.img }}-py3.12-engineoff-wt${{ steps.wtkey.outputs.wt }}-cfg${{ steps.wtkey.outputs.cfg }}-py${{ steps.wtkey.outputs.py }}

      - name: Sync dependencies
        # ``--extra admin`` brings in httpx / fastapi / uvicorn, which the ops
        # board tests import.
        run: uv sync --extra dev --extra admin  # also builds vendored WT via scikit-build-core

      # `.`, not a path list: a named list misses the next directory someone
      # adds. ruff already skips gitignored trees and the vendored submodules.
      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Select the tests
        shell: bash
        run: |
          uv run python tools/ci_test_selection.py > selected-tests.txt
          wc -l selected-tests.txt

      - name: Tests
        # ``--timeout`` catches a hang inside a test; ``--max-worker-restart=3``
        # lets a transient xdist worker crash retry while a deterministic one
        # still fails with the test's name.
        shell: bash
        run: |
          uv run python -m pytest $(cat selected-tests.txt) \
            --timeout=120 --timeout-method=thread --max-worker-restart=3

      - name: Slow tests
        # ``addopts`` excludes ``slow``; run the selected files' slow tests too.
        shell: bash
        run: |
          uv run python -m pytest -m slow $(cat selected-tests.txt) \
            --timeout=120 --timeout-method=thread --max-worker-restart=3

      - name: Prune empty faulthandler dumps
        # A clean worker leaves a 0-byte file; drop those so the artifact below
        # materialises only when a worker actually crashed.
        if: failure()
        shell: bash
        run: find "${{ github.workspace }}/faulthandler-dumps" -type f -empty -delete 2>/dev/null || true

      - name: Upload faulthandler crash dumps
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: faulthandler-test
          path: ${{ github.workspace }}/faulthandler-dumps/*.log
          if-no-files-found: ignore
          retention-days: 14

  # The Rust workspace: fmt, clippy and the crates' own tests. It used to also
  # build ``_secantus_core`` and run the engine-parity suites (Rust engines vs
  # the pure-Python ones); those stopped with the Python servers' full
  # deprecation (2026-10-20), since a drift detector against a deprecated engine
  # no longer tells anyone anything they act on.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Move the host time zone off UTC
        # Every hosted runner is UTC, which hides any code that wrongly uses
        # the host's local time. See .github/actions/non-utc-host for why
        # Newfoundland, and why the host zone rather than TZ.
        uses: ./.github/actions/non-utc-host
      - name: Checkout the WiredTiger submodule
        # Only vendor/wiredtiger feeds the build. ``submodules: recursive``
        # cloned all 12 vendored submodules — 11 of them driver-gauge repos
        # (mongo-java-driver, mongo-c-driver, ...) whose gigabytes of history
        # only the weekly validate workflow reads. Shallow-init just WT; fall
        # back to a full fetch if the shallow probe is refused.
        shell: bash
        run: >-
          git submodule update --init --depth 1 vendor/wiredtiger ||
          git submodule update --init vendor/wiredtiger

      - name: Install swig
        uses: ./.github/actions/apt-install
        with:
          packages: swig liblz4-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable
        with:
          components: clippy, rustfmt

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
          # Two settings, both needed, that fix a cache that has never worked.
          #
          # THE KEY. setup-uv derives its key from the interpreter present at
          # ITS step — the runner default (3.12.x) — not from UV_PYTHON, which
          # this workflow sets later per matrix cell. So every job on an OS
          # shared ONE key while installing for different interpreters. Python
          # wheels are ABI-specific (numpy-cp310 != numpy-cp312), so whichever
          # job saved first won the key and the rest restored a cache full of
          # wheels they could not use: a "hit" that still re-downloads
          # everything. Verified from CI logs — the 3.10 and 3.12 lanes printed
          # byte-identical keys. cache-suffix splits them per interpreter.
          #
          # THE CONTENT. setup-uv also runs `uv cache prune --ci` before saving,
          # which drops pre-built wheels on the theory they are cheap to
          # re-fetch; that left ~2 MB cached and the whole dependency set
          # re-downloaded each run. Measured locally, a full cache is worth it:
          # a deps-only sync goes 23s cold -> 1.9s warm, and 0.36s from a cache
          # that was tarred and restored (so it survives the round trip GitHub
          # Actions puts it through).
          #
          # cache-python is deliberately NOT set: restoring uv's managed
          # python-dir fails on NTFS (os error 267, see #524), and Windows takes
          # its interpreter from the runner tool cache instead.
          prune-cache: false
          cache-suffix: py3.12
          cache-dependency-glob: uv.lock

      # See the matrix jobs: Windows uses the runner tool cache (no NTFS
      # python-dir junction to restore, no 28 MB re-download); UV_PYTHON is
      # repointed at that interpreter. Non-Windows keeps the uv-managed 3.12.
      - name: Set up Python 3.12
        if: runner.os != 'Windows'
        run: uv python install 3.12
      - name: Set up Python 3.12 (Windows tool cache)
        if: runner.os == 'Windows'
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Point uv at the tool-cached interpreter (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "UV_PYTHON=${{ steps.setup-python.outputs.python-path }}"

      # --- WiredTiger build cache -------------------------------------
      # The vendored WiredTiger C build is ~100s in EVERY job. It is cacheable
      # now (and was not before) because #516 moved patching out of the source
      # tree: patch state lives in build/ beside the ExternalProject stamps
      # that describe it, so a restored dir can no longer pair "already
      # patched" stamps with an unpatched checkout — which would have compiled
      # unpatched source (musl off64_t, strict -Werror, the Windows .pyd
      # suffix) into a subtly wrong artifact rather than a red build.
      #
      # Measured prerequisite: ExternalProject re-runs a step when its RECORDED
      # command text changes, so a restore only helps if that text is identical
      # across jobs. Probed on both platforms with two independent jobs each —
      # fingerprints matched exactly (Linux b1aa5e9d…, Windows ef1fda60…), with
      # the interpreter resolving deterministically under RUNNER_TEMP.
      - name: Pin the build interpreter so the cache can actually be reused
        # Without this the WiredTiger build cache restores and is then thrown
        # away. scikit-build-core writes Python3_EXECUTABLE into the top-level
        # CMakeCache, and under PEP 517 that is the isolated build env — a
        # FRESH temp directory every build. A changed cache variable forces a
        # reconfigure which takes the WiredTiger ExternalProject with it: every
        # stamp regenerates, including `mkdir`, so the prefix is recreated and
        # WiredTiger recompiles from scratch on a cache HIT.
        #
        # Reproduced locally: a second `uv sync` rebuilt WT in 37.9s under 3.10
        # and skipped it in 1.3s under 3.12 — uv reuses a cached build env for
        # the pinned .python-version (3.12) but mints fresh ones for 3.10.
        # That is exactly why the 3.10 test lanes rebuilt (73.6s build phase)
        # while the 3.12 rust lanes did not (4.0s), both on a cache hit.
        #
        # It has to be set HERE rather than inside CMakeLists.txt: scikit-build
        # passes -DPython3_EXECUTABLE on the command line, so CMake has already
        # seen the changed value by the time project code could override it.
        # Substituting the interpreter is ABI-safe — verified by building a
        # wheel with and without the pin and diffing: same name, same 170
        # entries, same tag (cp310-cp310-...).
        id: pybuild
        shell: bash
        run: |
          p=$(uv python find ${{ matrix.python-version }} 2>/dev/null || uv python find)
          echo "SKBUILD_CMAKE_DEFINE=Python3_EXECUTABLE=$p" >> "$GITHUB_ENV"
          echo "path=$p" >> "$GITHUB_OUTPUT"
          echo "pinned build interpreter: $p"

      - name: Compute WiredTiger build-cache key
        id: wtkey
        shell: bash
        run: |
          echo "wt=$(git rev-parse HEAD:vendor/wiredtiger)" >> "$GITHUB_OUTPUT"
          # The pinned interpreter is part of the build's identity: if it moves,
          # the cached tree would reconfigure anyway, so take a cold key instead
          # of restoring something that cannot be reused.
          if command -v sha256sum >/dev/null; then PH="sha256sum"; else PH="shasum -a 256"; fi
          echo "py=$(printf %s '${{ steps.pybuild.outputs.path }}' | $PH | cut -c1-12)" >> "$GITHUB_OUTPUT"
          # Everything that shapes the build. Any change here must produce a
          # cold rebuild rather than reuse objects built under other settings.
          if command -v sha256sum >/dev/null; then H="sha256sum"; else H="shasum -a 256"; fi
          cfg=$(cat CMakeLists.txt cmake/*.py cmake/*.cmake pyproject.toml | $H | cut -c1-16)
          echo "cfg=$cfg" >> "$GITHUB_OUTPUT"
          # ImageVersion is an AMBIENT runner variable. The `env` context only
          # carries workflow-declared vars, so an `env.ImageVersion` reference
          # in a key expands to the empty string — the first cut of this shipped keys
          # like "wtbuild-Linux--py3.10-...", silently dropping the
          # toolchain-drift guard. Read it here, where the shell can see it.
          echo "img=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore the WiredTiger build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build
          # NO restore-keys, deliberately. A partial hit is fine for the cargo
          # cache (it seeds dependency crates) but here a near-miss is exactly
          # the stale state to forbid: exact key or cold build. ImageVersion is
          # in the key so a runner-image toolchain bump cannot reuse objects
          # built by a different compiler.
          key: wtbuild-${{ runner.os }}-${{ steps.wtkey.outputs.img }}-py3.12-engineoff-wt${{ steps.wtkey.outputs.wt }}-cfg${{ steps.wtkey.outputs.cfg }}-py${{ steps.wtkey.outputs.py }}

      - name: Sync dependencies
        run: uv sync --extra dev --extra admin  # also builds vendored WT

      - name: Verify the WiredTiger build is real
        # Fail closed on a bad cache hit. tests/conftest.py installs a STUB
        # wiredtiger module when the extension is missing, so a bare
        # `import wiredtiger` would pass against a broken build — assert the
        # real extension's symbols and version instead.
        shell: bash
        run: |
          uv run python -c "
          import wiredtiger
          v = wiredtiger.wiredtiger_version()
          assert hasattr(wiredtiger, 'wiredtiger_open'), 'stub module, not the real extension'
          assert 'WiredTiger' in v[0], v
          print('WiredTiger OK:', v[0])
          "

      # Cache cargo's registry + `target` dir. Without this the job recompiles
      # all ~240 third-party crates every run (bindgen / clang-sys / s2 / bson
      # …), which is the bulk of its wall-clock — the existing `wtbuild-*` cache
      # covers only the WiredTiger C build, not cargo. The action keys on
      # Cargo.lock + the rustc version, so a dependency bump busts it correctly
      # while a change to our own sources only rebuilds our own crates.
      # `cache-on-failure` still populates it when clippy/test go red, so a
      # red-then-fix cycle doesn't pay the full compile twice.
      - name: Cache cargo registry + target (clean workspace)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: |
            crates
            crates/secantus-pgwire
          cache-on-failure: true

      - name: Cargo fmt / clippy / unit tests
        # Run across the whole Rust workspace (the pure-engine `secantus-core`
        # lib crate + the `secantus-core-py` PyO3 bindings crate).
        working-directory: crates
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Cargo fmt / clippy / tests (secantus-pgwire)
        # SecantusDB's fork of pgwire, which the Rust PostgreSQL server speaks
        # through. It is excluded from the workspace (its own lockfile and
        # target), so the step above never reaches it. It was left out of CI
        # as "upstream's code", but the fork carries our own patches -- the
        # error transcoder, idle events, the TLS changes -- and when it was
        # first linted (2026-10-21) two clippy errors sat in exactly those,
        # with 156 tests that had never run in CI. It links no WiredTiger.
        working-directory: crates/secantus-pgwire
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  # The WiredTiger-linking Rust storage crate (`secantus-storage`, Phase 4) — the
  # secondary-index + CRUD storage layer. It's excluded from the `crates/`
  # workspace (it links the vendored WiredTiger C library and needs libclang), so
  # the `rust` job above doesn't cover it. Here we build the vendored WiredTiger
  # exactly as the wheel does (`uv sync` → scikit-build-core → `build/*/wt-build`,
  # static `libwiredtiger.a` from `-DENABLE_STATIC=ON`), point `secantus-wt`'s
  # build script at it, and run fmt / clippy / the crate's WT-backed test suite.
  # Linux-only — cross-platform WiredTiger *linking* is already proven by the
  # `storage-engine` 3-OS wheel build below.
  rust-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Move the host time zone off UTC
        # Every hosted runner is UTC, which hides any code that wrongly uses
        # the host's local time. See .github/actions/non-utc-host for why
        # Newfoundland, and why the host zone rather than TZ.
        uses: ./.github/actions/non-utc-host
      - name: Checkout the WiredTiger submodule
        # Only vendor/wiredtiger feeds the build. ``submodules: recursive``
        # cloned all 12 vendored submodules — 11 of them driver-gauge repos
        # (mongo-java-driver, mongo-c-driver, ...) whose gigabytes of history
        # only the weekly validate workflow reads. Shallow-init just WT; fall
        # back to a full fetch if the shallow probe is refused.
        shell: bash
        run: >-
          git submodule update --init --depth 1 vendor/wiredtiger ||
          git submodule update --init vendor/wiredtiger

      # swig builds WT's Python module; clang/libclang for secantus-wt's bindgen;
      # ninja is the generator the WT ExternalProject forces.
      - name: Install toolchain
        uses: ./.github/actions/apt-install
        with:
          packages: swig clang libclang-dev llvm-dev ninja-build liblz4-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable
        with:
          components: clippy, rustfmt

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
          # Two settings, both needed, that fix a cache that has never worked.
          #
          # THE KEY. setup-uv derives its key from the interpreter present at
          # ITS step — the runner default (3.12.x) — not from UV_PYTHON, which
          # this workflow sets later per matrix cell. So every job on an OS
          # shared ONE key while installing for different interpreters. Python
          # wheels are ABI-specific (numpy-cp310 != numpy-cp312), so whichever
          # job saved first won the key and the rest restored a cache full of
          # wheels they could not use: a "hit" that still re-downloads
          # everything. Verified from CI logs — the 3.10 and 3.12 lanes printed
          # byte-identical keys. cache-suffix splits them per interpreter.
          #
          # THE CONTENT. setup-uv also runs `uv cache prune --ci` before saving,
          # which drops pre-built wheels on the theory they are cheap to
          # re-fetch; that left ~2 MB cached and the whole dependency set
          # re-downloaded each run. Measured locally, a full cache is worth it:
          # a deps-only sync goes 23s cold -> 1.9s warm, and 0.36s from a cache
          # that was tarred and restored (so it survives the round trip GitHub
          # Actions puts it through).
          #
          # cache-python is deliberately NOT set: restoring uv's managed
          # python-dir fails on NTFS (os error 267, see #524), and Windows takes
          # its interpreter from the runner tool cache instead.
          prune-cache: false
          cache-suffix: py3.12
          cache-dependency-glob: uv.lock

      # See the matrix jobs: Windows uses the runner tool cache (no NTFS
      # python-dir junction to restore, no 28 MB re-download); UV_PYTHON is
      # repointed at that interpreter. Non-Windows keeps the uv-managed 3.12.
      - name: Set up Python 3.12
        if: runner.os != 'Windows'
        run: uv python install 3.12
      - name: Set up Python 3.12 (Windows tool cache)
        if: runner.os == 'Windows'
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Point uv at the tool-cached interpreter (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "UV_PYTHON=${{ steps.setup-python.outputs.python-path }}"

      # --- WiredTiger build cache -------------------------------------
      # The vendored WiredTiger C build is ~100s in EVERY job. It is cacheable
      # now (and was not before) because #516 moved patching out of the source
      # tree: patch state lives in build/ beside the ExternalProject stamps
      # that describe it, so a restored dir can no longer pair "already
      # patched" stamps with an unpatched checkout — which would have compiled
      # unpatched source (musl off64_t, strict -Werror, the Windows .pyd
      # suffix) into a subtly wrong artifact rather than a red build.
      #
      # Measured prerequisite: ExternalProject re-runs a step when its RECORDED
      # command text changes, so a restore only helps if that text is identical
      # across jobs. Probed on both platforms with two independent jobs each —
      # fingerprints matched exactly (Linux b1aa5e9d…, Windows ef1fda60…), with
      # the interpreter resolving deterministically under RUNNER_TEMP.
      - name: Pin the build interpreter so the cache can actually be reused
        # Without this the WiredTiger build cache restores and is then thrown
        # away. scikit-build-core writes Python3_EXECUTABLE into the top-level
        # CMakeCache, and under PEP 517 that is the isolated build env — a
        # FRESH temp directory every build. A changed cache variable forces a
        # reconfigure which takes the WiredTiger ExternalProject with it: every
        # stamp regenerates, including `mkdir`, so the prefix is recreated and
        # WiredTiger recompiles from scratch on a cache HIT.
        #
        # Reproduced locally: a second `uv sync` rebuilt WT in 37.9s under 3.10
        # and skipped it in 1.3s under 3.12 — uv reuses a cached build env for
        # the pinned .python-version (3.12) but mints fresh ones for 3.10.
        # That is exactly why the 3.10 test lanes rebuilt (73.6s build phase)
        # while the 3.12 rust lanes did not (4.0s), both on a cache hit.
        #
        # It has to be set HERE rather than inside CMakeLists.txt: scikit-build
        # passes -DPython3_EXECUTABLE on the command line, so CMake has already
        # seen the changed value by the time project code could override it.
        # Substituting the interpreter is ABI-safe — verified by building a
        # wheel with and without the pin and diffing: same name, same 170
        # entries, same tag (cp310-cp310-...).
        id: pybuild
        shell: bash
        run: |
          p=$(uv python find ${{ matrix.python-version }} 2>/dev/null || uv python find)
          echo "SKBUILD_CMAKE_DEFINE=Python3_EXECUTABLE=$p" >> "$GITHUB_ENV"
          echo "path=$p" >> "$GITHUB_OUTPUT"
          echo "pinned build interpreter: $p"

      - name: Compute WiredTiger build-cache key
        id: wtkey
        shell: bash
        run: |
          echo "wt=$(git rev-parse HEAD:vendor/wiredtiger)" >> "$GITHUB_OUTPUT"
          # The pinned interpreter is part of the build's identity: if it moves,
          # the cached tree would reconfigure anyway, so take a cold key instead
          # of restoring something that cannot be reused.
          if command -v sha256sum >/dev/null; then PH="sha256sum"; else PH="shasum -a 256"; fi
          echo "py=$(printf %s '${{ steps.pybuild.outputs.path }}' | $PH | cut -c1-12)" >> "$GITHUB_OUTPUT"
          # Everything that shapes the build. Any change here must produce a
          # cold rebuild rather than reuse objects built under other settings.
          if command -v sha256sum >/dev/null; then H="sha256sum"; else H="shasum -a 256"; fi
          cfg=$(cat CMakeLists.txt cmake/*.py cmake/*.cmake pyproject.toml | $H | cut -c1-16)
          echo "cfg=$cfg" >> "$GITHUB_OUTPUT"
          # ImageVersion is an AMBIENT runner variable. The `env` context only
          # carries workflow-declared vars, so an `env.ImageVersion` reference
          # in a key expands to the empty string — the first cut of this shipped keys
          # like "wtbuild-Linux--py3.10-...", silently dropping the
          # toolchain-drift guard. Read it here, where the shell can see it.
          echo "img=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore the WiredTiger build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build
          # NO restore-keys, deliberately. A partial hit is fine for the cargo
          # cache (it seeds dependency crates) but here a near-miss is exactly
          # the stale state to forbid: exact key or cold build. ImageVersion is
          # in the key so a runner-image toolchain bump cannot reuse objects
          # built by a different compiler.
          key: wtbuild-${{ runner.os }}-${{ steps.wtkey.outputs.img }}-py3.12-engineoff-wt${{ steps.wtkey.outputs.wt }}-cfg${{ steps.wtkey.outputs.cfg }}-py${{ steps.wtkey.outputs.py }}

      - name: Sync dependencies
        # Builds the vendored WiredTiger into build/<wheel_tag>/wt-build
        # (scikit-build-core's build-dir), the same output the wheel ships.
        run: uv sync --extra dev

      - name: Verify the WiredTiger build is real
        # Fail closed on a bad cache hit. tests/conftest.py installs a STUB
        # wiredtiger module when the extension is missing, so a bare
        # `import wiredtiger` would pass against a broken build — assert the
        # real extension's symbols and version instead.
        shell: bash
        run: |
          uv run python -c "
          import wiredtiger
          v = wiredtiger.wiredtiger_version()
          assert hasattr(wiredtiger, 'wiredtiger_open'), 'stub module, not the real extension'
          assert 'WiredTiger' in v[0], v
          print('WiredTiger OK:', v[0])
          "

      - name: Point secantus-wt at the vendored WiredTiger
        # Resolve the build-dir WT output explicitly rather than relying on
        # build.rs's probe, and fail loudly if the build didn't produce it.
        run: |
          wt=$(ls -d "$PWD"/build/*/wt-build 2>/dev/null | head -1)
          if [ -z "$wt" ] || [ ! -f "$wt/include/wiredtiger.h" ] || [ ! -f "$wt/libwiredtiger.a" ]; then
            echo "vendored WiredTiger not found under build/*/wt-build" >&2
            ls -R build 2>/dev/null | head -50 >&2 || true
            exit 1
          fi
          echo "SECANTUS_WT_INCLUDE=$wt/include" >> "$GITHUB_ENV"
          echo "SECANTUS_WT_LIB=$wt" >> "$GITHUB_ENV"
          echo "Using WiredTiger at $wt"

      # Same rationale as the `rust` job's cache. These two crates are EXCLUDED
      # from the clean workspace (they link WiredTiger), so each has its own
      # `target` dir — both are listed, or the second would still cold-compile.
      # Placed after the WT probe above so `SECANTUS_WT_*` is already resolved.
      # ONE target directory for every WiredTiger-linked crate. They are
      # excluded from the clean workspace, so by default each gets its own
      # target and recompiles the same WT-linked dependencies from scratch.
      # Measured locally: six crates with separate targets came to 1.9 GB;
      # sharing one target covers all six in 1.1 GB. Sharing is what makes
      # gating the extra four AFFORDABLE rather than a disk problem -- it
      # cuts the cache 42% while adding coverage.
      - name: Point every WT-linked crate at one target directory
        run: echo "CARGO_TARGET_DIR=${{ github.workspace }}/crates/wt-target" >> "$GITHUB_ENV"

      - name: Disk before the Rust build
        run: df -h / | tail -1

      - name: Cache cargo registry + target (WT-linked crates)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # All seven roots share the one target above, so this is a single
          # cache, not seven. Keep this list in step with the gate steps below.
          workspaces: |
            crates/secantus-storage -> ../wt-target
            crates/secantus-storage-adapter -> ../wt-target
            crates/secantus-wt -> ../wt-target
            crates/secantus-storage-py -> ../wt-target
            crates/secantus-server-py -> ../wt-target
            crates/secantusdb -> ../wt-target
            crates/secantus-pg -> ../wt-target
          cache-on-failure: true

      - name: Cargo fmt / clippy / test (secantus-storage)
        working-directory: crates/secantus-storage
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # The async/decoupled-oplog parity lane: the whole storage suite again
      # with the drainer pool live (SECANTUS_OPLOG_ASYNC=1, stacked with the
      # non-logged oplog tables the mode ships with — the Finding-9 pairing).
      # tasks/rust-async-oplog-prototype.md names this lane as the
      # precondition for the mode ever becoming a default. Mode-specific
      # tests pin their own mode via StorageOptions (the option beats the env
      # var), so sync-only invariants stay covered by the run above while
      # everything else exercises the async path. Same build — only the env
      # differs, so this re-runs tests without recompiling.
      - name: Cargo test (secantus-storage, async-oplog lane)
        working-directory: crates/secantus-storage
        env:
          SECANTUS_OPLOG_ASYNC: "1"
          SECANTUS_OPLOG_NONLOGGED: "1"
        run: cargo test

      - name: Cargo fmt / clippy / test (secantus-storage-adapter, R4b)
        # The WiredTiger → command-`Storage` adapter (R4b). Like secantus-storage
        # it links WiredTiger and is excluded from the workspace, so it's built
        # here against the vendored WT resolved above. clippy/build also settle
        # whether `secantus_storage::Storage` is `Send + Sync` (the command
        # `Storage` trait's supertrait). Its `tests/command_*_wt.rs` drive the
        # command layer end-to-end through the real WT adapter — the layer that
        # catches command-behaviour regressions — so run them here.
        working-directory: crates/secantus-storage-adapter
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # The four WT-linked crates nothing gated until now -- not here, not in
      # the clean workspace (`cargo` does not warn about an excluded crate, so
      # `./inv rust-test` reports success having never compiled them). Two of
      # these are shipped artifacts: `secantusdb` is the standalone binary and
      # `secantus-server-py` is the embedded handle the Rust gauge drives.
      # clippy (not test) on purpose: it type-checks everything for the cost of
      # a check, and these crates' behaviour is covered by the Python suites.
      # `secantus-pg` (the PostgreSQL server) joined on 2026-10-07: it was built
      # and its integration tests run in another job, but never linted, and six
      # `clippy::drop_non_drop` errors sat in it unreported. The pgwire fork
      # (`secantus-pgwire`) links no WiredTiger, so the `rust` job gates it.
      - name: Cargo fmt / clippy (the remaining WT-linked crates)
        run: |
          set -e
          for crate in secantus-wt secantus-storage-py secantus-server-py secantusdb secantus-pg; do
            echo "::group::$crate"
            (cd "crates/$crate" \
              && cargo fmt --check \
              && cargo clippy --all-targets -- -D warnings)
            echo "::endgroup::"
          done

      - name: Disk after the Rust build
        if: always()
        run: |
          df -h / | tail -1
          du -sh "${CARGO_TARGET_DIR:-crates/wt-target}" 2>/dev/null || true

  # Builds the main `secantus` wheel with the off-by-default storage-engine flag
  # flipped ON (SECANTUS_BUILD_STORAGE_ENGINE=ON): the Rust `_secantus_storage`
  # extension links the SAME bundled WiredTiger this wheel already builds and
  # ships inside it. Proves the "bundle behind a build flag" packaging end to end
  # across Linux / Windows (macOS at release only — see top-of-file note). The
  # DEFAULT wheel build (flag OFF, no Rust/clang needed) is covered by the
  # `test` matrix and wheels.yml.
  storage-engine:
    runs-on: ${{ matrix.os }}
    # Previously uncapped, so a wedged job could burn the runner until GitHub's
    # 6-hour kill. That mattered little at ~12 min on Linux/Windows, but the
    # cron's macOS cell builds WiredTiger from source on a pool where hangs are
    # exactly the documented failure mode (9e16e49), so cap it explicitly.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # macOS joins on the weekly cron only — see the ``test`` job's ``os``
        # entry. This lane bundles the Rust storage engine behind the build
        # flag, so it is the heaviest source build of the three; keeping it off
        # the push/PR path is what makes the macOS coverage affordable. The
        # ``Install toolchain (macOS)`` step below exists for exactly these
        # cells (it was unreachable while this matrix was Linux + Windows only).
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","windows-latest","macos-14"]' || '["ubuntu-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Move the host time zone off UTC
        # Every hosted runner is UTC, which hides any code that wrongly uses
        # the host's local time. See .github/actions/non-utc-host for why
        # Newfoundland, and why the host zone rather than TZ.
        uses: ./.github/actions/non-utc-host
      - name: Checkout the WiredTiger submodule
        # Only vendor/wiredtiger feeds the build. ``submodules: recursive``
        # cloned all 12 vendored submodules — 11 of them driver-gauge repos
        # (mongo-java-driver, mongo-c-driver, ...) whose gigabytes of history
        # only the weekly validate workflow reads. Shallow-init just WT; fall
        # back to a full fetch if the shallow probe is refused.
        shell: bash
        run: >-
          git submodule update --init --depth 1 vendor/wiredtiger ||
          git submodule update --init vendor/wiredtiger

      # bindgen needs libclang; the WT ExternalProject forces the Ninja
      # generator; swig builds WT's (unused-here but configured) Python module.
      - name: Disable Defender real-time scanning (Windows)
        if: runner.os == 'Windows'
        # Real-time scanning synchronously inspects every file the build
        # creates (cargo + CMake object files, the WT tree, wheel staging) on
        # an ephemeral VM that builds only this checkout. Best-effort.
        shell: pwsh
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true }
          catch { Write-Warning "could not disable Defender real-time scanning: $_" }

      - name: Reclaim disk (Windows)
        if: runner.os == 'Windows'
        # This job keeps a WiredTiger home per test for the whole session --
        # `tests/conftest.py` REFUSES a mid-session delete policy, because one
        # was tried and raced WT's background threads into a WT_PANIC cascade,
        # so the homes cannot simply be cleaned up as they finish. The
        # concurrency suite at the end of this job is the heaviest writer of
        # them, and it exhausted the runner with "No space left on device" on a
        # change that added no storage at all (2026-09-05).
        #
        # The `test` job already reclaims preinstalled toolchains on LINUX for
        # exactly this reason; Windows had no equivalent. The Android SDK is the
        # large safely-removable item -- this job needs MSVC, CMake, Python and
        # LLVM, and none of those live under it.
        shell: pwsh
        run: |
          foreach ($p in @('C:\Android', 'C:\Program Files (x86)\Android')) {
            if (Test-Path $p) {
              Write-Host "removing $p"
              Remove-Item -Recurse -Force $p -ErrorAction SilentlyContinue
            }
          }

      - name: Put the test temp dir on the big drive (Windows)
        if: runner.os == 'Windows'
        # THE actual fix. Python's `tempfile` reads TMP/TEMP, which on this
        # image default to `C:\Users\runneradmin\AppData\Local\Temp` -- a
        # SMALL drive. `RUNNER_TEMP` is `D:\a\_temp`, and D: has ~147 GB free
        # and sat idle while C: filled up. `tests/conftest.py` keeps a
        # WiredTiger home per test for the whole session by design (deleting one
        # mid-session races WT's background threads into a WT_PANIC cascade), so
        # the suite genuinely needs the room -- it just needs it on the drive
        # that has it.
        #
        # Measured, not assumed: the run before this step existed reported D: at
        # 3.1G used of 150G while the job died with "No space left on device" on
        # C:. That is the whole bug.
        shell: bash
        run: |
          printf 'TMP=%s\nTEMP=%s\nTMPDIR=%s\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Free disk before the storage tests
        # Report the drive the tests will actually WRITE to, which is not
        # necessarily the one the checkout is on: `df -h .` measures the
        # workspace (D: on Windows) and would have shown 147 GB free on the run
        # that died of a full C:. Reported before and after (paired step at the
        # end of this job) so the DELTA sizes the suite's real appetite.
        shell: bash
        run: |
          python -c "import tempfile; print(tempfile.gettempdir())" > /tmp/tdir 2>/dev/null ||
            echo "${TMP:-.}" > /tmp/tdir
          echo "test temp dir: $(cat /tmp/tdir)"
          df -h "$(cat /tmp/tdir)" || df -h . || true

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: swig clang libclang-dev llvm-dev ninja-build liblz4-dev

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        # clang/libclang come from the Xcode command line tools already on the
        # runner; just add swig + ninja.
        run: brew install swig ninja

      - name: Install toolchain (Windows)
        if: runner.os == 'Windows'
        run: choco install -y swig ninja llvm

      - name: Point bindgen at libclang (Windows)
        if: runner.os == 'Windows'
        # clang-sys doesn't always find choco's LLVM on PATH within the same job;
        # pin it explicitly for the build step below.
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
          # Two settings, both needed, that fix a cache that has never worked.
          #
          # THE KEY. setup-uv derives its key from the interpreter present at
          # ITS step — the runner default (3.12.x) — not from UV_PYTHON, which
          # this workflow sets later per matrix cell. So every job on an OS
          # shared ONE key while installing for different interpreters. Python
          # wheels are ABI-specific (numpy-cp310 != numpy-cp312), so whichever
          # job saved first won the key and the rest restored a cache full of
          # wheels they could not use: a "hit" that still re-downloads
          # everything. Verified from CI logs — the 3.10 and 3.12 lanes printed
          # byte-identical keys. cache-suffix splits them per interpreter.
          #
          # THE CONTENT. setup-uv also runs `uv cache prune --ci` before saving,
          # which drops pre-built wheels on the theory they are cheap to
          # re-fetch; that left ~2 MB cached and the whole dependency set
          # re-downloaded each run. Measured locally, a full cache is worth it:
          # a deps-only sync goes 23s cold -> 1.9s warm, and 0.36s from a cache
          # that was tarred and restored (so it survives the round trip GitHub
          # Actions puts it through).
          #
          # cache-python is deliberately NOT set: restoring uv's managed
          # python-dir fails on NTFS (os error 267, see #524), and Windows takes
          # its interpreter from the runner tool cache instead.
          prune-cache: false
          cache-suffix: py3.12
          cache-dependency-glob: uv.lock

      # See the matrix jobs: Windows uses the runner tool cache (no NTFS
      # python-dir junction to restore, no 28 MB re-download); UV_PYTHON is
      # repointed at that interpreter. Non-Windows keeps the uv-managed 3.12.
      - name: Set up Python 3.12
        if: runner.os != 'Windows'
        run: uv python install 3.12
      - name: Set up Python 3.12 (Windows tool cache)
        if: runner.os == 'Windows'
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Point uv at the tool-cached interpreter (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "UV_PYTHON=${{ steps.setup-python.outputs.python-path }}"

      # --- cargo caching -------------------------------------------------
      # This job became the workflow's critical path once the test lanes were
      # duration-balanced (#501): 11m37, of which the wheel build is 561s on
      # Windows. Instrumenting that build shows cargo is ~445s of it (469
      # crates), against ~100s for the C / WiredTiger build — so the cargo
      # artifacts are the thing worth caching, not the C objects.
      #
      # Reuses the EXISTING documented knob rather than inventing one:
      # CMakeLists.txt honours SECANTUS_CARGO_TARGET as the cargo target root
      # (defaulting to the per-build-tag build dir, which is why nothing is
      # reused today), and wheels.yml / publish.yml already point it at a
      # cached directory. Note ccache is deliberately NOT used here: it is
      # skipped on Windows repo-wide, whereas a cargo target dir is just a
      # directory and caches on every platform.
      - name: Compute WT submodule SHA
        id: wt-sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:vendor/wiredtiger)" >> "$GITHUB_OUTPUT"

      - name: Point cargo at a cacheable target dir
        # The path is OS-specific ON PURPOSE. Under git-bash on Windows $HOME
        # is a POSIX path (/c/Users/runneradmin), which CMake does not accept;
        # a backslash form (C:\...) gets eaten as an escape when the path flows
        # through CMake. Forward slashes are accepted by CMake, cargo and
        # clang-sys alike.
        id: cargodir
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            dir='C:/cargo-target'
          else
            dir="$HOME/.cargo-target"
          fi
          echo "SECANTUS_CARGO_TARGET=$dir" >> "$GITHUB_ENV"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "cargo target root: $dir"

      - name: Restore cargo target + registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ steps.cargodir.outputs.dir }}
            ~/.cargo/registry
            ~/.cargo/git
          # Cargo.lock pins the dependency graph, so a lock change must not
          # reuse stale artifacts. The WT sha is in the key because
          # secantus-wt's bindgen output is derived from the vendored WT
          # headers — a WT bump invalidates those crates even with an unchanged
          # lock. restore-keys let an near-miss still seed the dependency
          # crates, which are the bulk of the 469.
          key: cargo-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}-wt-${{ steps.wt-sha.outputs.sha }}
          restore-keys: |
            cargo-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-${{ matrix.os }}-

      - name: Build the secantus wheel with the storage engine ON
        # scikit-build-core forwards SKBUILD_CMAKE_DEFINE entries as -D defines,
        # so this flips the CMake option ON for this build only. The cargo build
        # of the extension runs inside CMake, linking the WiredTiger built above.
        env:
          SKBUILD_CMAKE_DEFINE: SECANTUS_BUILD_STORAGE_ENGINE=ON
        run: uv build --wheel --out-dir dist-storage


      - name: Assert the extensions are bundled in the wheel
        # importorskip in the smoke tests would silently pass if an extension
        # were missing — the whole point here is that they're PRESENT, so fail
        # hard. Both the storage engine (_secantus_storage) and the Rust server
        # handle (_secantus_server, R6) are built by CMake under the flag.
        # bash on all three OSes (git-bash on Windows) for the glob expansion.
        shell: bash
        run: >-
          uv run --no-project --with "$(ls dist-storage/*.whl)"
          python -c "import _secantus_storage, _secantus_server;
          print('bundled OK:', _secantus_storage.__file__, _secantus_server.__file__)"

      - name: Assert the wheel bundles secantusd-rs on PATH + it runs
        # CMake installs the standalone binary into the wheel's scripts dir
        # (SKBUILD_SCRIPTS_DIR), so installing the wheel puts `secantusd-rs` on
        # PATH — distinct from the pure-Python `secantus.cli:main` `secantusd-py`
        # console script. Drive the bundled binary through the same smoke test
        # via SECANTUSDB_BIN.
        #
        # This ran everywhere-but-Windows on the grounds that "the bin isn't
        # built there". It is: this job's own log shows `Linking C static library
        # wiredtiger.lib` followed by `Building standalone secantusd-rs binary`,
        # because MSVC's static lib is simply named differently from the Unix one
        # and build.rs already looks for both. Running it here keeps the Windows
        # release binary honest on every push instead of only at tag time —
        # `command -v` and the smoke test both work under Git Bash.
        shell: bash
        run: |
          whl=$(ls dist-storage/*.whl)
          uv run --no-project --with pymongo --with pytest --with "$whl" bash -c '
            set -e
            # Resolve through Python, not `command -v`: under Git Bash the latter
            # returns an MSYS path with no .exe (/d/a/.../Scripts/secantusd-rs),
            # which the Windows Python running pytest cannot open. shutil.which
            # gives a native path with the right suffix on every platform.
            bin=$(python -c "import shutil,sys; p=shutil.which(\"secantusd-rs\"); print(p) if p else sys.exit(1)") \
              || { echo "secantusd-rs not on PATH after install" >&2; exit 1; }
            echo "secantusd-rs -> $bin"
            "$bin" --version
            SECANTUSDB_BIN="$bin" python -m pytest tests/test_rust_binary_smoke.py \
              -o addopts= -p no:cacheprovider -q
          '

      - name: Storage + Rust-server smoke tests
        # test_rust_storage_smoke.py drives the storage engine; test_rust_server
        # _smoke.py drives the embedded Rust server (R6) end-to-end via pymongo —
        # the first pymongo → Rust → WiredTiger conformance check.
        #
        # This job runs NAMED files, so an `importorskip("_secantus_server")`
        # file that is not listed here does not run anywhere: it skips in every
        # other job (no extension) and is never invoked in this one. Add new
        # Rust-server files to this list, or they are dead weight.
        #
        # `psycopg` is here for tests/test_pgserver_embedded.py, which drives the
        # embedded PostgreSQL-wire server (`_secantus_server.PgServer`) with a
        # real client. Without it that file `importorskip`s and this lane would
        # report a pass having run none of it -- the exact failure mode this
        # step's list exists to prevent. `trustme` makes the certificates its
        # TLS tests start the server with.
        shell: bash
        run: >-
          uv run --no-project --with pymongo --with pytest
          --with "psycopg[binary]" --with trustme
          --with "$(ls dist-storage/*.whl)"
          python -m pytest tests/test_rust_storage_smoke.py tests/test_rust_server_smoke.py
          tests/test_pgserver_embedded.py
          tests/test_rust_agg_runtime_errors.py tests/test_crash_recovery.py
          tests/test_rust_arg_types_sweep.py tests/test_rust_pitr_cross_server.py
          tests/test_rust_store_handoff.py
          tests/test_getmore_batching.py tests/test_rbac_pipeline.py
          tests/test_rust_server_stress.py tests/test_decimal128_ordering.py
          tests/test_expression_operand_errors.py
          tests/test_decimal128_arithmetic_rounding.py
          tests/test_nan_ordering_and_partial_index.py
          tests/test_rust_update_write_fidelity.py
          tests/test_rust_upsert_fidelity.py
          tests/test_rust_descending_sort.py
          tests/test_rust_natural_sort.py
          tests/test_rust_computed_projection.py
          tests/test_rust_collation_order.py
          tests/test_rust_required_expression_args.py
          tests/test_rust_pipeline_error_fidelity.py
          tests/test_rust_update_error_surface.py
          tests/test_rust_todate_parse_failure.py
          tests/test_rust_explain_parsed_query.py
          tests/test_rust_hint_error_message.py
          tests/test_rust_decimal_extremes.py
          tests/test_comparison_operand_types.py
          tests/test_lookup_numeric_equality.py
          tests/test_rust_server_timestamp_local_time.py
          tests/test_failpoint_app_name.py
          tests/test_change_stream_open_resume_token.py
          tests/test_max_time_always_timeout.py
          -o addopts= -p no:cacheprovider -q

      - name: Rust-server concurrency invariants (#451 stress suite)
        # The Rust params of the concurrency stress suite: exactly-one-winner
        # races, exact final counts, typed-errors-only, per-collection-lock
        # scaling. They importorskip in every other test lane because no other
        # job builds `_secantus_server`; this is the only lane that does, so
        # it's where these invariants get continuously enforced. `-k rust`
        # selects only the `[rust]` parametrization: the `[python]` params
        # run in the main test lanes already, so running them here would
        # only repeat them. (The wheel does ship the SWIG `wiredtiger`
        # binding -- `CMakeLists.txt` builds it with ENABLE_PYTHON=ON -- so
        # that is not the reason.)
        shell: bash
        run: >-
          uv run --no-project --with pymongo --with pytest
          --with "$(ls dist-storage/*.whl)"
          python -m pytest tests/test_mongo_server_concurrency.py
          -k rust -o addopts= -p no:cacheprovider -q

      - name: Free disk after the storage tests
        # Paired with the "before" step: the DELTA is what the suite actually
        # costs. Runs even on failure, because the failure being diagnosed here
        # is exhaustion -- a report only on success never prints on the run that
        # needs it.
        if: always()
        shell: bash
        run: |
          t=$(cat /tmp/tdir 2>/dev/null || echo .)
          echo "test temp dir: $t"
          df -h "$t" || df -h . || true

      - name: Build + smoke the standalone secantusd-rs binary (R7)
        # The bin crate links the SAME vendored WiredTiger the wheel build above
        # produced under build/*/wt-build (scikit-build-core's build-dir), via
        # build.rs's SECANTUS_WT_INCLUDE / SECANTUS_WT_LIB override. Windows is
        # skipped: build.rs probes libwiredtiger.a/.so, which the MSVC build
        # doesn't produce — the Windows artifact ships via the wheel's CMake
        # path only (tracked in tasks/backlog.md §7).
        if: runner.os != 'Windows'
        shell: bash
        run: |
          wt=$(ls -d "$PWD"/build/*/wt-build 2>/dev/null | head -1)
          if [ -z "$wt" ] || [ ! -f "$wt/include/wiredtiger.h" ]; then
            echo "vendored WiredTiger not found under build/*/wt-build" >&2
            exit 1
          fi
          export SECANTUS_WT_INCLUDE="$wt/include" SECANTUS_WT_LIB="$wt"
          cargo build --manifest-path crates/secantusdb/Cargo.toml
          uv run --no-project --with pymongo --with pytest \
            python -m pytest tests/test_rust_binary_smoke.py \
            -o addopts= -p no:cacheprovider -q

  pg-oracle:
    # The SQL suites that diff against a REAL PostgreSQL. They exist because
    # this project's rule is "run it against the reference server, don't reason
    # about the source" — but until now they only ever executed on a dev box
    # that happened to have PostgreSQL installed. In CI they skipped silently,
    # so the one gate that can tell a wrong answer from a plausible one was
    # switched off exactly where regressions get caught.
    #
    # Linux-only, deliberately: GitHub service containers run on Linux runners
    # only. It is a separate job because it builds the Rust PostgreSQL server,
    # which the ``test`` job does not.
    runs-on: ubuntu-latest
    # 45 until 2026-10-21, when the differential suite, every corpus, every
    # secantus-pg cargo test and the backlog's PG tests joined a lane that
    # took about 11 minutes.
    timeout-minutes: 60
    env:
      UV_PYTHON: "3.10"
      # The suites read this (tests/pg_oracle.py); without it they fall back to
      # a developer-box DSN and skip.
      SECANTUS_PG_ORACLE_DSN: "host=127.0.0.1 port=5432 dbname=postgres user=postgres password=postgres"
    services:
      postgres:
        # PINNED TO THE PATCH, not `postgres:14`. These suites assert exact
        # error TEXT, and this repo has already been bitten once by a *patch*
        # bump rewording a message (the mongod expected-type ordering, see
        # CLAUDE.md). 14.13 is the build the local reference server runs, so CI
        # and the dev box compare against the same wording. Moving this pin is
        # a deliberate act: re-probe the suites first.
        image: postgres:14.13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Move the host time zone off UTC
        # Every hosted runner is UTC, which hides any code that wrongly uses
        # the host's local time. See .github/actions/non-utc-host for why
        # Newfoundland, and why the host zone rather than TZ.
        uses: ./.github/actions/non-utc-host
      - name: Checkout the WiredTiger submodule
        shell: bash
        run: >-
          git submodule update --init --depth 1 vendor/wiredtiger ||
          git submodule update --init vendor/wiredtiger

      - name: Install toolchain
        uses: ./.github/actions/apt-install
        with:
          packages: swig liblz4-dev clang libclang-dev

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"

      - name: Pin the build interpreter so the cache can actually be reused
        id: pybuild
        shell: bash
        run: |
          p=$(uv python find 3.10 2>/dev/null || uv python find)
          echo "SKBUILD_CMAKE_DEFINE=Python3_EXECUTABLE=$p" >> "$GITHUB_ENV"
          echo "path=$p" >> "$GITHUB_OUTPUT"

      - name: Compute WiredTiger build-cache key
        id: wtkey
        shell: bash
        run: |
          echo "wt=$(git rev-parse HEAD:vendor/wiredtiger)" >> "$GITHUB_OUTPUT"
          echo "py=$(printf %s '${{ steps.pybuild.outputs.path }}' | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "cfg=$(cat CMakeLists.txt cmake/*.py cmake/*.cmake pyproject.toml | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "img=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore the WiredTiger build
        # Same key shape as the ``test`` job's Linux 3.10 cell, so this job
        # normally restores that build rather than paying for its own.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build
          key: wtbuild-${{ runner.os }}-${{ steps.wtkey.outputs.img }}-py3.10-engineoff-wt${{ steps.wtkey.outputs.wt }}-cfg${{ steps.wtkey.outputs.cfg }}-py${{ steps.wtkey.outputs.py }}

      - name: Sync dependencies
        run: uv sync --extra dev --extra admin

      # Build the standalone Rust PostgreSQL server. Without it BOTH
      # tests/test_rust_pgserver_slice.py and tests/test_rust_pgserver_differential.py
      # skip (they gate on `secantusd-pg` existing), so a pgserver regression
      # reached `main` under green CI once already (#1363). This is the only
      # lane that runs them.
      - name: Build secantusd-pg
        shell: bash
        run: |
          WT="$PWD/$(ls -d build/*/wt-build | head -1)"
          export SECANTUS_WT_INCLUDE="$WT/include" SECANTUS_WT_LIB="$WT"
          # bindgen needs libclang; find it wherever the runner's LLVM put it
          # (Ubuntu noble ships LLVM 18, not a fixed version -- do not hardcode).
          lc="$(find /usr/lib /usr/lib64 \( -name 'libclang.so*' -o -name 'libclang-[0-9]*.so*' \) 2>/dev/null | sort | head -1)"
          test -n "$lc" || { echo "libclang not found" >&2; exit 1; }
          export LIBCLANG_PATH="$(dirname "$lc")"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH"
          (cd crates/secantus-pg && cargo build --bin secantusd-pg)
          test -x crates/secantus-pg/target/debug/secantusd-pg

      # The cross-protocol tests in test_rust_pgserver_slice.py need the
      # MongoDB binary as well: they have the PG server write a table, stop it,
      # and then read it back as a collection through `secantusd-rs`. Without
      # this step they skip -- and since this is the only lane that runs that
      # suite, skipping here means they run in NO lane at all, which is worse
      # than not having them (a green summary that proves nothing). Same
      # reasoning as the secantusd-pg build above.
      - name: Build secantusd-rs (for the cross-protocol tests)
        shell: bash
        run: |
          WT="$PWD/$(ls -d build/*/wt-build | head -1)"
          export SECANTUS_WT_INCLUDE="$WT/include" SECANTUS_WT_LIB="$WT"
          cargo build --manifest-path crates/secantusdb/Cargo.toml --bin secantusd-rs
          test -x crates/secantusdb/target/debug/secantusd-rs

      # The embedded serve path (`bind` / `RunningPgServer::stop`) and, most of
      # all, its DURABILITY property: start, write over the wire, stop, reopen
      # the same home, and the rows are still there. Without a checkpoint on
      # stop those writes are gone while the client was told they succeeded, so
      # this is gated in CI rather than left to whoever remembers to run
      # `cargo test` locally. `cargo build --bin` above does not build tests.
      # `signals` starts the binary with SIGTERM blocked / ignored, as a
      # supervisor may leave it, and requires it to stop on SIGTERM.
      # `pg_server` covers `secantus_pg::PgServer`, the crates.io embedding API.
      # EVERY target runs, not a named list: the list this step used to carry
      # (`embedded`, `signals`, `pg_server`) left the crate's ~100 unit tests,
      # `tls`, `connection_addrs`, `declare_reads` and the doctests running
      # nowhere but a developer's box, and a new test file joined them silently.
      - name: Run the secantus-pg cargo tests
        shell: bash
        run: |
          WT="$PWD/$(ls -d build/*/wt-build | head -1)"
          export SECANTUS_WT_INCLUDE="$WT/include" SECANTUS_WT_LIB="$WT"
          lc="$(find /usr/lib /usr/lib64 \( -name 'libclang.so*' -o -name 'libclang-[0-9]*.so*' \) 2>/dev/null | sort | head -1)"
          test -n "$lc" || { echo "libclang not found" >&2; exit 1; }
          export LIBCLANG_PATH="$(dirname "$lc")"
          (cd crates/secantus-pg && cargo test)

      - name: Verify the reference server is reachable
        # Fail CLOSED. The whole point of this job is that these suites stop
        # skipping, and a skip is invisible in a green pytest summary — so
        # prove the connection here, where a failure is unambiguous.
        run: |
          PYTHONPATH=tests uv run python -c "
          import pg_oracle
          assert pg_oracle.available(), pg_oracle.skip_reason()
          conn = pg_oracle.connect()
          assert conn is not None
          print('reference server:', conn.execute('select version()').fetchone()[0])
          conn.close()
          "

      - name: Run the PostgreSQL-oracle suites
        # The Rust PostgreSQL server's suites, named one by one. This lane used
        # to start from every file importing ``pg_oracle``, but all of those
        # test the Python PostgreSQL server, which CI no longer tests (fully
        # deprecated, 2026-10-20).
        shell: bash
        run: |
          # The Rust pgserver SLICE suite. It needs only the binary, runs in a
          # few minutes, and is deterministic -- and it is the suite that has
          # pre-existing tests a shared-code change can silently break (that is
          # exactly how #1363 left `main` red under green CI).
          files="tests/test_rust_pgserver_slice.py"
          # The DIFFERENTIAL suite, whole: 836 cases against the PostgreSQL 14
          # service above. It was left out as too slow for this lane, with one
          # node named, so 13 of its 14 tests ran only on a developer's box.
          # Measured 2026-10-21: six minutes at -n 4 on a loaded laptop.
          files="$files tests/test_rust_pgserver_differential.py"
          # The release smoke test, in the one lane that already builds the
          # binary it needs. It is `skipif`-gated on that binary existing, so
          # anywhere else it silently collects nothing -- a release gate that
          # runs in no lane is not a gate.
          files="$files tests/test_rust_pg_binary_smoke.py"
          # The built-in functions, held to PostgreSQL 15's recorded answers
          # (it needs the binary and no PostgreSQL). Same reasoning: it skips
          # wherever the binary is not built, so it is named where it is.
          files="$files tests/test_rust_pg_builtin_coverage.py"
          # Composite keys named like extended JSON (`"$date"`), pinned
          # with PostgreSQL 15.19's answers written in. Binary only.
          files="$files tests/test_rust_pg_dollar_names.py"
          # Every differential corpus under tools/probes/pg_corpora/, held to
          # PostgreSQL's recorded answers (pg_corpora/expected/). Binary only.
          # Until 2026-10-21 the corpora ran on a developer's box and nowhere
          # else, so what they pinned could regress under a green CI.
          files="$files tests/test_rust_pg_corpora.py"
          echo "oracle suites: $files"
          test -n "$files"
          PYTHONPATH=tests uv run python -m pytest $files -q -n auto \
            -p no:cacheprovider -rs

      # The login rules (TLS options, revocation lists, user name maps,
      # pg_hba.conf) are compared with a PostgreSQL 15 this job runs itself:
      # each probe writes its own pg_hba.conf, certificates and revocation
      # lists and starts a throwaway cluster from them, which the service
      # container above cannot be made to do. 15 because that is the major
      # the answers were measured against and the one the server reports.
      - name: Add the PostgreSQL apt repository
        shell: bash
        run: |
          if ! grep -rqs apt.postgresql.org /etc/apt/sources.list /etc/apt/sources.list.d/; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error --location --retry 3 --max-time 60 \
              -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc
            . /etc/os-release
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/secantus-pgdg.list
          fi
          # The package would otherwise create and start a cluster of its
          # own; the probes make theirs.
          sudo mkdir -p /etc/postgresql-common
          echo "create_main_cluster = false" | sudo tee -a /etc/postgresql-common/createcluster.conf

      - name: Install PostgreSQL 15
        uses: ./.github/actions/apt-install
        with:
          packages: postgresql-15

      - name: Run the login comparisons against PostgreSQL 15
        # SECANTUS_REQUIRE_PG15 makes a missing directory a failure: these
        # tests skip without one, and this is the only lane that has it.
        shell: bash
        env:
          SECANTUS_PG15_BIN: /usr/lib/postgresql/15/bin
          SECANTUS_REQUIRE_PG15: "1"
        run: |
          "$SECANTUS_PG15_BIN/postgres" --version
          uv run python -m pytest tests/test_rust_pg_login_differential.py -q -n 3 \
            -p no:cacheprovider -rs

      # The regression tests fixed Rust PG backlog items became
      # (`backlog_fixed`, tests/backlog/). The default run deselects them,
      # because they need the reference servers, and until 2026-10-21 nothing
      # selected them again: over a hundred regression tests ran nowhere but
      # `tools/backlog.py verify` on a developer's box. They ask a PostgreSQL 15
      # (the `pg15` fixture), which this step starts from the binaries above on
      # the port a developer box uses for it.
      - name: Start a PostgreSQL 15 reference
        shell: bash
        run: |
          B=/usr/lib/postgresql/15/bin
          D="$RUNNER_TEMP/pg15-reference"
          "$B/initdb" -D "$D" -U postgres --locale=C.UTF-8 -E UTF8 -A trust > /dev/null
          "$B/pg_ctl" -D "$D" -l "$D.log" -w \
            -o "-p 5415 -k '' -c listen_addresses=127.0.0.1" start
          psql "host=127.0.0.1 port=5415 dbname=postgres user=postgres" -Atc 'show server_version'

      - name: Run the Rust PG backlog regression and gap tests
        shell: bash
        env:
          SECANTUS_PG_ORACLE_DSN_15: "host=127.0.0.1 port=5415 dbname=postgres user=postgres"
          SECANTUS_PG15_BIN: /usr/lib/postgresql/15/bin
        run: |
          # `-m backlog_fixed` replaces addopts' `-m`, which deselects them.
          uv run python -m pytest -m backlog_fixed tests/backlog/test_rust_postgres_gaps.py \
            tests/backlog/test_rp_*.py -q -n auto -p no:cacheprovider -rs
          # And the OPEN items' gap tests, through the backlog's own runner: it
          # exits non-zero when a gap test no longer measures its gap (BROKEN)
          # or now passes (FIXED? -- a change fixed the item; close it in the
          # same PR, as the backlog skill says). About ten seconds.
          uv run python tools/backlog.py verify --file backlog-rust-postgres.md
