name: publish crates

# Publishes the Rust MongoDB server's crates to crates.io on a Rust release tag
# (tasks/rust-packages-plan.md, Phase E). Trusted publishing: crates.io trusts
# THIS workflow file, in the `crates-io` environment, for each secantus-*
# crate, and mints a short-lived token per run -- no long-lived token is stored
# anywhere. Nobody runs `cargo publish` by hand.
#
# The `crates-io` environment only accepts the `secantusdb-v*` and
# `secantusd-pg-v*` tags. The PostgreSQL crates are not publishable yet (their
# half of Phase B is open), so a `secantusd-pg-v*` tag does not trigger this.

on:
  push:
    tags:
      - "secantusdb-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify only; publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write  # trusted publishing: the OIDC token crates.io exchanges
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Init vendor/wiredtiger
        run: >-
          git submodule update --init --depth 1 vendor/wiredtiger ||
          git submodule update --init vendor/wiredtiger
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify the tag matches the crate version
        # The same guard publish.yml applies to PyPI: a tag that disagrees
        # with the crates it would publish is refused before anything ships.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/secantusdb-v}"
          crate=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('crates/secantusdb/Cargo.toml').read_text())['package']['version'])")
          if [ "$tag" != "$crate" ]; then
            echo "Tag $tag does not match the secantus-mdb version $crate" >&2
            exit 1
          fi

      - name: Stage and verify every crate from its tarball
        # Packages the crates together and builds each from its tarball (the
        # crates-package.yml gate), keeping the staged workspace to publish
        # from: `cargo package` cannot run inside this checkout.
        run: python scripts/crates_package_check.py --keep "$RUNNER_TEMP/stage"

      - name: Authenticate to crates.io
        if: github.event_name == 'push' || !inputs.dry_run
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5

      - name: Publish in dependency order
        if: github.event_name == 'push' || !inputs.dry_run
        working-directory: ${{ runner.temp }}/stage
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/stage/target
        # `--workspace` publishes every member in dependency order and waits
        # for each to reach the index before publishing its dependents. The
        # previous step already verified each tarball.
        run: cargo publish --workspace --allow-dirty --no-verify
