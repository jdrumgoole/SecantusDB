# Release the standalone `secantusdb` Rust server binary (R7) as prebuilt,
# static-WiredTiger archives attached to a GitHub Release.
#
# WHY this shape:
#   * `secantusdb` statically links WiredTiger (`secantus-wt/build.rs` emits
#     `rustc-link-lib=static=wiredtiger`), so the only dynamic dependency left is
#     libc. That makes a single self-contained binary per target — no `cmake` /
#     `ninja` / `swig` / WT on the user's machine, matching the project's wheel
#     promise.
#   * The vendored WiredTiger static lib is produced by the SAME path CI already
#     proves green in the `storage-engine` job: build the `secantus` wheel with
#     `SECANTUS_BUILD_STORAGE_ENGINE=ON`, which runs the patched CMake build and
#     drops `libwiredtiger.a` + headers under `build/*/wt-build`. The binary then
#     links it via `SECANTUS_WT_INCLUDE` / `SECANTUS_WT_LIB`. Reusing that path
#     (rather than a bespoke WT build) keeps the cmake/*.py patches in force.
#
# TAG SCHEME — deliberately distinct from the PyPI publish trigger:
#   publish.yml fires on `vX.Y.Z` / `vX.Y.ZbN` (the Python package). The Rust
#   server versions independently (`crates/*/Cargo.toml`, e.g. `0.5.3-beta.21`),
#   so its binary releases tag as `secantusdb-v<crate-version>` — which does NOT
#   match publish.yml's `v[0-9]+...` patterns, so the two never collide.
#     git tag secantusdb-v0.5.3-beta.21 && git push origin secantusdb-v0.5.3-beta.21
#
# SCOPE: the three targets CI already builds + smokes (x86_64 glibc Linux, arm64
# macOS, x86_64 Windows). The Linux binary's glibc floor is the build runner's
# glibc (ubuntu-22.04 ⇒ glibc 2.35), fine for modern CI/dev distros. Broader-reach
# targets are listed as follow-ons at the bottom with their blockers (musl-static
# for an any-distro Linux binary; aarch64 Linux).
#
# WINDOWS was long listed here as blocked on "the MSVC WT build produces no
# libwiredtiger.a". That was true of the *filename*, not the capability: MSVC
# emits `wiredtiger.lib`, and `secantus-wt/build.rs` searches for that name too,
# so `storage-engine (windows-latest)` has been linking the static lib and
# building `secantusd-rs.exe` on every push. The note outlived its cause. Two
# things this target does differently: no PGO yet, and `+crt-static` to match
# WT's static CRT (see the matrix entry).

name: Release secantusdb binary

on:
  push:
    tags:
      - "secantusdb-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing secantusdb-v* tag to (re)build binaries for"
        required: true

permissions:
  contents: write # create / upload assets to the GitHub Release

concurrency:
  group: release-binaries-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            os: linux
          - target: aarch64-apple-darwin
            # macos-15 (Darwin 24), not macos-14 (Darwin 23): the older runner's
            # LLVM profiling runtime writes no `.profraw` by ANY method (env
            # at-exit, or an explicit __llvm_profile_write_file) — established by
            # CI diagnosis — which breaks on-target PGO. The newer runner matches
            # the local macOS where the same instrumented binary writes a valid
            # profile.
            runner: macos-15
            os: macos
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            os: windows
            # Ships correct first, optimised second: no PGO on this target yet.
            # PGO is only a hint, so an un-profiled binary is functionally
            # identical — just slower on the write/aggregate paths. The other
            # two targets each needed runner-specific profiling quirks before
            # their two-stage build worked; doing that for MSVC is a follow-on.
            no_pgo: true
            # `+crt-static` is load-bearing, not a tweak. WiredTiger's
            # `wiredtiger.lib` is built against the STATIC CRT, while Rust's
            # MSVC target defaults to the dynamic one — mixing them is what
            # `LNK4098: defaultlib 'LIBCMT' conflicts` reports, and it means two
            # C runtimes with two heaps in one process. For a database that is
            # not cosmetic: memory allocated inside WT and freed on the Rust
            # side (or vice versa) is undefined behaviour. Matching Rust to WT's
            # static CRT removes the mismatch, and has a distribution bonus —
            # the .exe no longer needs the VC++ redistributable installed,
            # which is what "dependency-free binary" should mean on Windows.
            rustflags: -Ctarget-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The vendored WiredTiger lives in a submodule — without it the wheel
          # build (and thus the static lib) can't be produced.
          submodules: recursive
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag + assert it matches the crate version
        shell: bash
        # Pass the workflow_dispatch input through the environment rather than
        # expanding ${{ github.event.inputs.tag }} inline into the script — an
        # env var is a value the shell reads, so a tag containing shell
        # metacharacters can't be interpolated into the run block (Actions
        # script-injection hygiene). github.event_name below is a GitHub-set
        # enum, not user input, so it stays inline. (security review §I19)
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          ver="${tag#secantusdb-v}"
          crate=$(grep -m1 '^version' crates/secantusdb/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ "$ver" != "$crate" ]; then
            echo "::error::tag version ($ver) != crates/secantusdb Cargo.toml version ($crate)"
            exit 1
          fi
          {
            echo "TAG=$tag"
            echo "VERSION=$ver"
          } >> "$GITHUB_ENV"

      # WiredTiger build prerequisites — same set as the `storage-engine` job.
      # bindgen needs libclang; the WT ExternalProject forces Ninja; swig builds
      # WT's (unused-here) Python module that its CMake still configures.
      - name: Install toolchain (Linux)
        if: matrix.os == 'linux'
        uses: ./.github/actions/apt-install
        with:
          packages: swig clang libclang-dev llvm-dev ninja-build liblz4-dev

      - name: Install toolchain (macOS)
        if: matrix.os == 'macos'
        run: brew install swig ninja lz4

      # The three Windows steps below are lifted verbatim from test.yml's
      # `storage-engine` job, which builds this same static WiredTiger + binary
      # on windows-latest on every push. Keep them in sync with that job.
      - name: Disable Defender real-time scanning (Windows)
        if: matrix.os == 'windows'
        # Real-time scanning synchronously inspects every file the build creates
        # (cargo + CMake object files, the WT tree, wheel staging) on an
        # ephemeral VM that builds only this checkout. Best-effort.
        shell: pwsh
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true }
          catch { Write-Warning "could not disable Defender real-time scanning: $_" }

      - name: Install toolchain (Windows)
        if: matrix.os == 'windows'
        run: choco install -y swig ninja llvm

      - name: Point bindgen at libclang (Windows)
        if: matrix.os == 'windows'
        # clang-sys doesn't always find choco's LLVM on PATH within the same job;
        # pin it explicitly for the build step below.
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable
        with:
          targets: ${{ matrix.target }}
          # llvm-tools-preview provides llvm-profdata for the two-stage PGO build.
          components: llvm-tools-preview

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build vendored WiredTiger (static) via the storage-engine wheel build
        # scikit-build-core forwards SKBUILD_CMAKE_DEFINE as a -D define, flipping
        # the storage-engine CMake option ON for this build only. Side effect we
        # want: libwiredtiger.a + include/wiredtiger.h under build/*/wt-build.
        env:
          SKBUILD_CMAKE_DEFINE: SECANTUS_BUILD_STORAGE_ENGINE=ON
        run: uv build --wheel --out-dir dist-storage

      - name: Build the static-WiredTiger secantusdb binary (two-stage PGO)
        # Approach #1 of the PGO split: build the binary per-arch with
        # profile-guided optimization. The PGO'd targets build natively (the
        # runner arch matches the target), so the instrumented binary can run
        # here to collect its own profile — an on-target profile, unlike the
        # wheel's committed one. ~12-19% on write/aggregate paths over LTO alone.
        # Targets flagged `no_pgo` take the plain-release branch at the bottom.
        shell: bash
        env:
          # Per-target flags (currently: the Windows CRT match). Empty elsewhere,
          # which composes to exactly the previous behaviour.
          MATRIX_RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          set -euo pipefail
          wt=$(ls -d "$PWD"/build/*/wt-build 2>/dev/null | head -1)
          if [ -z "$wt" ] || [ ! -f "$wt/include/wiredtiger.h" ]; then
            echo "::error::vendored WiredTiger not found under build/*/wt-build"
            exit 1
          fi
          export SECANTUS_WT_INCLUDE="$wt/include" SECANTUS_WT_LIB="$wt"
          target=${{ matrix.target }}
          manifest=crates/secantusdb/Cargo.toml
          exe=""
          [ "${{ matrix.os }}" = "windows" ] && exe=".exe"
          bin="crates/secantusdb/target/$target/release/secantusd-rs$exe"
          profraw="$PWD/pgo-raw"; rm -rf "$profraw"; mkdir -p "$profraw"

          if [ "${{ matrix.no_pgo }}" = "true" ]; then
            # Plain optimized build — no instrumentation, no profile. Correct and
            # fully functional; only the PGO speedup is absent.
            echo "=== plain release build (no PGO on this target) ==="
            RUSTFLAGS="$MATRIX_RUSTFLAGS" \
              cargo build --release --locked --target "$target" --manifest-path "$manifest"
          elif [ "${{ matrix.os }}" = "macos" ]; then
            # arm64-macOS two-stage on-target PGO. Two runner-specific quirks are
            # handled here (both established by CI diagnosis; linux needs neither):
            #  1. Instrumenting mimalloc's internals segfaults at startup, so the
            #     instrumented stage builds with the system allocator
            #     (--no-default-features drops mimalloc; the profile is a hint so
            #     the allocator swap is harmless, and stage 3 restores mimalloc).
            #  2. The profiling runtime never wires up its LLVM_PROFILE_FILE
            #     at-exit write on this runner — even a clean `--version` exit
            #     produces no `.profraw`. So the instrumented binary writes the
            #     profile itself (the `pgo-instrument` feature: __llvm_profile_
            #     set_filename + __llvm_profile_write_file to $SECANTUS_PGO_OUT on
            #     shutdown). Verified to yield a valid, mergeable profile.
            echo "=== macOS PGO stage 1: instrumented build (system allocator + self-written profile) ==="
            RUSTFLAGS="-Cprofile-generate=$profraw" \
              cargo build --release --locked --no-default-features --features pgo-instrument --target "$target" --manifest-path "$manifest"

            echo "=== macOS PGO stage 2: run + drive workload; binary writes the profile on shutdown ==="
            datadir=$(mktemp -d)
            SECANTUS_PGO_OUT="$profraw/pgo-macos.profraw" \
              "$bin" --port 0 --storage-path "$datadir" > pgo-server.log 2>&1 &
            srvpid=$!
            addr=""
            for _ in $(seq 1 120); do
              addr=$(grep -oE 'listening on [0-9.]+:[0-9]+' pgo-server.log | head -1 | awk '{print $3}') || true
              [ -n "$addr" ] && break
              sleep 0.5
            done
            if [ -z "$addr" ]; then
              echo "::error::instrumented binary never printed a listening address"; cat pgo-server.log; exit 1
            fi
            uv run --no-project --with pymongo python -m bench.pgo_workload --uri "mongodb://$addr"
            kill -TERM "$srvpid" 2>/dev/null || true
            wait "$srvpid" 2>/dev/null || true

            echo "=== macOS PGO: locate + merge profile ==="
            # The binary self-writes to $SECANTUS_PGO_OUT, but locate defensively:
            # on this runner the profiling runtime's filename handling is flaky, so
            # a write can land under a default name elsewhere in the workspace.
            echo "--- searching for .profraw files (portable; runner bash is 3.2) ---"
            find "$PWD" -name '*.profraw' -exec ls -la {} \; 2>/dev/null || true
            n=$(find "$PWD" -name '*.profraw' 2>/dev/null | wc -l | tr -d ' ')
            if [ "$n" -eq 0 ]; then
              echo "::error::no .profraw written anywhere in the workspace"; cat pgo-server.log; exit 1
            fi
            profdata_tool="$(rustc --print sysroot)/lib/rustlib/$target/bin/llvm-profdata"
            [ -x "$profdata_tool" ] || profdata_tool=$(ls "$(rustc --print sysroot)"/lib/rustlib/*/bin/llvm-profdata | head -1)
            merged="$profraw/merged.profdata"
            find "$PWD" -name '*.profraw' -print0 2>/dev/null | xargs -0 "$profdata_tool" merge --sparse -o "$merged"
            echo "profile size: $(du -h "$merged" | cut -f1)"

            echo "=== macOS PGO stage 3: optimized build (profile-use, mimalloc restored) ==="
            RUSTFLAGS="-Cprofile-use=$merged -Cllvm-args=-pgo-warn-missing-function" \
              cargo build --release --locked --target "$target" --manifest-path "$manifest"
          else
            # Linux: two-stage on-target PGO. The instrumented stage builds with
            # the system allocator (--no-default-features drops mimalloc) — a
            # habit carried from the macOS mimalloc-instrumentation crash; the
            # profile is a hint so the allocator swap is harmless — and its atexit
            # flush writes the profile normally here.
            echo "=== PGO stage 1: instrumented build (system allocator) ==="
            RUSTFLAGS="-Cprofile-generate=$profraw" \
              cargo build --release --locked --no-default-features --target "$target" --manifest-path "$manifest"

            echo "=== PGO stage 2: run the instrumented binary + drive the workloads ==="
            datadir=$(mktemp -d)
            LLVM_PROFILE_FILE="$profraw/pgo-%p-%m.profraw" \
              "$bin" --port 0 --storage-path "$datadir" > pgo-server.log 2>&1 &
            srvpid=$!
            addr=""
            for _ in $(seq 1 120); do
              addr=$(grep -oE 'listening on [0-9.]+:[0-9]+' pgo-server.log | head -1 | awk '{print $3}') || true
              [ -n "$addr" ] && break
              sleep 0.5
            done
            if [ -z "$addr" ]; then
              echo "::error::instrumented binary never printed a listening address"; cat pgo-server.log; exit 1
            fi
            uv run --no-project --with pymongo python -m bench.pgo_workload --uri "mongodb://$addr"
            kill -TERM "$srvpid" 2>/dev/null || true
            wait "$srvpid" 2>/dev/null || true

            echo "=== PGO: merge profile ==="
            profdata_tool="$(rustc --print sysroot)/lib/rustlib/$target/bin/llvm-profdata"
            [ -x "$profdata_tool" ] || profdata_tool=$(ls "$(rustc --print sysroot)"/lib/rustlib/*/bin/llvm-profdata | head -1)
            merged="$profraw/merged.profdata"
            "$profdata_tool" merge --sparse -o "$merged" "$profraw"/*.profraw
            echo "profile size: $(du -h "$merged" | cut -f1)"

            echo "=== PGO stage 3: optimized build (profile-use) ==="
            RUSTFLAGS="-Cprofile-use=$merged -Cllvm-args=-pgo-warn-missing-function" \
              cargo build --release --locked --target "$target" --manifest-path "$manifest"
          fi
          strip "$bin" || true
          echo "BIN=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: Smoke the release binary (pymongo → secantusdb → WiredTiger)
        # SECANTUSDB_BIN points the smoke test at the exact artifact we ship,
        # not a freshly-rebuilt debug binary.
        shell: bash
        env:
          SECANTUSDB_BIN: ${{ env.BIN }}
        run: >-
          uv run --no-project --with pymongo --with pytest
          python -m pytest tests/test_rust_binary_smoke.py
          -o addopts= -p no:cacheprovider -q

      - name: Package the archive + checksum
        shell: bash
        run: |
          set -euo pipefail
          stem="secantusdb-${VERSION}-${{ matrix.target }}"
          mkdir -p "$stem"
          # Ship the binary as `secantusd-rs`, matching the command name the
          # wheel installs (the pure-Python `secantusd-py` is a different program).
          exe=""
          [ "${{ matrix.os }}" = "windows" ] && exe=".exe"
          cp "$BIN" "$stem/secantusd-rs$exe"
          cp LICENSE README.md "$stem/"

          # `shasum` ships with macOS/Linux runners but not Git Bash on Windows,
          # which has `sha256sum` instead. Pick whichever exists rather than
          # assuming — a missing checksum would otherwise fail the release late,
          # after the whole WT + cargo build.
          if command -v shasum >/dev/null 2>&1; then
            sha() { shasum -a 256 "$1"; }
          else
            sha() { sha256sum "$1"; }
          fi

          tar -czf "$stem.tar.gz" "$stem"
          sha "$stem.tar.gz" > "$stem.tar.gz.sha256"

          # Windows also gets a .zip: it's what Explorer opens on a double-click,
          # whereas .tar.gz needs the command line. The .tar.gz is kept for
          # parity with the other targets and for anything globbing the existing
          # asset names.
          if [ "${{ matrix.os }}" = "windows" ]; then
            powershell -NoProfile -Command \
              "Compress-Archive -Path '$stem' -DestinationPath '$stem.zip' -Force"
            sha "$stem.zip" > "$stem.zip.sha256"
          fi
          ls -l "$stem".*

      # Keep the artifacts on the run too, so a workflow_dispatch dry-run can be
      # inspected without (or before) touching a Release.
      - name: Upload run artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: secantusdb-${{ matrix.target }}
          path: |
            secantusdb-*.tar.gz
            secantusdb-*.tar.gz.sha256
            secantusdb-*.zip
            secantusdb-*.zip.sha256
          if-no-files-found: error

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ env.TAG }}
          # A SemVer pre-release (the `-beta.N` suffix has a hyphen) ⇒ mark the
          # Release as a pre-release.
          prerelease: ${{ contains(env.VERSION, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          # NB `fail_on_unmatched_files: true` above applies per-pattern, so the
          # .zip globs would fail the non-Windows targets that never produce one.
          # Each target attaches only what it built; the Release accumulates all
          # of them across the matrix.
          files: |
            secantusdb-*.tar.gz
            secantusdb-*.tar.gz.sha256

# ---------------------------------------------------------------------------
# Follow-on matrix entries (NOT yet enabled — each needs verification first):
#
#   - target: x86_64-unknown-linux-musl   # fully static, runs on ANY Linux
#       Build inside a musl env (Alpine container or `cibuildwheel` musllinux,
#       which already builds WT under musl for the wheels). Removes the glibc
#       floor entirely. Preferred long-term Linux artifact; the gnu build above
#       is the pragmatic v1.
#   - target: aarch64-unknown-linux-gnu / -musl
#       runner: ubuntu-22.04-arm (arm64 Linux runners are GA). Verify the WT
#       CMake build + bindgen on arm64 first.
#   - target: x86_64-apple-darwin
#       Intentionally absent, mirroring the wheel matrix (Apple Silicon is the
#       active macOS target; Intel runner pool is scarce).
#   (x86_64-pc-windows-msvc is ENABLED above — it was listed here as blocked on a
#    missing MSVC static lib, which turned out to be a filename difference:
#    `wiredtiger.lib`, not `libwiredtiger.a`. Remaining Windows follow-on: PGO,
#    which needs an MSVC-compatible instrumented build + llvm-profdata merge.)
#
# Optimisation (deferred for correctness): cache build/*/wt-build keyed on the
# vendored WiredTiger submodule SHA so most runs skip the ~minutes-long WT build.
# ---------------------------------------------------------------------------
