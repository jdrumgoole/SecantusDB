# The Rust PostgreSQL server (`secantusd-pg`) scored by psycopg 3's own,
# unmodified test suite -- in the clear, and then again OVER TLS.
#
# Why its own workflow: the TLS run was by hand until now, so a change that
# broke the protocol only on an encrypted connection (a short read off the TLS
# stream, a COPY or a cancel that behaves differently there) would go unseen
# until someone remembered to run it. And no Linux lane ran this gauge against
# the Rust server at all: `validate.yml`'s psycopg lane measures the Python
# server, and `psycopg-windows.yml` is Windows.
#
# Two full runs of the suite are about an hour with the build, so this does
# NOT run on every PR: weekly, on demand, and on PRs that touch the server's
# TLS and login code, the gauge runner or this file.
#
# What it gates:
#   1. Both runs COMPLETE -- every test a run started reported a result. A
#      truncated run is a failure, never a pass (CLAUDE.md, "A test that does
#      not COMPLETE is a failure").
#   2. No test fails over TLS that passes in the clear AND fails over TLS
#      again when run again, apart from the timing tests a hosted runner
#      fails by itself (`SHARED_RUNNER_NOISE` in
#      psycopg_validation/check_run.py).
# A test that fails in BOTH runs is printed and does not fail this job: it is
# the plain gauge's finding, and this lane is not where that number is kept.
name: psycopg gauge (Rust PG server, plain and TLS)

on:
  schedule:
    - cron: "43 5 * * 0"  # Sundays, off the hour
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "crates/secantus-pg/src/tls.rs"
      - "crates/secantus-pg/src/live.rs"
      - "crates/secantus-pg/src/crl.rs"
      - "crates/secantus-pg/src/x509.rs"
      - "crates/secantus-pg/src/scram_binding.rs"
      # The sources, not the manifest: a version bump is not a change to how
      # the wire is spoken, and this lane is over an hour.
      - "crates/secantus-pgwire/src/**"
      - "psycopg_validation/**"
      - ".github/workflows/psycopg-tls.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  psycopg-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      UV_PYTHON: "3.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout the WiredTiger and psycopg submodules
        # Only these two feed this job; the other vendored submodules are
        # driver-gauge repos with gigabytes of history.
        shell: bash
        run: >-
          git submodule update --init --depth 1 vendor/wiredtiger vendor/psycopg ||
          git submodule update --init vendor/wiredtiger vendor/psycopg

      # The toolchain, WiredTiger cache and build steps below mirror test.yml's
      # `pg-oracle` job, which builds this same binary. Keep them in sync.
      - name: Install toolchain
        uses: ./.github/actions/apt-install
        with:
          packages: swig liblz4-dev
      - name: Point bindgen at the image's libclang
        if: runner.os == 'Linux'
        uses: ./.github/actions/image-libclang

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python 3.10
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.10"

      - name: Pin the build interpreter so the cache can actually be reused
        id: pybuild
        shell: bash
        run: |
          p=$(uv python find 3.10 2>/dev/null || uv python find)
          echo "SKBUILD_CMAKE_DEFINE=Python3_EXECUTABLE=$p" >> "$GITHUB_ENV"
          echo "path=$p" >> "$GITHUB_OUTPUT"

      - name: Compute WiredTiger build-cache key
        id: wtkey
        shell: bash
        run: |
          echo "wt=$(git rev-parse HEAD:vendor/wiredtiger)" >> "$GITHUB_OUTPUT"
          echo "py=$(printf %s '${{ steps.pybuild.outputs.path }}' | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "cfg=$(cat CMakeLists.txt cmake/*.py cmake/*.cmake pyproject.toml | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "img=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore the WiredTiger build
        # The key `pg-oracle` and the `test` job's Linux 3.10 cell use, so this
        # job normally restores their build and does not pay for its own.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build
          key: wtbuild-${{ runner.os }}-${{ steps.wtkey.outputs.img }}-py3.10-engineoff-wt${{ steps.wtkey.outputs.wt }}-cfg${{ steps.wtkey.outputs.cfg }}-py${{ steps.wtkey.outputs.py }}

      - name: Sync dependencies
        # The `dev` extra carries what psycopg's suite needs (pytest-randomly,
        # pproxy, pytest-json-report, mypy) and `trustme`, which makes the
        # certificate the TLS run serves.
        run: uv sync --extra dev

      - name: Build secantusd-pg (debug, where the gauge runner looks)
        shell: bash
        run: |
          WT="$PWD/$(ls -d build/*/wt-build | head -1)"
          export SECANTUS_WT_INCLUDE="$WT/include" SECANTUS_WT_LIB="$WT"
          # LIBCLANG_PATH is set by "Point bindgen at the image's libclang".
          (cd crates/secantus-pg && cargo build --bin secantusd-pg)
          crates/secantus-pg/target/debug/secantusd-pg --version

      - name: Run the psycopg gauge in the clear
        shell: bash
        env:
          SECANTUS_GAUGE_SERVER: rust
          # The suite took 1,689 s on this runner the first time, against
          # about 1,050 s on a developer's Mac, and the TLS run is slower
          # still: the runner's default 1,800 s backstop killed that one at
          # 98%, which the last step reported as the truncated run it was.
          SECANTUS_PSYCOPG_GAUGE_TIMEOUT: "3600"
          PYTHONUNBUFFERED: "1"
          PYTEST_ADDOPTS: "--durations=20 -rfE"
        run: |
          # pytest exits non-zero on any failing test; what this job gates is
          # in the comparison step below, which reads the reports.
          set +e
          # The runner image exports PGPASSWORD (for its own PostgreSQL), and
          # tests/pq/test_pgconn.py::test_used_password then asserts the server
          # ASKED for a password. secantusd-pg trusts a role with no password.
          unset PGPASSWORD
          uv run --no-sync python -m psycopg_validation.runner
          echo "runner exit: $?"

      - name: Run the psycopg gauge over TLS
        shell: bash
        env:
          SECANTUS_GAUGE_SERVER: rust
          SECANTUS_GAUGE_TLS: "1"
          SECANTUS_PSYCOPG_GAUGE_TIMEOUT: "3600"
          PYTHONUNBUFFERED: "1"
          PYTEST_ADDOPTS: "--durations=20 -rfE"
        run: |
          set +e
          unset PGPASSWORD
          # The runner refuses to start the suite unless its own connection,
          # made under the settings the suite will run with, is TLS.
          uv run --no-sync python -m psycopg_validation.runner
          echo "runner exit: $?"

      - name: Both runs completed; list what failed over TLS only
        id: held
        shell: bash
        # Fails here on a run that stopped short. Otherwise writes the tests
        # that failed over TLS and passed in the clear, to be run again:
        # a hosted runner fails a different timing test in each run, and one
        # run cannot tell that from TLS answering differently.
        #
        # `--shared-runner`: three families of timing test fail on this
        # runner in most runs, in either transport. They are printed and not
        # run again; check_run.py names them and says what that loses.
        run: |
          uv run --no-sync python -m psycopg_validation.check_run \
            .validation/psycopg-raw-rust.json --tls .validation/psycopg-raw-rust-tls.json \
            --shared-runner --write-held .validation/tls-only.txt
          echo "count=$(grep -c . .validation/tls-only.txt || true)" >> "$GITHUB_OUTPUT"

      - name: Run again, over TLS, what failed over TLS only
        if: steps.held.outputs.count != '0'
        shell: bash
        env:
          SECANTUS_GAUGE_SERVER: rust
          SECANTUS_GAUGE_TLS: "1"
          SECANTUS_PSYCOPG_ONLY_FILE: .validation/tls-only.txt
          PYTHONUNBUFFERED: "1"
          PYTEST_ADDOPTS: "-rfE"
        run: |
          set +e
          unset PGPASSWORD
          uv run --no-sync python -m psycopg_validation.runner
          echo "runner exit: $?"

      - name: Nothing fails over TLS only, twice
        shell: bash
        # A test that failed over TLS, passed in the clear and passed over
        # TLS the second time is printed. One that failed both times, or was
        # not run again, fails the job.
        run: |
          uv run --no-sync python -m psycopg_validation.check_run \
            .validation/psycopg-raw-rust.json --tls .validation/psycopg-raw-rust-tls.json \
            --shared-runner --rerun .validation/psycopg-raw-rust-tls-rerun.json

      - name: Upload the raw reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: psycopg-raw-rust-linux
          path: |
            .validation/psycopg-raw-rust.json
            .validation/psycopg-raw-rust-tls.json
            .validation/psycopg-raw-rust-tls-rerun.json
            .validation/tls-only.txt
          if-no-files-found: warn
