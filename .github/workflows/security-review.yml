name: Security Review

# Nightly automated security review of the whole repo (both servers).
# Runs the prompt in scripts/security-review-prompt.md via Claude Code,
# writes a dated report under docs/security-reports/, self-merges the
# docs-only report PR, and files `security`-labelled issues for any
# CRITICAL / WARNING findings. Mirrors the regstack process.

on:
  schedule:
    # 06:26 UTC nightly (off the :00/:30 marks to avoid the fleet pileup).
    # GitHub Actions cron is always UTC.
    - cron: '26 6 * * *'
  # Manual trigger for testing / on-demand reviews.
  workflow_dispatch: {}

# Least privilege that still lets the agent land the report PR and file
# issues. Note: a docs-only report PR (docs/security-reports/**) matches the
# test/wheel workflows' paths-ignore, so it has no required checks and can
# squash-merge immediately.
permissions:
  contents: write # commit + push the security-review/* branch
  pull-requests: write # open and squash-merge the report PR
  issues: write # file `security` issues for CRITICAL/WARNING findings
  actions: read
  # No id-token: write — the review authenticates via CLAUDE_CODE_OAUTH_TOKEN
  # and gh (contents/PR/issues), never OIDC. Dropping it keeps the token
  # least-privileged. (security review 2026-06-30 §I6)
  # Holding this line requires passing `github_token` explicitly to the action
  # below; without that input it falls back to minting an App token over OIDC
  # and the run dies before the review starts.

concurrency:
  group: security-review
  cancel-in-progress: false

jobs:
  security-review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history so the git-history / accidentally-committed-secrets
          # sections (§11) have something to walk.
          fetch-depth: 0
          # Don't fetch the heavy vendored submodules (WiredTiger source,
          # the driver test trees); the review reads them from the gitlink
          # refs and pyproject, and doesn't need the full checkout.
          submodules: false

      - name: Run nightly security review
        uses: anthropics/claude-code-action@44423bdec74b97d67543eb16c110546762c110b2  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Hand the action this workflow's own GITHUB_TOKEN. Without it,
          # `setupGitHubToken` mints a GitHub App token by exchanging an OIDC
          # token, which needs `id-token: write` — the permission this workflow
          # deliberately withholds (see the permissions block above, §I6). That
          # is what broke the nightly run from 2026-07-05 onward: every attempt
          # died in getOidcToken before the review started. Passing the token
          # explicitly keeps the OIDC path unused and the permission set
          # unchanged.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The whole procedure (review → dated report → self-merging PR →
          # security issues) lives in the prompt file so it's version-
          # controlled and editable without touching this workflow.
          prompt: |
            Read scripts/security-review-prompt.md and follow it exactly, end to end:
            perform the full security review of this repository, write the dated report
            to docs/security-reports/YYYY-MM-DD.md, open and squash-merge the docs-only
            report PR (leaving no branch or open PR behind), and file a `security`-labelled
            GitHub issue for each CRITICAL or WARNING finding. Do NOT fix any findings in
            this run — review, document, and file issues only.

            This is a HEADLESS run: nothing will resume you after you stop. Do not
            background any work. The Agent tool defaults to run_in_background: true, so
            if you delegate, you MUST pass run_in_background: false and wait for each
            result inline. Ending your turn with work still pending kills that work and
            the review silently produces nothing — which is exactly how the 2026-07-20
            run spent $4.70, launched 8 background agents, and wrote no report. Finish
            the report, merge the PR, and file the issues before you stop.
          # Allow the tools the procedure needs: shell (git/gh/uv), file
          # read/write for the report, and web access for CVE lookups.
          claude_args: '--allowed-tools "Bash,Read,Grep,Glob,Write,Edit,WebSearch,WebFetch"'

      # The action writes a full execution log to the runner temp dir and then
      # never surfaces it, so a failed review shows only `is_error: true` with
      # no reason. Dump it on every run — without this there is nothing to
      # diagnose from.
      - name: Summarize the Claude execution result
        if: always()
        run: |
          f=/home/runner/work/_temp/claude-execution-output.json
          if [ ! -f "$f" ]; then echo "no execution log at $f"; exit 0; fi
          # Print ONLY a curated set of structured diagnostic fields, never the
          # full turn-by-turn transcript. The transcript can contain data the
          # agent fetched at runtime (WebFetch responses, command output), and
          # GitHub's log secret-masking only covers *declared* repo secrets — so
          # `cat`-ing the whole file could print an incidentally-captured
          # credential in the clear (security review 2026-07-20, I23). These
          # fields — the model, the result envelope's cost/turns/error flags, and
          # any auth-error status — are exactly what diagnosing a failed run needs
          # (a $0 / 1-turn / is_error result is a rejected token; an
          # api_error_status of 401 pins it) without echoing free-text content.
          jq -r '
            [ .. | objects
              | select((.subtype=="init") or (has("total_cost_usd")) or (has("api_error_status")) or ((.error|type)=="string"))
              | { model, subtype, is_error, num_turns, duration_ms, total_cost_usd, error, error_status, api_error_status }
              | with_entries(select(.value != null)) ]
          ' "$f" 2>/dev/null || echo "could not parse $f (structured summary unavailable)"

      # The action exits 0 whenever its result envelope says
      # subtype == "success", even when the same envelope carries
      # `is_error: true` — so a rejected credential, an exhausted quota, or a
      # review that died on turn 1 all report a green check and file nothing.
      # That is how the nightly run stayed broken from 2026-07-05 to
      # 2026-07-20 without anyone noticing: 16 red runs nobody was paged
      # about, then a green one that produced no report at all ($0 cost,
      # 1 turn). Assert on the artifact instead of the exit code — the review
      # only counts if today's report actually landed on main.
      - name: Assert the review produced today's report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today="$(date -u +%F)"
          path="docs/security-reports/${today}.md"
          # The review lands its report by squash-merging a docs-only PR into
          # main, so check main rather than this runner's pre-review checkout.
          if gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq .path >/dev/null 2>&1; then
            echo "OK: ${path} is present on main"
          else
            echo "::error::Security review did not produce ${path} on main. A green" \
                 "action step is not proof the review ran — check total_cost_usd and" \
                 "is_error in the run log; \$0 with 1 turn means the agent was rejected" \
                 "before reading anything (usually a stale CLAUDE_CODE_OAUTH_TOKEN)."
            exit 1
          fi
