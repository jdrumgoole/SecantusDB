name: Build secantus-storage wheels

# The Rust storage extension (`secantus-storage` → `_secantus_storage`) links the
# vendored WiredTiger C library, so — unlike the pure `secantus-core` wheel — it
# can't build in maturin's plain manylinux container. This workflow builds
# WiredTiger *static* first (cmake/build_wt_static.py, the same config the crates
# link against locally), then maturin-builds the extension against it.
#
# It ships as its own companion wheel (the user-chosen "separate companion wheel"
# packaging), leaving the main `secantus` wheel untouched.
#
# Status: the build recipe is proven locally (WT static → maturin → importable
# wheel). This workflow starts with the Linux targets; macOS / Windows / musl are
# follow-up matrix entries (each needs the same recipe with platform toolchain
# setup). The tag-gated publish needs a PyPI Trusted Publisher for the
# `secantus-storage` project (one-time, like secantus-core). See
# tasks/rust-rewrite-phase4-scoping.md.

on:
  push:
    branches: [main]
    paths:
      - 'crates/secantus-storage**'
      - 'crates/secantus-wt/**'
      - 'crates/secantus-core/**'
      - 'cmake/build_wt_static.py'
      - '.github/workflows/storage-wheels.yml'
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  pull_request:
    branches: [main]
    paths:
      - 'crates/secantus-storage**'
      - 'crates/secantus-wt/**'
      - 'crates/secantus-core/**'
      - 'cmake/build_wt_static.py'
      - '.github/workflows/storage-wheels.yml'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux-x86_64, target: x86_64-unknown-linux-gnu, manylinux: '2_28' }
          - { os: ubuntu-22.04-arm, platform: linux-aarch64, target: aarch64-unknown-linux-gnu, manylinux: '2_28' }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # need vendor/wiredtiger source

      - name: Build wheel (WiredTiger static + maturin)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/secantus-storage-py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # manylinux_2_28 is AlmaLinux 8 (dnf) — clang/llvm-devel + cmake/ninja
          # are installable there, unlike CentOS-7-based 2014. Build WiredTiger
          # static into a fixed in-container path, then maturin links it (env
          # below). build_wt_static.py is CWD-independent (it resolves the repo
          # root from its own location).
          before-script-linux: |
            # manylinux_2_28 == AlmaLinux 8 (dnf). cmake 3.26 + ninja + clang/
            # libclang (for bindgen) come straight from the repos — no pip needed
            # (the container python3 has no pip module).
            dnf install -y clang llvm-devel cmake ninja-build
            python3 ../../cmake/build_wt_static.py /tmp/wt-static
          args: --release --out dist
        env:
          SECANTUS_WT_INCLUDE: /tmp/wt-static/include
          SECANTUS_WT_LIB: /tmp/wt-static

      - name: Sanity-import the built wheel
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        run: |
          python -m pip install pymongo crates/secantus-storage-py/dist/*.whl
          python -c "import bson, tempfile, _secantus_storage as ss; \
            st=ss.RustStorage(tempfile.mkdtemp()); \
            st.insert_one('a','c',bson.encode({'_id':1,'v':'hi'})); \
            print('import OK:', bson.decode(st.find_by_id('a','c',bson.encode({'v':1})))['v'])"

      - uses: actions/upload-artifact@v4
        with:
          name: secantus-storage-${{ matrix.platform }}
          path: crates/secantus-storage-py/dist/*.whl

  publish:
    # Only on a release tag. Trusted publishing (OIDC) — needs a PyPI Trusted
    # Publisher configured for the `secantus-storage` project.
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: secantus-storage-*
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
