name: Publish to PyPI

# The SecantusDB PyPI wheels: both Rust servers, prebuilt, for Linux x86_64 and
# macOS arm64. Nothing is compiled here. The wheels repackage the archives the
# two binary-release workflows already built, smoke-tested and attached to
# their GitHub Releases (packaging/pypi/build_wheels.py):
#
#   secantusd-mdb and the in-process extension (_secantus_server)
#                 from the secantusdb-v* release that triggered this run
#   secantusd-pg  from the newest secantusd-pg-v* release
#
# Two wheels per platform: `cp310-abi3` carries the extension, so
# `MongoServer()` runs in process; `py3-none` does not, for the Pythons abi3
# cannot serve (free-threaded CPython), where `MongoServer()` raises and
# `embedded=False` runs the binary. A release from before the extension
# archive existed cannot be packaged by this builder.
#
# The wheel's version is the MongoDB server's (0.5.3-beta.196 -> 0.5.3b196).
#
# Triggered when "Release secantusdb binary" finishes on a secantusdb-v* tag.
# A release made with GITHUB_TOKEN fires no `release` event, which is why this
# listens for the workflow run instead. workflow_dispatch rebuilds a given tag,
# and publishes only when asked.

on:
  workflow_run:
    workflows: ["Release secantusdb binary"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "secantusdb-v* tag whose release to package"
        required: true
      publish:
        description: "Upload to PyPI (otherwise build and smoke-test only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  build:
    # A workflow_run fires for every finished run, failed and dispatched ones
    # included: package only a successful run on a pushed secantusdb-v* tag.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'secantusdb-v'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve the two releases
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          case "$TAG" in
            secantusdb-v*) ;;
            *) echo "::error::$TAG is not a secantusdb-v* tag"; exit 1 ;;
          esac
          pg_tag=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 \
            --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("secantusd-pg-v"))] | sort_by(.createdAt) | last | .tagName')
          if [ -z "$pg_tag" ] || [ "$pg_tag" = "null" ]; then
            echo "::error::no secantusd-pg-v* release to bundle"; exit 1
          fi
          {
            echo "tag=$TAG"
            echo "mongodb_version=${TAG#secantusdb-v}"
            echo "pg_tag=$pg_tag"
            echo "postgres_version=${pg_tag#secantusd-pg-v}"
          } >> "$GITHUB_OUTPUT"
          echo "MongoDB server $TAG, PostgreSQL server $pg_tag"

      # The checkout supplies the wheel builder, the launcher and the licence
      # files. It is the workflow's own commit (main), not the release tag: a
      # tag cut before packaging/pypi/ existed would have no builder to run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download the release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin; do
            # `secantusdb-*` takes the extension's `secantusdb-ext-*` archive too.
            gh release download "${{ steps.resolve.outputs.tag }}" -R "$GITHUB_REPOSITORY" -D assets \
              -p "secantusdb-*-$target.tar.gz" -p "secantusdb-*-$target.tar.gz.sha256"
            gh release download "${{ steps.resolve.outputs.pg_tag }}" -R "$GITHUB_REPOSITORY" -D assets \
              -p "secantusd-pg-*-$target.tar.gz" -p "secantusd-pg-*-$target.tar.gz.sha256"
          done
          ls -l assets

      - name: Build the wheels
        id: wheel
        run: |
          set -euo pipefail
          python3 packaging/pypi/build_wheels.py --assets assets --out dist \
            --mongodb-version "${{ steps.resolve.outputs.mongodb_version }}" \
            --postgres-version "${{ steps.resolve.outputs.postgres_version }}"
          echo "version=$(python3 -c 'import sys; sys.path.insert(0, "packaging/pypi"); import build_wheels; print(build_wheels.pep440(sys.argv[1]))' "${{ steps.resolve.outputs.mongodb_version }}")" >> "$GITHUB_OUTPUT"
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pypi-wheels
          path: dist/*.whl
          if-no-files-found: error

  smoke:
    needs: build
    name: smoke ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: manylinux
          - os: macos-15
            platform: macosx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: packaging/pypi
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pypi-wheels
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      # Both installs resolve from dist/ by name, as `pip install SecantusDB`
      # does, rather than naming a file: which of the two wheels the installer
      # picks is part of what is being tested. The smoke test asserts it.
      - name: CPython 3.12 picks the abi3 wheel; both modes, both servers
        run: |
          set -euo pipefail
          uv venv --python 3.12 venv
          uv pip install --python venv/bin/python pymongo "psycopg[binary]"
          # --no-index: the wheels under test, never a published SecantusDB.
          uv pip install --python venv/bin/python --no-index --find-links dist SecantusDB
          # From outside the checkout, so the installed package is what imports.
          cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/venv/bin/python" -I "$GITHUB_WORKSPACE/packaging/pypi/smoke_test.py"
      - name: Free-threaded CPython 3.13t picks the fallback wheel and says why
        run: |
          set -euo pipefail
          uv venv --python 3.13t venv-ft
          uv pip install --python venv-ft/bin/python --no-index --find-links dist SecantusDB
          cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/venv-ft/bin/python" -I "$GITHUB_WORKSPACE/packaging/pypi/smoke_test.py" --fallback

  # PyPI trusted publisher: bound on the PyPI side to this repository, this
  # workflow file (publish-pypi.yml) and the `pypi` environment. Renaming any
  # of the three needs the binding redone on pypi.org.
  publish:
    needs: [build, smoke]
    if: github.event_name == 'workflow_run' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/SecantusDB/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pypi-wheels
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          packages-dir: dist/
          attestations: true
