name: Validate (driver conformance)

# Runs the vendored MongoDB driver test suites (pymongo, pymongo-async, go,
# node, java, kotlin, ruby, rust, php-lib, php-ext, c, cxx, dotnet), each
# unmodified, against the Rust MongoDB server, and the SQL gauges (psycopg,
# sqlalchemy, sql-stress, pgjdbc, pgtest, pgx, slt) against the Rust
# PostgreSQL server, `secantusd-pg` (the SQL lanes carry `"pg": true` in
# .github/validate-lanes.json). Every lane is a `*-rust-server` lane and
# regenerates its `docs/validation-report*-rust-server.md`. The lanes against
# the Python servers stopped with their full deprecation (2026-10-20).
# Slow (~10–15 min per driver on a fresh WT build) so this is NOT on every
# push — it runs weekly on Monday and can be triggered manually.
#
# Layout: each driver gauge runs as its own matrix entry on a fresh
# runner with only the toolchain it needs. The `aggregate` job that
# follows downloads every gauge's report artifact, drops them into
# `docs/`, and opens a single PR with the combined diff if anything
# changed. Splitting the gauges across runners turns the ~30–40 min
# serial run into ~10–15 min of wall-clock, at the cost of 5×
# runner-minutes total — fine for weekly cadence.

on:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      only:
        description: >-
          Comma-separated lane or group names to run (e.g. "rust-rust-server",
          "go-rust-server,c-rust-server" or "pgjdbc-rust-server"). Empty = every lane. Single-lane dispatches are
          how a wedged or flaky gauge gets diagnosed without burning the
          whole matrix; the aggregate/report PR step is skipped
          for filtered runs (a partial artifact set must never overwrite
          the full weekly reports).
        required: false
        default: ""

jobs:
  # Resolves the lane matrix from .github/validate-lanes.json, filtered by the
  # `only` dispatch input (exact-name match within the comma list, so
  # "rust-server" can't accidentally select "rust-rust-server"). A plan job is the only way
  # to filter a matrix by an input: `matrix` is not a named value job-level
  # `if` may reference (merging such an `if` broke every trigger of this
  # workflow at parse time — found the hard way).
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: .github/validate-lanes.json
          sparse-checkout-cone-mode: false
      - name: Pick lanes
        id: pick
        env:
          ONLY: ${{ inputs.only || '' }}
        run: |
          if [ -z "$ONLY" ]; then
            m=$(jq -c . .github/validate-lanes.json)
          else
            m=$(jq -c --arg only ",$ONLY," '[.[] | select((("," + .name + ",") as $n | $only | contains($n)) or ((.group // "") != "" and (("," + .group + ",") as $g | $only | contains($g))))]' .github/validate-lanes.json)
          fi
          n=$(jq length <<<"$m")
          echo "running $n lane(s)"
          if [ "$n" -eq 0 ]; then
            echo "::error::only='$ONLY' matched no lanes in .github/validate-lanes.json"
            exit 1
          fi
          echo "matrix=$m" >> "$GITHUB_OUTPUT"

  validate:
    name: ${{ matrix.driver.name }}
    needs: plan
    runs-on: ubuntu-latest
    # Least privilege: this job checks out the repo and then runs a dozen
    # third-party driver toolchains (Go modules, npm, Maven/Gradle, gems,
    # crates, PHP builds, the .NET SDK) whose transitive dependencies don't
    # carry this repo's SHA-pinning discipline. An explicit grant keeps the
    # job's token read-only regardless of the org/repo default. Artifact
    # upload needs no contents write.
    permissions:
      contents: read
    # A wedged gauge must fail fast, not burn the 6-hour default: the rust
    # gauge spent two consecutive weekly runs crawling to the 6h kill (cold
    # cargo cache + per-filter timeouts compounding — see rust_validation/
    # runner.py's pre-build note). The slowest healthy lane (cxx cold build)
    # is ~30-40 min; 2h is generous headroom for any cold cache. The slt lane
    # runs 60 files twice (simple and extended protocol), a fresh server per
    # file; 5h was its calibration on the Python server, kept until a run of
    # the Rust server measures it.
    timeout-minutes: ${{ matrix.driver.name == 'slt-rust-server' && 300 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        # The lane list lives in .github/validate-lanes.json (name / task /
        # report per lane) so the plan job can filter it by the `only`
        # dispatch input. Per-lane requirements are encoded in the step
        # conditions below (toolchain setup per language, port/serial rules);
        # add a new lane by appending to the JSON and extending whichever
        # setup-step conditions its toolchain needs.
        driver: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive   # vendor/wiredtiger + the per-driver vendored submodule
      - name: Move the host time zone off UTC
        # Every hosted runner is UTC, which hides any code that wrongly uses
        # the host's local time. See .github/actions/non-utc-host for why
        # Newfoundland, and why the host zone rather than TZ.
        uses: ./.github/actions/non-utc-host

      - name: Install swig
        uses: ./.github/actions/apt-install
        with:
          packages: swig liblz4-dev

      # The Rust-server gauge builds the _secantus_storage / _secantus_server
      # extensions inside the wheel build: bindgen needs libclang, the WT
      # ExternalProject forces Ninja, and the cargo build needs a Rust toolchain.
      - name: Install storage-engine toolchain
        uses: ./.github/actions/apt-install
        with:
          packages: clang libclang-dev llvm-dev ninja-build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (storage engine ON)
        # The editable build runs CMake with the storage-engine flag flipped
        # ON so `import _secantus_server` works in the project
        # venv — that's what `invoke validate --server rust` launches.
        env:
          SKBUILD_CMAKE_DEFINE: SECANTUS_BUILD_STORAGE_ENGINE=ON
        run: uv sync --extra dev

      # The SQL lanes measure the Rust PostgreSQL server, which builds from
      # its own directory against the WiredTiger the sync above built. The
      # gauges run the debug binary (`pg_gauge_server.RUST_BINARY`) and refuse
      # one not built from this tree, so it is built here rather than cached.
      - name: Build secantusd-pg
        if: matrix.driver.pg
        shell: bash
        run: |
          WT="$PWD/$(ls -d build/*/wt-build | head -1)"
          export SECANTUS_WT_INCLUDE="$WT/include" SECANTUS_WT_LIB="$WT"
          # bindgen needs libclang; find it wherever the runner's LLVM put it.
          lc="$(find /usr/lib /usr/lib64 \( -name 'libclang.so*' -o -name 'libclang-[0-9]*.so*' \) 2>/dev/null | sort | head -1)"
          test -n "$lc" || { echo "libclang not found" >&2; exit 1; }
          export LIBCLANG_PATH="$(dirname "$lc")"
          (cd crates/secantus-pg && cargo build --bin secantusd-pg)
          test -x crates/secantus-pg/target/debug/secantusd-pg

      # The sql-stress smoke drives unmodified pgbench + psql.
      - name: Install pgbench + psql
        if: matrix.driver.name == 'sql-stress-rust-server'
        uses: ./.github/actions/apt-install
        with:
          packages: postgresql-contrib postgresql-client

      # The C gauge builds the vendored mongo-c-driver's test-libmongoc
      # binary from source (CMake): needs cmake + OpenSSL headers. A C
      # compiler is preinstalled on ubuntu-latest.
      - name: Install C-driver build toolchain
        if: matrix.driver.name == 'c-rust-server'
        uses: ./.github/actions/apt-install
        with:
          packages: cmake libssl-dev

      - name: Cache test-libmongoc build
        if: matrix.driver.name == 'c-rust-server'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # The from-source build (~several min cold) is the dominant cost.
          # Pin the cache to the vendored driver SHA so a submodule bump
          # rebuilds cleanly.
          path: vendor/mongo-c-driver/_build
          key: ${{ runner.os }}-libmongoc-${{ hashFiles('vendor/mongo-c-driver/VERSION_CURRENT', 'vendor/mongo-c-driver/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-libmongoc-

      # The C++ gauge builds the vendored libmongoc (installed to a prefix) AND
      # the mongocxx test_driver Catch2 binary from source — needs cmake, a
      # C++17 compiler (preinstalled), and OpenSSL headers.
      - name: Install C++-driver build toolchain
        if: matrix.driver.name == 'cxx-rust-server'
        uses: ./.github/actions/apt-install
        with:
          packages: cmake libssl-dev

      - name: Cache libmongoc install + mongocxx build
        if: matrix.driver.name == 'cxx-rust-server'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # The libmongoc install + mongocxx build (~10-15 min cold) dominate.
          # Pin to both vendored driver versions so either bump rebuilds.
          path: |
            vendor/mongo-c-driver/_install
            vendor/mongo-c-driver/_install_build
            vendor/mongo-cxx-driver/_build
          key: ${{ runner.os }}-mongocxx-${{ hashFiles('vendor/mongo-c-driver/VERSION_CURRENT', 'vendor/mongo-cxx-driver/etc/purls.txt', 'vendor/mongo-cxx-driver/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-mongocxx-

      # The .NET gauge runs mongo-csharp-driver's xUnit suite via `dotnet test`.
      # The driver's Encryption project verifies a downloaded libmongocrypt with
      # gpg (preinstalled on ubuntu-latest) during build. The test project
      # targets net10.0.
      - name: Set up .NET SDK
        if: startsWith(matrix.driver.name, 'dotnet')
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        if: startsWith(matrix.driver.name, 'dotnet')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('vendor/mongo-csharp-driver/**/*.csproj', 'vendor/mongo-csharp-driver/**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Set up Go
        if: matrix.driver.name == 'go-rust-server' || matrix.driver.name == 'pgx-rust-server' || matrix.driver.name == 'pgtest-rust-server'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.25"

      - name: Cache Go modules + build
        if: matrix.driver.name == 'go-rust-server'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # Pin the cache to the vendored mongo-go-driver submodule SHA so a
          # submodule bump invalidates cleanly. ``go.sum`` is captured inside
          # the submodule already; using the submodule pointer file (``.gitmodules``
          # entry + the parent commit's tree) would be equivalent but harder
          # to spell in ``hashFiles``. The submodule SHA is what changed in
          # the parent commit, so its hash is the right cache key.
          key: ${{ runner.os }}-go-${{ hashFiles('vendor/mongo-go-driver/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Set up Node.js
        if: startsWith(matrix.driver.name, 'node')
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"

      - name: Cache node_modules
        if: startsWith(matrix.driver.name, 'node')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: vendor/node-mongodb-native/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('vendor/node-mongodb-native/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Set up JDK
        if: matrix.driver.name == 'java-rust-server' || matrix.driver.name == 'kotlin-rust-server' || startsWith(matrix.driver.name, 'pgjdbc')
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle caches + wrapper
        if: matrix.driver.name == 'java-rust-server' || matrix.driver.name == 'kotlin-rust-server' || startsWith(matrix.driver.name, 'pgjdbc')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Cache the gradle distribution (``~/.gradle/wrapper`` is ~150 MB)
          # plus dependency caches. Key on every build script + version
          # catalogue file in the vendored driver, so any version bump
          # invalidates cleanly. The buildSrc compile (~1m on cold cache)
          # is by far the biggest win here.
          key: ${{ runner.os }}-gradle-${{ hashFiles('vendor/mongo-java-driver/gradle/wrapper/gradle-wrapper.properties', 'vendor/mongo-java-driver/**/*.gradle*', 'vendor/mongo-java-driver/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Ruby
        if: startsWith(matrix.driver.name, 'ruby')
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8  # v1
        with:
          ruby-version: "3.3"
          bundler-cache: false  # gems installed via runner's bundle install

      - name: Cache Ruby bundle
        if: startsWith(matrix.driver.name, 'ruby')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: vendor/mongo-ruby-driver/.bundle
          key: ${{ runner.os }}-ruby-bundle-${{ hashFiles('vendor/mongo-ruby-driver/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruby-bundle-

      - name: Set up Rust
        if: matrix.driver.name == 'rust-rust-server'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable
        with:
          # mongo-rust-driver's MSRV is 1.88; stable on Actions is
          # ahead of that as of writing.
          toolchain: stable

      # The slt gauge's runner binary. Cached by pinned version so the
      # ~3-min cargo build only happens when the pin moves; the version pin
      # mirrors the psycopg==3.3.4 discipline (the gauge measures SecantusDB,
      # not runner drift). slt_validation/runner.py falls back to
      # ~/.cargo/bin/sqllogictest, which is where cargo install puts it.
      - name: Cache sqllogictest binary
        if: matrix.driver.name == 'slt-rust-server'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/bin/sqllogictest
          key: ${{ runner.os }}-sqllogictest-bin-0.29.1

      - name: Install sqllogictest-rs
        if: matrix.driver.name == 'slt-rust-server'
        run: |
          if [ ! -x ~/.cargo/bin/sqllogictest ]; then
            cargo install sqllogictest-bin --version 0.29.1 --locked
          fi
          ~/.cargo/bin/sqllogictest --version

      # Split restore/save (not plain actions/cache) so a failed or killed
      # job STILL saves the compiled target. The plain form only saves on
      # job success, which is how the rust gauge wedged itself for two
      # weeks: the cache evicted (7-day TTL), the cold run overran the job
      # limit and was killed, the kill skipped the save, and every later
      # weekly run started cold again.
      - name: Restore cargo registry + target
        id: cargo-cache
        if: matrix.driver.name == 'rust-rust-server'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/mongo-rust-driver/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('vendor/mongo-rust-driver/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Both PHP gauges need PHP + the mongodb extension. setup-php bundles
      # composer (the lib gauge runs `composer install`) and the php-dev
      # build files (the ext gauge's run-tests.php). The extension is pinned
      # to the version the vendored mongo-php-driver submodule is tagged at,
      # so the .phpt tests stay version-aligned.
      - name: Set up PHP
        if: startsWith(matrix.driver.name, 'php-')
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2
        with:
          php-version: "8.3"
          extensions: mongodb-2.3.3
          tools: composer

      - name: Run ${{ matrix.driver.name }} validation
        env:
          # gauge_common.rust_binary()'s default search only covers the cargo
          # target dir; the storage-engine sync stages the daemon in .venv/bin.
          SECANTUSDB_BIN: .venv/bin/secantusd-rs
          # The 2-core runner executes slt files 5-10x slower than a dev
          # machine; 300s (the local calibration) timed out ~15 files that
          # passed locally in ~25s each on the first weekly slt run.
          SECANTUS_SLT_FILE_TIMEOUT: ${{ matrix.driver.name == 'slt-rust-server' && '900' || '' }}
        run: uv run python -m invoke ${{ matrix.driver.task }}

      # Companion of the split restore above: persist the compiled driver
      # target even when the gauge failed or timed out, so the next run never
      # starts from a cold compile. Saving over an existing identical key is
      # a no-op warning, not an error.
      - name: Save cargo registry + target
        if: always() && matrix.driver.name == 'rust-rust-server'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/mongo-rust-driver/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      # The steps below run when the gauge step FAILED too (`!cancelled()`).
      # A gauge whose generator exits non-zero on unexpected failures (slt
      # does) still wrote its report, and that report is the finding: when
      # these steps were skipped, a red lane's numbers never reached the
      # reports PR, so a regression removed its own evidence. The lane stays
      # red; a lane that wrote nothing fails again here on the missing file.
      - name: Show report summary
        if: ${{ !cancelled() && matrix.driver.report != '' }}
        run: head -50 ${{ matrix.driver.report }}

      - name: Upload report artifact
        # Shard lanes (a `group` without a `report`) produce only a raw
        # artifact; their group's merge job renders the report.
        if: ${{ !cancelled() && matrix.driver.report != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: report-${{ matrix.driver.name }}
          path: ${{ matrix.driver.report }}
          if-no-files-found: error

      # The raw gauge output (pytest-json / JUnit XML / mocha JSON / ...) feeds
      # the cross-driver summary regeneration in the aggregate job. Each runner
      # executes exactly one gauge, so its .validation/ holds only that gauge's
      # artifacts.
      - name: Upload raw gauge output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: raw-${{ matrix.driver.name }}
          path: .validation/
          if-no-files-found: error
          # .validation is a dot-directory; upload-artifact EXCLUDES hidden
          # files by default, which made this step find zero files and fail
          # every gauge job on the first live run (while the summary then
          # regenerated from an empty .validation/ — "the 0 gauges").
          include-hidden-files: true

  pgjdbc-report:
    name: Merge pgjdbc shards into the report
    needs: [plan, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # `always()` so one red shard still yields a merged report of whatever
    # completed — the generator itself refuses an INCOMPLETE shard set, so a
    # missing shard fails here loudly instead of shipping a short denominator.
    if: >-
      always() && !cancelled() &&
      contains(needs.plan.outputs.matrix, 'pgjdbc-rust-server-1')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download pgjdbc shard raws
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: raw-pgjdbc-rust-server-*
          path: artifacts

      - name: Reassemble .validation
        run: |
          shopt -s nullglob
          mkdir -p .validation
          staged=0
          for d in artifacts/raw-pgjdbc-rust-server-*/; do
            cp -R "$d". .validation/
            staged=$((staged + 1))
          done
          if [ "$staged" -eq 0 ]; then
            echo "::error::no pgjdbc shard raw artifacts found — the shard jobs uploaded nothing"
            exit 1
          fi
          ls .validation/

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Merge shards into the report
        # --no-project: the generator is stdlib-only (it reads the server's
        # version from its Cargo.toml), so no WT build is needed here.
        run: |
          PYTHONPATH=. uv run --no-project python -m pgjdbc_validation.generate_report \
            .validation/pgjdbc-raw-shard-*-rust-server.json docs/validation-report-pgjdbc-rust-server.md

      - name: Upload merged report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: report-pgjdbc-rust-server
          path: docs/validation-report-pgjdbc-rust-server.md
          if-no-files-found: error

  aggregate:
    name: Aggregate reports and open PR
    needs: [validate, pgjdbc-report]
    runs-on: ubuntu-latest
    # `always()` so the aggregate step runs even if one driver gauge fails —
    # we still want to ship the reports for the gauges that did succeed so a
    # regression in one driver doesn't hide partial progress in the others.
    # Skipped for lane-filtered dispatches: a partial artifact set must never
    # regenerate the cross-driver summary or open a reports PR.
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'workflow_dispatch' || inputs.only == '')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download all report artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts

      - name: Stage downloaded reports into docs/
        run: |
          # Each artifact is `report-<driver>` and contains the single
          # report it produced at the ARTIFACT ROOT — upload-artifact@v4
          # strips the common parent (`docs/`), so the old
          # `report-*/docs/...` glob matched nothing and the weekly PR
          # was silently never opened. `set -u` + an explicit count so an
          # empty match can never again read as "no change".
          shopt -s nullglob
          staged=0
          for f in artifacts/report-*/validation-report*.md; do
            cp "$f" docs/
            staged=$((staged + 1))
          done
          if [ "$staged" -eq 0 ]; then
            echo "::error::no validation reports found under artifacts/ — staging glob is broken again"
            exit 1
          fi
          ls -la docs/validation-report*.md

      - name: Reassemble .validation from raw artifacts
        # Same zero-match guard discipline as the report staging above: an
        # empty reassembly must fail here, not ship a summary that says
        # "the 0 gauges compare like for like".
        run: |
          shopt -s nullglob
          mkdir -p .validation
          staged=0
          for d in artifacts/raw-*/; do
            cp -R "$d". .validation/
            staged=$((staged + 1))
          done
          if [ "$staged" -eq 0 ]; then
            echo "::error::no raw gauge artifacts found under artifacts/ — the raw-upload step is broken again"
            exit 1
          fi
          echo "reassembled $staged raw artifact(s)"
          ls .validation/

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Regenerate cross-driver summary
        # --no-project: the generator is stdlib-only and reads the package
        # version straight from src/, so no WT build is needed here.
        run: |
          PYTHONPATH=. uv run --no-project python -m validation_summary.generate \
            --raw-dir .validation --server rust --out docs/validation-summary.md
          head -20 docs/validation-summary.md

      - name: Track new report files
        # `git diff --quiet` is blind to untracked files (a brand-new
        # gauge's report, e.g. validation-report-rust-server.md, would be
        # invisible). Intent-to-add makes them show up in the diff.
        run: git add --intent-to-add docs/validation-report*.md docs/validation-summary.md

      - name: Open PR if reports changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet docs/validation-report*.md docs/validation-summary.md; then
            echo "No change to validation reports."
            exit 0
          fi
          branch="validation-report-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/validation-report*.md docs/validation-summary.md
          git commit -m "Refresh validation reports + cross-driver summary (driver gauges against the Rust MongoDB server, SQL gauges against the Rust PostgreSQL server)"
          git push -u origin "$branch"
          gh pr create \
            --title "Refresh validation reports" \
            --body "Automated weekly refresh of every driver-conformance validation report, each MongoDB driver's own suite against the Rust MongoDB server and each SQL gauge against the Rust PostgreSQL server (the \`*-rust-server\` lanes). The cross-driver summary (docs/validation-summary.md) is regenerated from the same run's raw artifacts. Inspect the per-category numbers for regressions or new pass-rate wins. Per-driver gauges ran in parallel; check each gauge's job log for the underlying pytest / mocha / rspec / gradle / go-test / cargo-test / phpunit / run-tests.php / dotnet-test / pgbench / sqllogictest output."
