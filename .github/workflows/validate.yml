name: Validate (driver conformance)

# Runs the vendored driver test suites (pymongo, go, node, java,
# ruby, rust) against SecantusDB and regenerates the per-driver
# `docs/validation-report*.md` files. Slow (~10–15 min per driver on
# a fresh WT build) so this is NOT on every push — it runs weekly on
# Monday and can be triggered manually.
#
# Layout: each driver gauge runs as its own matrix entry on a fresh
# runner with only the toolchain it needs. The `aggregate` job that
# follows downloads every gauge's report artifact, drops them into
# `docs/`, and opens a single PR with the combined diff if anything
# changed. Splitting the gauges across runners turns the ~30–40 min
# serial run into ~10–15 min of wall-clock, at the cost of 5×
# runner-minutes total — fine for weekly cadence.

on:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC
  workflow_dispatch:

jobs:
  validate:
    name: ${{ matrix.driver.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver:
          - { name: pymongo, task: validate,      report: docs/validation-report.md }
          - { name: go,      task: validate-go,   report: docs/validation-report-go.md }
          - { name: node,    task: validate-node, report: docs/validation-report-node.md }
          - { name: java,    task: validate-java, report: docs/validation-report-java.md }
          - { name: ruby,    task: validate-ruby, report: docs/validation-report-ruby.md }
          - { name: rust,    task: validate-rust, report: docs/validation-report-rust.md }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # vendor/wiredtiger + the per-driver vendored submodule

      - name: Install swig
        run: sudo apt-get update && sudo apt-get install -y swig

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev   # builds vendored WT, installs pytest-json-report

      - name: Set up Go
        if: matrix.driver.name == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Cache Go modules + build
        if: matrix.driver.name == 'go'
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # Pin the cache to the vendored mongo-go-driver submodule SHA so a
          # submodule bump invalidates cleanly. ``go.sum`` is captured inside
          # the submodule already; using the submodule pointer file (``.gitmodules``
          # entry + the parent commit's tree) would be equivalent but harder
          # to spell in ``hashFiles``. The submodule SHA is what changed in
          # the parent commit, so its hash is the right cache key.
          key: ${{ runner.os }}-go-${{ hashFiles('vendor/mongo-go-driver/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Set up Node.js
        if: matrix.driver.name == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache node_modules
        if: matrix.driver.name == 'node'
        uses: actions/cache@v4
        with:
          path: vendor/node-mongodb-native/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('vendor/node-mongodb-native/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Set up JDK
        if: matrix.driver.name == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle caches + wrapper
        if: matrix.driver.name == 'java'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Cache the gradle distribution (``~/.gradle/wrapper`` is ~150 MB)
          # plus dependency caches. Key on every build script + version
          # catalogue file in the vendored driver, so any version bump
          # invalidates cleanly. The buildSrc compile (~1m on cold cache)
          # is by far the biggest win here.
          key: ${{ runner.os }}-gradle-${{ hashFiles('vendor/mongo-java-driver/gradle/wrapper/gradle-wrapper.properties', 'vendor/mongo-java-driver/**/*.gradle*', 'vendor/mongo-java-driver/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Ruby
        if: matrix.driver.name == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false  # gems installed via runner's bundle install

      - name: Cache Ruby bundle
        if: matrix.driver.name == 'ruby'
        uses: actions/cache@v4
        with:
          path: vendor/mongo-ruby-driver/.bundle
          key: ${{ runner.os }}-ruby-bundle-${{ hashFiles('vendor/mongo-ruby-driver/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruby-bundle-

      - name: Set up Rust
        if: matrix.driver.name == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          # mongo-rust-driver's MSRV is 1.88; stable on Actions is
          # ahead of that as of writing.
          toolchain: stable

      - name: Cache cargo registry + target
        if: matrix.driver.name == 'rust'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/mongo-rust-driver/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('vendor/mongo-rust-driver/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run ${{ matrix.driver.name }} validation
        run: uv run python -m invoke ${{ matrix.driver.task }}

      - name: Show report summary
        run: head -50 ${{ matrix.driver.report }}

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.driver.name }}
          path: ${{ matrix.driver.report }}
          if-no-files-found: error

  aggregate:
    name: Aggregate reports and open PR
    needs: validate
    runs-on: ubuntu-latest
    # `always()` so the aggregate step runs even if one driver gauge fails —
    # we still want to ship the reports for the gauges that did succeed so a
    # regression in one driver doesn't hide partial progress in the others.
    if: always() && !cancelled()
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all report artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage downloaded reports into docs/
        run: |
          # Each artifact is `report-<driver>` and contains the single
          # `docs/validation-report*.md` it produced (path was preserved
          # by upload-artifact). Copy into the checkout so a `git diff`
          # against main captures every gauge's update in one place.
          shopt -s nullglob
          for f in artifacts/report-*/docs/validation-report*.md; do
            cp "$f" docs/
          done
          ls -la docs/validation-report*.md

      - name: Open PR if reports changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet docs/validation-report*.md; then
            echo "No change to validation reports."
            exit 0
          fi
          branch="validation-report-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/validation-report*.md
          git commit -m "Refresh validation reports (pymongo + go + node + java + ruby + rust)"
          git push -u origin "$branch"
          gh pr create \
            --title "Refresh validation reports" \
            --body "Automated weekly refresh of pymongo / go-driver / node-driver / java-driver / ruby-driver / rust-driver validation reports. Inspect the per-category numbers for regressions or new pass-rate wins. Per-driver gauges ran in parallel; check each gauge's job log for the underlying pytest / mocha / rspec / gradle / go-test / cargo-test output."
