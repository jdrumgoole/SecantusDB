name: Validate (pymongo conformance)

# Runs the vendored pymongo test suite against an embedded SecantusDB
# and regenerates docs/validation-report.md. Slow (~1-2 min on a fresh
# WT build) so this is NOT on every push — it runs weekly on Monday and
# can be triggered manually.

on:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # pulls vendor/wiredtiger AND vendor/pymongo-tests

      - name: Install swig
        run: sudo apt-get update && sudo apt-get install -y swig

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev   # builds vendored WT, installs pytest-json-report

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false  # we install gems via the runner's bundle install

      - name: Run pymongo validation
        run: uv run python -m invoke validate

      - name: Run go-driver validation
        run: uv run python -m invoke validate-go

      - name: Run node-driver validation
        run: uv run python -m invoke validate-node

      - name: Run java-driver validation
        run: uv run python -m invoke validate-java

      - name: Run ruby-driver validation
        run: uv run python -m invoke validate-ruby

      - name: Show report summaries
        run: |
          echo "=== pymongo ==="
          head -50 docs/validation-report.md
          echo
          echo "=== go-driver ==="
          head -50 docs/validation-report-go.md
          echo
          echo "=== node-driver ==="
          head -50 docs/validation-report-node.md
          echo
          echo "=== java-driver ==="
          head -50 docs/validation-report-java.md
          echo
          echo "=== ruby-driver ==="
          head -50 docs/validation-report-ruby.md

      # If either report changed, open a PR rather than committing directly to
      # main — keeps a human in the loop on coverage shifts.
      - name: Open PR if reports changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet docs/validation-report.md docs/validation-report-go.md docs/validation-report-node.md docs/validation-report-java.md docs/validation-report-ruby.md; then
            echo "No change to validation reports."
            exit 0
          fi
          branch="validation-report-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/validation-report.md docs/validation-report-go.md docs/validation-report-node.md docs/validation-report-java.md docs/validation-report-ruby.md
          git commit -m "Refresh validation reports (pymongo + go + node + java + ruby)"
          git push -u origin "$branch"
          gh pr create \
            --title "Refresh validation reports" \
            --body "Automated weekly refresh of pymongo / go-driver / node-driver / java-driver / ruby-driver validation reports. Inspect the per-category numbers for regressions or new pass-rate wins."
