name: Validate (driver conformance)

# Runs the vendored driver test suites (pymongo, pymongo-async, go, node,
# java, kotlin, ruby, rust, php-lib, php-ext, c, cxx, dotnet, psycopg, slt,
# plus the pymongo- and java-vs-Rust-server gates) against SecantusDB and
# regenerates the per-driver
# `docs/validation-report*.md` files. Slow (~10–15 min per driver on
# a fresh WT build) so this is NOT on every push — it runs weekly on
# Monday and can be triggered manually.
#
# Layout: each driver gauge runs as its own matrix entry on a fresh
# runner with only the toolchain it needs. The `aggregate` job that
# follows downloads every gauge's report artifact, drops them into
# `docs/`, and opens a single PR with the combined diff if anything
# changed. Splitting the gauges across runners turns the ~30–40 min
# serial run into ~10–15 min of wall-clock, at the cost of 5×
# runner-minutes total — fine for weekly cadence.

on:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC
  workflow_dispatch:

jobs:
  validate:
    name: ${{ matrix.driver.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver:
          - { name: pymongo, task: validate,      report: docs/validation-report.md }
          - { name: pymongo-async, task: validate-pymongo-async, report: docs/validation-report-pymongo-async.md }
          - { name: go,      task: validate-go,   report: docs/validation-report-go.md }
          - { name: node,    task: validate-node, report: docs/validation-report-node.md }
          - { name: java,    task: validate-java, report: docs/validation-report-java.md }
          - { name: kotlin,  task: validate-kotlin, report: docs/validation-report-kotlin.md }
          - { name: ruby,    task: validate-ruby, report: docs/validation-report-ruby.md }
          - { name: rust,    task: validate-rust, report: docs/validation-report-rust.md }
          - { name: php-lib, task: validate-php-lib, report: docs/validation-report-php-lib.md }
          - { name: php-ext, task: validate-php-ext, report: docs/validation-report-php-ext.md }
          - { name: c,       task: validate-c,    report: docs/validation-report-c.md }
          - { name: cxx,     task: validate-cxx,  report: docs/validation-report-cxx.md }
          - { name: dotnet,  task: validate-dotnet, report: docs/validation-report-dotnet.md }
          # The SQL-server gauge (tasks/sql-gauges-plan.md G2): psycopg 3's own
          # unmodified test suite over PSYCOPG_TEST_DSN against a daemon
          # SecantusPGServer. Python-only toolchain — psycopg[binary] ships libpq.
          - { name: psycopg, task: validate-psycopg, report: docs/validation-report-psycopg.md }
          # The SQL-server ORM gauge (tasks/sql-gauges-plan.md G6): SQLAlchemy's
          # dialect-compliance suite (ships inside the sqlalchemy package —
          # nothing vendored) against a daemon SecantusPGServer. Python-only.
          - { name: sqlalchemy, task: validate-sqlalchemy, report: docs/validation-report-sqlalchemy.md }
          # The SQL-server stress/smoke (tasks/sql-gauges-plan.md G7): pgbench
          # init + TPC-B (three protocol modes) + select-only + psql catalog
          # smoke. Needs pgbench/psql (postgresql-contrib, installed below).
          - { name: sql-stress, task: sql-stress, report: docs/validation-report-sqlstress.md }
          # The SQL-server JDBC gauge (tasks/sql-gauges-plan.md G5): pgjdbc's
          # own suite, unmodified, targeted via its stock
          # build.local.properties. Needs JDK 21 (setup-java step below).
          - { name: pgjdbc, task: validate-pgjdbc, report: docs/validation-report-pgjdbc.md }
          # The SQL-server wire-protocol gauge (tasks/sql-gauges-plan.md G3):
          # cockroach's pgtest datadriven corpus + runner, fetched verbatim at
          # a pinned commit (sparse clone, cached) and driven over pgproto3.
          # Needs the Go toolchain (shared setup step with the go/pgx gauges).
          - { name: pgtest, task: validate-pgtest, report: docs/validation-report-pgtest.md }
          # The SQL-server low-level Go gauge (tasks/sql-gauges-plan.md G4):
          # jackc/pgx's pgconn + pgproto3 packages, unmodified, over
          # PGX_TEST_DATABASE. Needs the Go toolchain (shared with the go
          # gauge's setup step below).
          - { name: pgx, task: validate-pgx, report: docs/validation-report-pgx.md }
          # The SQL-server correctness gauge (tasks/sql-gauges-plan.md G1): the
          # vendored sqllogictest corpus executed by sqllogictest-rs over real
          # pgwire against a fresh daemon SecantusPGServer per file. Needs the
          # `sqllogictest` binary (cargo install, cached below).
          - { name: slt, task: validate-slt, report: docs/validation-report-slt.md }
          # The R8 gate (tasks/rust-server-plan.md): the SAME unmodified pymongo
          # suite as the headline gauge, pointed at the Rust server via
          # SECANTUS_GAUGE_SERVER=rust. Needs the _secantus_server extension, so
          # its sync step builds the wheel with SECANTUS_BUILD_STORAGE_ENGINE=ON
          # (extra toolchain steps below).
          - { name: pymongo-rust-server, task: "validate --server rust", report: docs/validation-report-rust-server.md }
          # The Java analogue of the R8 gate: the SAME unmodified
          # mongo-java-driver suite as the java gauge, pointed at the
          # standalone Rust server. Needs the JVM toolchain of the java gauge
          # PLUS the storage-engine sync, which stages the secantusd-rs
          # daemon into .venv/bin (SECANTUSDB_BIN on the run step points
          # gauge_common.rust_binary at it — the default search only covers
          # the cargo target dir).
          - { name: java-rust-server, task: "validate-java --server rust", report: docs/validation-report-java-rust-server.md }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive   # vendor/wiredtiger + the per-driver vendored submodule

      - name: Install swig
        run: sudo apt-get update && sudo apt-get install -y swig

      # The Rust-server gauge builds the _secantus_storage / _secantus_server
      # extensions inside the wheel build: bindgen needs libclang, the WT
      # ExternalProject forces Ninja, and the cargo build needs a Rust toolchain.
      - name: Install storage-engine toolchain
        if: contains(matrix.driver.name, 'rust-server')
        run: sudo apt-get install -y clang libclang-dev llvm-dev ninja-build

      - name: Install Rust toolchain
        if: contains(matrix.driver.name, 'rust-server')
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        if: ${{ !contains(matrix.driver.name, 'rust-server') }}
        run: uv sync --extra dev   # builds vendored WT, installs pytest-json-report

      - name: Sync dependencies (storage engine ON)
        if: contains(matrix.driver.name, 'rust-server')
        # Same sync, but the editable build runs CMake with the storage-engine
        # flag flipped ON so `import _secantus_server` works in the project
        # venv — that's what `invoke validate --server rust` launches.
        env:
          SKBUILD_CMAKE_DEFINE: SECANTUS_BUILD_STORAGE_ENGINE=ON
        run: uv sync --extra dev

      # The C gauge builds the vendored mongo-c-driver's test-libmongoc
      # binary from source (CMake): needs cmake + OpenSSL headers. A C
      # compiler is preinstalled on ubuntu-latest.
      # The sql-stress smoke drives unmodified pgbench + psql.
      - name: Install pgbench + psql
        if: matrix.driver.name == 'sql-stress'
        run: sudo apt-get update && sudo apt-get install -y postgresql-contrib postgresql-client

      - name: Install C-driver build toolchain
        if: matrix.driver.name == 'c'
        run: sudo apt-get install -y cmake libssl-dev

      - name: Cache test-libmongoc build
        if: matrix.driver.name == 'c'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # The from-source build (~several min cold) is the dominant cost.
          # Pin the cache to the vendored driver SHA so a submodule bump
          # rebuilds cleanly.
          path: vendor/mongo-c-driver/_build
          key: ${{ runner.os }}-libmongoc-${{ hashFiles('vendor/mongo-c-driver/VERSION_CURRENT', 'vendor/mongo-c-driver/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-libmongoc-

      # The C++ gauge builds the vendored libmongoc (installed to a prefix) AND
      # the mongocxx test_driver Catch2 binary from source — needs cmake, a
      # C++17 compiler (preinstalled), and OpenSSL headers.
      - name: Install C++-driver build toolchain
        if: matrix.driver.name == 'cxx'
        run: sudo apt-get install -y cmake libssl-dev

      - name: Cache libmongoc install + mongocxx build
        if: matrix.driver.name == 'cxx'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # The libmongoc install + mongocxx build (~10-15 min cold) dominate.
          # Pin to both vendored driver versions so either bump rebuilds.
          path: |
            vendor/mongo-c-driver/_install
            vendor/mongo-c-driver/_install_build
            vendor/mongo-cxx-driver/_build
          key: ${{ runner.os }}-mongocxx-${{ hashFiles('vendor/mongo-c-driver/VERSION_CURRENT', 'vendor/mongo-cxx-driver/etc/purls.txt', 'vendor/mongo-cxx-driver/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-mongocxx-

      # The .NET gauge runs mongo-csharp-driver's xUnit suite via `dotnet test`.
      # The driver's Encryption project verifies a downloaded libmongocrypt with
      # gpg (preinstalled on ubuntu-latest) during build. The test project
      # targets net10.0.
      - name: Set up .NET SDK
        if: matrix.driver.name == 'dotnet'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        if: matrix.driver.name == 'dotnet'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('vendor/mongo-csharp-driver/**/*.csproj', 'vendor/mongo-csharp-driver/**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Set up Go
        if: matrix.driver.name == 'go' || matrix.driver.name == 'pgx' || matrix.driver.name == 'pgtest'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.25"

      - name: Cache Go modules + build
        if: matrix.driver.name == 'go'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # Pin the cache to the vendored mongo-go-driver submodule SHA so a
          # submodule bump invalidates cleanly. ``go.sum`` is captured inside
          # the submodule already; using the submodule pointer file (``.gitmodules``
          # entry + the parent commit's tree) would be equivalent but harder
          # to spell in ``hashFiles``. The submodule SHA is what changed in
          # the parent commit, so its hash is the right cache key.
          key: ${{ runner.os }}-go-${{ hashFiles('vendor/mongo-go-driver/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Set up Node.js
        if: matrix.driver.name == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - name: Cache node_modules
        if: matrix.driver.name == 'node'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: vendor/node-mongodb-native/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('vendor/node-mongodb-native/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Set up JDK
        if: matrix.driver.name == 'java' || matrix.driver.name == 'kotlin' || matrix.driver.name == 'java-rust-server' || matrix.driver.name == 'pgjdbc'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle caches + wrapper
        if: matrix.driver.name == 'java' || matrix.driver.name == 'kotlin' || matrix.driver.name == 'java-rust-server' || matrix.driver.name == 'pgjdbc'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Cache the gradle distribution (``~/.gradle/wrapper`` is ~150 MB)
          # plus dependency caches. Key on every build script + version
          # catalogue file in the vendored driver, so any version bump
          # invalidates cleanly. The buildSrc compile (~1m on cold cache)
          # is by far the biggest win here.
          key: ${{ runner.os }}-gradle-${{ hashFiles('vendor/mongo-java-driver/gradle/wrapper/gradle-wrapper.properties', 'vendor/mongo-java-driver/**/*.gradle*', 'vendor/mongo-java-driver/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Ruby
        if: matrix.driver.name == 'ruby'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1
        with:
          ruby-version: "3.3"
          bundler-cache: false  # gems installed via runner's bundle install

      - name: Cache Ruby bundle
        if: matrix.driver.name == 'ruby'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: vendor/mongo-ruby-driver/.bundle
          key: ${{ runner.os }}-ruby-bundle-${{ hashFiles('vendor/mongo-ruby-driver/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruby-bundle-

      - name: Set up Rust
        if: matrix.driver.name == 'rust' || matrix.driver.name == 'slt'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable
        with:
          # mongo-rust-driver's MSRV is 1.88; stable on Actions is
          # ahead of that as of writing.
          toolchain: stable

      # The slt gauge's runner binary. Cached by pinned version so the
      # ~3-min cargo build only happens when the pin moves; the version pin
      # mirrors the psycopg==3.3.4 discipline (the gauge measures SecantusDB,
      # not runner drift). slt_validation/runner.py falls back to
      # ~/.cargo/bin/sqllogictest, which is where cargo install puts it.
      - name: Cache sqllogictest binary
        if: matrix.driver.name == 'slt'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/bin/sqllogictest
          key: ${{ runner.os }}-sqllogictest-bin-0.29.1

      - name: Install sqllogictest-rs
        if: matrix.driver.name == 'slt'
        run: |
          if [ ! -x ~/.cargo/bin/sqllogictest ]; then
            cargo install sqllogictest-bin --version 0.29.1 --locked
          fi
          ~/.cargo/bin/sqllogictest --version

      - name: Cache cargo registry + target
        if: matrix.driver.name == 'rust'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/mongo-rust-driver/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('vendor/mongo-rust-driver/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Both PHP gauges need PHP + the mongodb extension. setup-php bundles
      # composer (the lib gauge runs `composer install`) and the php-dev
      # build files (the ext gauge's run-tests.php). The extension is pinned
      # to the version the vendored mongo-php-driver submodule is tagged at,
      # so the .phpt tests stay version-aligned.
      - name: Set up PHP
        if: startsWith(matrix.driver.name, 'php-')
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: "8.3"
          extensions: mongodb-2.3.1
          tools: composer

      - name: Run ${{ matrix.driver.name }} validation
        env:
          # gauge_common.rust_binary()'s default search only covers the cargo
          # target dir; the storage-engine sync stages the daemon in .venv/bin.
          SECANTUSDB_BIN: ${{ matrix.driver.name == 'java-rust-server' && '.venv/bin/secantusd-rs' || '' }}
        run: uv run python -m invoke ${{ matrix.driver.task }}

      - name: Show report summary
        run: head -50 ${{ matrix.driver.report }}

      - name: Upload report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: report-${{ matrix.driver.name }}
          path: ${{ matrix.driver.report }}
          if-no-files-found: error

      # The raw gauge output (pytest-json / JUnit XML / mocha JSON / ...) feeds
      # the cross-driver summary regeneration in the aggregate job. Each runner
      # executes exactly one gauge, so its .validation/ holds only that gauge's
      # artifacts.
      - name: Upload raw gauge output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: raw-${{ matrix.driver.name }}
          path: .validation/
          if-no-files-found: error
          # .validation is a dot-directory; upload-artifact EXCLUDES hidden
          # files by default, which made this step find zero files and fail
          # every gauge job on the first live run (while the summary then
          # regenerated from an empty .validation/ — "the 0 gauges").
          include-hidden-files: true

  aggregate:
    name: Aggregate reports and open PR
    needs: validate
    runs-on: ubuntu-latest
    # `always()` so the aggregate step runs even if one driver gauge fails —
    # we still want to ship the reports for the gauges that did succeed so a
    # regression in one driver doesn't hide partial progress in the others.
    if: always() && !cancelled()
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download all report artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts

      - name: Stage downloaded reports into docs/
        run: |
          # Each artifact is `report-<driver>` and contains the single
          # report it produced at the ARTIFACT ROOT — upload-artifact@v4
          # strips the common parent (`docs/`), so the old
          # `report-*/docs/...` glob matched nothing and the weekly PR
          # was silently never opened. `set -u` + an explicit count so an
          # empty match can never again read as "no change".
          shopt -s nullglob
          staged=0
          for f in artifacts/report-*/validation-report*.md; do
            cp "$f" docs/
            staged=$((staged + 1))
          done
          if [ "$staged" -eq 0 ]; then
            echo "::error::no validation reports found under artifacts/ — staging glob is broken again"
            exit 1
          fi
          ls -la docs/validation-report*.md

      - name: Reassemble .validation from raw artifacts
        # Same zero-match guard discipline as the report staging above: an
        # empty reassembly must fail here, not ship a summary that says
        # "the 0 gauges compare like for like".
        run: |
          shopt -s nullglob
          mkdir -p .validation
          staged=0
          for d in artifacts/raw-*/; do
            cp -R "$d". .validation/
            staged=$((staged + 1))
          done
          if [ "$staged" -eq 0 ]; then
            echo "::error::no raw gauge artifacts found under artifacts/ — the raw-upload step is broken again"
            exit 1
          fi
          echo "reassembled $staged raw artifact(s)"
          ls .validation/

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Regenerate cross-driver summary
        # --no-project: the generator is stdlib-only and reads the package
        # version straight from src/, so no WT build is needed here.
        run: |
          PYTHONPATH=. uv run --no-project python -m validation_summary.generate \
            --raw-dir .validation --out docs/validation-summary.md
          head -20 docs/validation-summary.md

      - name: Track new report files
        # `git diff --quiet` is blind to untracked files (a brand-new
        # gauge's report, e.g. validation-report-rust-server.md, would be
        # invisible). Intent-to-add makes them show up in the diff.
        run: git add --intent-to-add docs/validation-report*.md docs/validation-summary.md

      - name: Open PR if reports changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet docs/validation-report*.md docs/validation-summary.md; then
            echo "No change to validation reports."
            exit 0
          fi
          branch="validation-report-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/validation-report*.md docs/validation-summary.md
          git commit -m "Refresh validation reports + cross-driver summary (pymongo + go + node + java + ruby + rust + php-lib + php-ext + pymongo-vs-Rust-server + java-vs-Rust-server)"
          git push -u origin "$branch"
          gh pr create \
            --title "Refresh validation reports" \
            --body "Automated weekly refresh of pymongo / go-driver / node-driver / java-driver / ruby-driver / rust-driver / php-library / php-extension validation reports, plus the pymongo-vs-Rust-server R8 gate and its java-vs-Rust-server analogue. The cross-driver summary (docs/validation-summary.md) is regenerated from the same run's raw artifacts. Inspect the per-category numbers for regressions or new pass-rate wins. Per-driver gauges ran in parallel; check each gauge's job log for the underlying pytest / mocha / rspec / gradle / go-test / cargo-test / phpunit / run-tests.php output."
