name: Build wheels

on:
  # Tag-triggered release builds belong to publish.yml (which also publishes).
  # wheels.yml is the on-demand / continuous-validation matrix.
  push:
    branches:
      - main  # Catch wheel regressions before they reach a tag.
    # Docs- and license-only commits don't affect the wheel; skip the
    # cibuildwheel matrix when nothing else changed. Pattern matches the
    # ignores in test.yml.
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - 'docs/**'
  workflow_dispatch:  # Manual ad-hoc trigger.

# Keyed on the ref so each branch / PR is its own lane: a newer push to the same
# ref cancels that ref's stale build, but distinct refs never cancel each other.
#
# Cancellation is disabled on `main`. Every merge lands on the same ref, so with
# unconditional cancel-in-progress a busy day cancels nearly every post-merge
# build before it finishes — observed repeatedly: several consecutive merge
# commits each showed `Build wheels: cancelled`, so the wheel matrix effectively
# never ran against the default branch and a wheel-only regression would have
# surfaced at release-tag time instead. On `main` the runs now queue and each
# completes; on a PR branch the newest push still cancels the stale one, which
# is what you want there.
#
# Trade-off: on a high-merge-rate day the `main` queue can lag behind the tip.
# That is the intended cost — a late-but-real answer beats a fast "cancelled".
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: the build jobs only check out the repo, restore ccache, and
# upload build artifacts — none of which need write access to repo contents.
# (security review §I6)
permissions:
  contents: read

jobs:
  build_wheels:
    name: Build ${{ matrix.platform }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS (macos-14 / arm64) stays out of the PUSH-triggered matrix: the
        # runner queue is scarce and the from-source WiredTiger build is slow,
        # so it's too costly on every push. It IS included on
        # `workflow_dispatch`, because "validated only at release time" is how a
        # macOS-only wheel break reaches a release tag: the lz4 compressor
        # switch passed every pre-release lane and then failed the macOS wheel
        # in publish.yml, on a `delocate` deployment-target rejection that
        # nothing else could have caught. Run this workflow manually before any
        # change touching the wheel build.
        #
        # Selected with fromJSON rather than a per-entry `if:` — the `matrix`
        # context is not available in a job-level `if`, which GitHub rejects at
        # parse time ("Unrecognized named-value: 'matrix'").
        #
        # macos-x86_64 (macos-13) is unsupported regardless — Apple Silicon is
        # the active target.
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch'
          && '[{"os":"macos-14","platform":"macos-arm64","cibw_archs":"arm64"},{"os":"ubuntu-22.04","platform":"linux-x86_64","cibw_archs":"x86_64"},{"os":"ubuntu-22.04-arm","platform":"linux-aarch64","cibw_archs":"aarch64"},{"os":"windows-2022","platform":"windows-x86_64","cibw_archs":"AMD64"}]'
          || '[{"os":"ubuntu-22.04","platform":"linux-x86_64","cibw_archs":"x86_64"},{"os":"ubuntu-22.04-arm","platform":"linux-aarch64","cibw_archs":"aarch64"},{"os":"windows-2022","platform":"windows-x86_64","cibw_archs":"AMD64"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Checkout the WiredTiger submodule
        # Only vendor/wiredtiger feeds the build. ``submodules: recursive``
        # cloned all 12 vendored submodules — 11 of them driver-gauge repos
        # (mongo-java-driver, mongo-c-driver, ...) whose gigabytes of history
        # only the weekly validate workflow reads. Shallow-init just WT; fall
        # back to a full fetch if the shallow probe is refused.
        shell: bash
        run: >-
          git submodule update --init --depth 1 vendor/wiredtiger ||
          git submodule update --init vendor/wiredtiger

      - name: Disable Defender real-time scanning (Windows)
        if: runner.os == 'Windows'
        # Real-time scanning synchronously inspects every file the build
        # creates (cargo + CMake object files, the WT tree, wheel staging) on
        # an ephemeral VM that builds only this checkout. Best-effort.
        shell: pwsh
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true }
          catch { Write-Warning "could not disable Defender real-time scanning: $_" }


      # Same ccache plumbing as publish.yml — see comments there.
      # Sharing the cache key (ccache-<platform>-wt-<sha>) across the
      # two workflows means every main-branch wheels.yml run primes the
      # cache that publish.yml will hit warm at tag time.
      - name: Compute WT submodule SHA
        id: wt-sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:vendor/wiredtiger)" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        if: matrix.platform != 'windows-x86_64'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.platform }}-wt-${{ steps.wt-sha.outputs.sha }}
          restore-keys: |
            ccache-${{ matrix.platform }}-

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@4726cd35bb13f7bde50cf2761f2499ac7b3aa32c  # v4.1.1
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_BEFORE_ALL_LINUX: |
            (yum install -y ccache 2>/dev/null \
              || dnf install -y ccache 2>/dev/null \
              || apk add --no-cache ccache 2>/dev/null \
              || true)
            if ! command -v ccache >/dev/null 2>&1; then
              echo "ccache unavailable on this image; installing passthrough shim"
              printf '#!/bin/sh\nexec "$@"\n' > /usr/bin/ccache
              chmod +x /usr/bin/ccache
            fi
          CIBW_CONTAINER_ENGINE: 'docker; create_args: -v /home/runner/.cache/ccache:/host_ccache'
          # SECANTUS_BUILD_STORAGE_ENGINE=ON bundles the Rust extensions +
          # secantusd-rs into the wheel. $HOME/.cargo/bin is on PATH so the
          # build sees the rustup-installed cargo; LIBCLANG_PATH=/opt/libclang
          # is where before-build symlinks the container's libclang for bindgen.
          CIBW_ENVIRONMENT_LINUX: >-
            CCACHE_DIR=/host_ccache
            CMAKE_C_COMPILER_LAUNCHER=ccache
            CMAKE_CXX_COMPILER_LAUNCHER=ccache
            SKBUILD_CMAKE_DEFINE="SECANTUS_BUILD_STORAGE_ENGINE=ON"
            PATH=$HOME/.cargo/bin:$PATH
            LIBCLANG_PATH=/opt/libclang
            RUSTFLAGS="-Ctarget-feature=-crt-static"
            SECANTUS_CARGO_TARGET=/host_ccache/cargo-target
          CIBW_BEFORE_ALL_MACOS: brew install ccache
          CIBW_ENVIRONMENT_MACOS: >-
            CMAKE_PREFIX_PATH=/usr/local/secantus-lz4
            CMAKE_C_COMPILER_LAUNCHER=ccache
            CMAKE_CXX_COMPILER_LAUNCHER=ccache
            SKBUILD_CMAKE_DEFINE="SECANTUS_BUILD_STORAGE_ENGINE=ON"
            PATH=$HOME/.cargo/bin:$PATH
            SECANTUS_CARGO_TARGET=$HOME/.cache/ccache/cargo-target

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Checkout the WiredTiger submodule
        # Only vendor/wiredtiger feeds the build. ``submodules: recursive``
        # cloned all 12 vendored submodules — 11 of them driver-gauge repos
        # (mongo-java-driver, mongo-c-driver, ...) whose gigabytes of history
        # only the weekly validate workflow reads. Shallow-init just WT; fall
        # back to a full fetch if the shallow probe is refused.
        shell: bash
        run: >-
          git submodule update --init --depth 1 vendor/wiredtiger ||
          git submodule update --init vendor/wiredtiger

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
