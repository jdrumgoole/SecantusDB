name: Publish to PyPI

on:
  push:
    tags:
      # Final releases: vX.Y.Z
      - "v[0-9]+.[0-9]+.[0-9]+"
      # PEP 440 pre-releases: vX.Y.ZaN, vX.Y.ZbN, vX.Y.ZrcN
      - "v[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

jobs:
  # Fail-fast guard: refuse to publish a tag that doesn't agree with
  # pyproject's version. Cheap to run; gates the matrix below so a
  # mistake doesn't burn 15+ minutes of cibuildwheel time.
  verify_tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Verify tag matches project version
        # `--no-project` is critical: without it, `uv run` tries to install
        # the current project (because pyproject.toml is present), which
        # triggers a full WT build (no submodule, no swig in this job) and
        # fails before the tag check ever runs.
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pyver=$(uv run --no-project python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$tag" != "$pyver" ]; then
            echo "Tag $tag does not match pyproject version $pyver" >&2
            exit 1
          fi

  # Same matrix and config as wheels.yml. Keeping them in sync by
  # convention rather than abstraction — GitHub Actions doesn't have
  # a clean "import job from another workflow" primitive, and a
  # cibuildwheel matrix is short enough to duplicate. wheels.yml
  # remains for on-demand iteration via workflow_dispatch.
  build_wheels:
    needs: verify_tag
    name: Build ${{ matrix.platform }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-x86_64 intentionally absent — see wheels.yml comment.
          - os: macos-14
            platform: macos-arm64
            cibw_archs: arm64
          - os: ubuntu-22.04
            platform: linux-x86_64
            cibw_archs: x86_64
          - os: ubuntu-22.04-arm
            platform: linux-aarch64
            cibw_archs: aarch64
          - os: windows-2022
            platform: windows-x86_64
            cibw_archs: AMD64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Cache the ccache directory across builds keyed on the WiredTiger
      # submodule SHA (changes only when we bump the vendored WT pin —
      # months apart). The actual cache hit happens across the four
      # cp31x wheel builds within a single runner: cp310 misses (warms
      # the cache); cp311/12/13 hit warm and skip the WT C compile,
      # which is the bulk of the runner's wall-clock. wheels.yml shares
      # the same key so main-branch CI runs warm the cache for the
      # next tag-triggered publish run.
      - name: Compute WT submodule SHA
        id: wt-sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:vendor/wiredtiger)" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        if: matrix.platform != 'windows-x86_64'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.platform }}-wt-${{ steps.wt-sha.outputs.sha }}
          restore-keys: |
            ccache-${{ matrix.platform }}-

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          # Linux: install ccache once in the manylinux/musllinux
          # container, mount the host's actions/cache-restored ccache
          # dir into the container, point CMake's compiler launcher at
          # ccache so per-file compiles route through the cache.
          # If no package manager has ccache (manylinux2014 aarch64's
          # CentOS 7 base image is the known offender — default repos
          # have no ccache for ARM), fall back to a passthrough shim
          # so CMAKE_C_COMPILER_LAUNCHER=ccache still resolves and the
          # build runs uncached but doesn't fail.
          CIBW_BEFORE_ALL_LINUX: |
            (yum install -y ccache 2>/dev/null \
              || dnf install -y ccache 2>/dev/null \
              || apk add --no-cache ccache 2>/dev/null \
              || true)
            if ! command -v ccache >/dev/null 2>&1; then
              echo "ccache unavailable on this image; installing passthrough shim"
              printf '#!/bin/sh\nexec "$@"\n' > /usr/bin/ccache
              chmod +x /usr/bin/ccache
            fi
          CIBW_CONTAINER_ENGINE: 'docker; create_args: -v /home/runner/.cache/ccache:/host_ccache'
          CIBW_ENVIRONMENT_LINUX: >-
            CCACHE_DIR=/host_ccache
            CMAKE_C_COMPILER_LAUNCHER=ccache
            CMAKE_CXX_COMPILER_LAUNCHER=ccache
          # macOS: ccache via Homebrew. The macos-14 runner image
          # already has it — `brew install` is idempotent and a few
          # seconds when already present.
          CIBW_BEFORE_ALL_MACOS: brew install ccache
          CIBW_ENVIRONMENT_MACOS: >-
            CMAKE_C_COMPILER_LAUNCHER=ccache
            CMAKE_CXX_COMPILER_LAUNCHER=ccache
          # Windows: ccache + MSVC is historically fragile, so the
          # Windows wheel build runs without ccache. If Windows becomes
          # the publish-workflow bottleneck, switch to sccache.

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl

  build_sdist:
    needs: verify_tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # PyPI trusted-publisher: bound on the PyPI side to this repo +
  # workflow filename (publish.yml) + environment (pypi). Don't rename
  # the file or change the environment without re-binding on PyPI.
  publish:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/secantusdb
    permissions:
      id-token: write
    steps:
      - name: Download all wheel and sdist artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
