name: wt-sys crate

# The gate for crates/secantus-wiredtiger-sys (tasks/rust-packages-plan.md,
# Phase A step 6): package the crate, then build that .crate tarball OUTSIDE
# the repository, on each OS. It is the only check that proves the crate needs
# nothing but itself, CMake and a C compiler -- no Python, no prebuilt
# WiredTiger, no Homebrew.
#
# The package step runs from a copy outside the checkout because `cargo
# package` inside it walks the repo's git state and fails on the vendored
# submodules this job does not initialise.

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/secantus-wiredtiger-sys/**"
      - "crates/secantus-wt/**"
      - "crates/secantus-compressors/**"
      - "vendor/snappy/**"
      - "vendor/zstandard/**"
      - "scripts/wt_sys_refresh.py"
      - "cmake/patch_wt_*.py"
      - "vendor/wiredtiger"
      - ".github/workflows/wt-sys.yml"
  push:
    branches: [main]
    paths:
      - "crates/secantus-wiredtiger-sys/**"
      - "crates/secantus-wt/**"
      - "crates/secantus-compressors/**"
      - "vendor/snappy/**"
      - "vendor/zstandard/**"
      - "scripts/wt_sys_refresh.py"
      - "cmake/patch_wt_*.py"
      - "vendor/wiredtiger"
      - ".github/workflows/wt-sys.yml"
  # Windows builds only weekly and on demand (Joe, 2026-11-25: "For
  # debugging builds don't build windows"): a PR or a push to main packages
  # the crate on Linux and macOS; the Sunday run and `gh workflow run
  # wt-sys.yml` add Windows. Run it by hand before a release or after a
  # change to the crate's build.
  schedule:
    - cron: "37 4 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && '["ubuntu-latest", "macos-latest", "windows-latest"]'
          || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Init vendor/wiredtiger
        shell: bash
        run: >-
          git submodule update --init --depth 1 vendor/wiredtiger ||
          git submodule update --init vendor/wiredtiger
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Regenerate the WiredTiger copy and check the stamp
        shell: bash
        run: python scripts/wt_sys_refresh.py --check
      - name: Package and build from the tarball, outside the repo
        shell: bash
        run: |
          # Beside it, secantus-compressors (mongo's snappy and zstd, with
          # the vendored sources a packaged crate carries): it is not on
          # crates.io until a release publishes it, so the packaged crate's
          # verify build is pointed at this copy.
          root="$RUNNER_TEMP/wt-sys-stage"
          stage="$root/secantus-wiredtiger-sys"
          mkdir -p "$root/.cargo"
          cp -R crates/secantus-wiredtiger-sys "$stage"
          cp -R crates/secantus-compressors "$root/secantus-compressors"
          cp -R vendor/snappy "$root/secantus-compressors/snappy"
          cp -R vendor/zstandard "$root/secantus-compressors/zstandard"
          # Relative: a config file's paths resolve from the directory that
          # holds its `.cargo`, and an absolute Windows path's backslashes
          # are not valid TOML.
          printf '[patch.crates-io]\nsecantus-compressors = { path = "secantus-compressors" }\n' \
            > "$root/.cargo/config.toml"
          cd "$stage"
          # `cargo package` verifies by building the extracted .crate.
          CARGO_TARGET_DIR="$RUNNER_TEMP/wt-sys-target" cargo package --allow-dirty
          ls -la "$RUNNER_TEMP"/wt-sys-target/package/*.crate
      - name: secantus-wt over bundled WiredTiger and the committed bindings
        # No libclang: without the `bindgen` feature the committed
        # src/bindings.rs is used, and its compile-time layout assertions
        # check the struct sizes on this OS.
        shell: bash
        run: |
          python scripts/wt_sys_refresh.py
          cd crates/secantus-wt
          CARGO_TARGET_DIR="$RUNNER_TEMP/wt-target" cargo test --no-default-features --features bundled
