<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }} — SecantusDB Ops Board</title>
    {# Inline SVG favicon (a gear) — dodges the /favicon.ico 401 the token
       middleware would otherwise return. #}
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Ccircle%20cx='16'%20cy='16'%20r='9'%20fill='none'%20stroke='%2363b3ff'%20stroke-width='4'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='3'%20fill='%2363b3ff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/static/css/opsboard.css" />
    <script src="/static/js/htmx.min.js" defer></script>
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">⚙</span>
        <span class="brand-name">Ops Board</span>
      </div>
      <nav>
        <ul>
          <li><a href="/" class="{% if active == 'dashboard' %}nav-current{% endif %}">Dashboard</a></li>
          <li><a href="/jobs" class="{% if active == 'jobs' %}nav-current{% endif %}">Jobs</a></li>
        </ul>
      </nav>
      <div class="sidebar-foot">
        <code title="repo the Ops Board drives">{{ request.app.state.repo_root.split('/')[-1] }}</code>
      </div>
    </aside>
    <main class="content">
      <header class="page-header">
        <h1>{{ title }}</h1>
      </header>
      {% block body %}{% endblock %}
    </main>
  </body>
</html>
