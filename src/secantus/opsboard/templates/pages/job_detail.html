{% extends "base.html" %}
{% block body %}
<p class="job-meta-top muted">
  argv: <code>{{ job.argv | join(" ") }}</code> · worktree <code>{{ job.worktree }}</code> · pid {{ job.host_pid }}
</p>

{# Loads the graphical view (overall bar + phase stepper + collapsible log),
   which then self-repolls every second while the job runs. #}
<div id="jobview" hx-get="/jobs/{{ job.id }}/view" hx-trigger="load" hx-swap="outerHTML">
  <p class="muted">loading…</p>
</div>
{% endblock %}
