<div
  class="modal-overlay"
  x-init="setupModal($el)"
  @click.self="closeModal()"
  @keydown.escape.window="closeModal()"
>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-header">
      <h2 id="modal-title">Manage roles</h2>
      <button
        type="button"
        class="modal-close"
        aria-label="Close"
        @click="closeModal()"
      >×</button>
    </header>
    <form
      class="modal-body"
      hx-post="/users/{{ db_name }}/{{ username }}/roles"
      hx-swap="none"
    >
      <p class="modal-meta">User: <code>{{ username }}@{{ db_name }}</code></p>
      <div class="roles-grid">
        {% for row in rows %}
          <label class="checkbox-label">
            <input
              type="checkbox"
              name="roles"
              value="{{ row.value }}"
              {% if row.checked %}checked{% endif %}
            />
            <code>{{ row.value }}</code>
          </label>
        {% endfor %}
      </div>
      <div class="modal-actions">
        <button
          type="button"
          class="btn-secondary"
          @click="closeModal()"
        >Cancel</button>
        <button type="submit">Apply</button>
      </div>
    </form>
  </div>
</div>
