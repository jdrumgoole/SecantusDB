<div
  class="modal-overlay"
  x-data="{ confirm: '' }"
  x-init="setupModal($el)"
  @click.self="closeModal()"
  @keydown.escape.window="closeModal()"
>
  <div class="modal modal-narrow" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-header">
      <h2 id="modal-title">Drop index</h2>
      <button
        type="button"
        class="modal-close"
        aria-label="Close"
        @click="closeModal()"
      >×</button>
    </header>
    <div class="modal-body">
      <p>
        You are about to drop index
        <code>{{ index_name }}</code> from
        <code>{{ db_name }}.{{ coll_name }}</code>.
        Existing queries that relied on it will fall back to a collection scan.
      </p>
      <p>Type the index name <code>{{ index_name }}</code> to confirm:</p>
      <input
        type="text"
        class="confirm-input"
        x-model="confirm"
        autocomplete="off"
        autofocus
      />
      <div class="modal-actions">
        <button
          type="button"
          class="btn-secondary"
          @click="closeModal()"
        >Cancel</button>
        <button
          type="button"
          class="btn-danger"
          x-bind:disabled="confirm !== '{{ index_name }}'"
          hx-delete="/db/{{ db_name }}/{{ coll_name }}/indexes/{{ index_name }}"
          hx-target="#ix-{{ index_name }}"
          hx-swap="outerHTML"
          hx-on::after-request="if(event.detail.successful) closeModal()"
        >Drop index</button>
      </div>
    </div>
  </div>
</div>
