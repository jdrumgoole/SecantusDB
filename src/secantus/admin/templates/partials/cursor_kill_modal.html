<div
  class="modal-overlay"
  x-data="{ confirm: '' }"
  x-init="setupModal($el)"
  @click.self="closeModal()"
  @keydown.escape.window="closeModal()"
>
  <div class="modal modal-narrow" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-header">
      <h2 id="modal-title">Kill cursor</h2>
      <button
        type="button"
        class="modal-close"
        aria-label="Close"
        @click="closeModal()"
      >×</button>
    </header>
    <div class="modal-body">
      <p>
        About to kill cursor <code>{{ cursor_id }}</code> on
        <code>{{ ns }}</code>. Active tailable consumers will see the
        stream end on their next <code>getMore</code>.
      </p>
      <p>Type the namespace <code>{{ ns }}</code> to confirm:</p>
      <input
        type="text"
        class="confirm-input"
        x-model="confirm"
        autocomplete="off"
        autofocus
      />
      <div class="modal-actions">
        <button
          type="button"
          class="btn-secondary"
          @click="closeModal()"
        >Cancel</button>
        <button
          type="button"
          class="btn-danger"
          x-bind:disabled="confirm !== '{{ ns }}'"
          hx-delete="/cursors/{{ cursor_id }}?ns={{ ns | urlencode }}"
          hx-target="#cursor-{{ cursor_id }}"
          hx-swap="outerHTML"
          hx-on::after-request="if(event.detail.successful) closeModal()"
        >Kill cursor</button>
      </div>
    </div>
  </div>
</div>
