<div
  class="modal-overlay"
  x-data="{ confirm: '' }"
  @click.self="document.getElementById('modal').innerHTML = ''"
>
  <div class="modal modal-narrow">
    <header class="modal-header">
      <h2>Delete document</h2>
      <button
        type="button"
        class="modal-close"
        @click="document.getElementById('modal').innerHTML = ''"
        aria-label="Close"
      >×</button>
    </header>
    <div class="modal-body">
      <p>
        You are about to delete a document from
        <code>{{ db_name }}.{{ coll_name }}</code>.
        This cannot be undone.
      </p>
      <p class="modal-meta">_id: <code>{{ doc_id }}</code></p>
      <pre class="doc-body">{{ doc_json }}</pre>
      <p>
        Type the collection name <code>{{ coll_name }}</code> to confirm:
      </p>
      <input
        type="text"
        class="confirm-input"
        x-model="confirm"
        autocomplete="off"
        autofocus
      />
      <div class="modal-actions">
        <button
          type="button"
          class="btn-secondary"
          @click="document.getElementById('modal').innerHTML = ''"
        >Cancel</button>
        <button
          type="button"
          class="btn-danger"
          x-bind:disabled="confirm !== '{{ coll_name }}'"
          hx-delete="/db/{{ db_name }}/{{ coll_name }}/docs/{{ id_token }}"
          hx-target="#row-{{ id_token }}"
          hx-swap="outerHTML"
          hx-on::after-request="if(event.detail.successful) document.getElementById('modal').innerHTML = ''"
        >Delete</button>
      </div>
    </div>
  </div>
</div>
