<div
  class="modal-overlay"
  x-data="{ confirm: '' }"
  x-init="setupModal($el)"
  @click.self="closeModal()"
  @keydown.escape.window="closeModal()"
>
  <div class="modal modal-narrow" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-header">
      <h2 id="modal-title">Delete document</h2>
      <button
        type="button"
        class="modal-close"
        aria-label="Close"
        @click="closeModal()"
      >×</button>
    </header>
    <div class="modal-body">
      <p>
        You are about to delete a document from
        <code>{{ db_name }}.{{ coll_name }}</code>.
        This cannot be undone.
      </p>
      <p class="modal-meta">_id: <code>{{ doc_id }}</code></p>
      <pre class="doc-body">{{ doc_json }}</pre>
      <p>Type the <code>_id</code> value <code>{{ doc_id }}</code> to confirm:</p>
      <input
        type="text"
        class="confirm-input"
        x-model="confirm"
        autocomplete="off"
        autofocus
      />
      <div class="modal-actions">
        <button
          type="button"
          class="btn-secondary"
          @click="closeModal()"
        >Cancel</button>
        <button
          type="button"
          class="btn-danger"
          x-bind:disabled="confirm !== '{{ doc_id }}'"
          hx-delete="/db/{{ db_name }}/{{ coll_name }}/docs/{{ id_token }}"
          hx-target="#row-{{ id_token }}"
          hx-swap="outerHTML"
          hx-on::after-request="if(event.detail.successful) closeModal()"
        >Delete document</button>
      </div>
    </div>
  </div>
</div>
