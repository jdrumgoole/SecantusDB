<div
  class="modal-overlay"
  x-init="setupModal($el)"
  @click.self="closeModal()"
  @keydown.escape.window="closeModal()"
>
  <div class="modal modal-narrow" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-header">
      <h2 id="modal-title">Change password</h2>
      <button
        type="button"
        class="modal-close"
        aria-label="Close"
        @click="closeModal()"
      >×</button>
    </header>
    <form
      class="modal-body"
      hx-post="/users/{{ db_name }}/{{ username }}/password"
      hx-swap="none"
      hx-on::after-request="if(event.detail.successful) closeModal()"
    >
      <p class="modal-meta">User: <code>{{ username }}@{{ db_name }}</code></p>
      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}
      <label class="filter-label">
        New password
        <input type="password" name="password" required autocomplete="new-password" />
      </label>
      <label class="filter-label">
        Confirm
        <input type="password" name="confirm" required autocomplete="new-password" />
      </label>
      <div class="modal-actions">
        <button
          type="button"
          class="btn-secondary"
          @click="closeModal()"
        >Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </div>
</div>
