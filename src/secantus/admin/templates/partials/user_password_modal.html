<div class="modal-overlay" @click.self="document.getElementById('modal').innerHTML = ''">
  <div class="modal modal-narrow">
    <header class="modal-header">
      <h2>Change password</h2>
      <button
        type="button"
        class="modal-close"
        @click="document.getElementById('modal').innerHTML = ''"
      >×</button>
    </header>
    <form
      class="modal-body"
      hx-post="/users/{{ db_name }}/{{ username }}/password"
      hx-swap="none"
      hx-on::after-request="if(event.detail.successful) document.getElementById('modal').innerHTML = ''"
    >
      <p class="modal-meta">User: <code>{{ username }}@{{ db_name }}</code></p>
      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}
      <label class="filter-label">
        New password
        <input type="password" name="password" required autocomplete="new-password" />
      </label>
      <label class="filter-label">
        Confirm
        <input type="password" name="confirm" required autocomplete="new-password" />
      </label>
      <div class="modal-actions">
        <button
          type="button"
          class="btn-secondary"
          @click="document.getElementById('modal').innerHTML = ''"
        >Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </div>
</div>
