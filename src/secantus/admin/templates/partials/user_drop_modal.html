<div
  class="modal-overlay"
  x-data="{ confirm: '' }"
  x-init="setupModal($el)"
  @click.self="closeModal()"
  @keydown.escape.window="closeModal()"
>
  <div class="modal modal-narrow" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-header">
      <h2 id="modal-title">Drop user</h2>
      <button
        type="button"
        class="modal-close"
        aria-label="Close"
        @click="closeModal()"
      >×</button>
    </header>
    <div class="modal-body">
      <p>
        You are about to drop user <code>{{ username }}@{{ db_name }}</code>.
        Existing connections authenticated as this user keep their session
        until they reconnect.
      </p>
      <p>Type the username <code>{{ username }}</code> to confirm:</p>
      <input
        type="text"
        class="confirm-input"
        x-model="confirm"
        autocomplete="off"
        autofocus
      />
      <div class="modal-actions">
        <button
          type="button"
          class="btn-secondary"
          @click="closeModal()"
        >Cancel</button>
        <button
          type="button"
          class="btn-danger"
          x-bind:disabled="confirm !== '{{ username }}'"
          hx-delete="/users/{{ db_name }}/{{ username }}"
          hx-target="#user-{{ username }}"
          hx-swap="outerHTML"
          hx-on::after-request="if(event.detail.successful) closeModal()"
        >Drop user</button>
      </div>
    </div>
  </div>
</div>
