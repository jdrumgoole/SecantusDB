{% if error %}
  <div class="error">Could not reach server: {{ error }}</div>
{% else %}
  {% for tile in tiles %}
    <div class="tile">
      <div class="tile-label">{{ tile.label }}</div>
      <div class="tile-value">{{ tile.value }}</div>
      {% if tile.hint %}<div class="tile-hint">{{ tile.hint }}</div>{% endif %}
    </div>
  {% endfor %}
{% endif %}
