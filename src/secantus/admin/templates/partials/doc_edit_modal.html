<div
  class="modal-overlay"
  x-init="setupModal($el)"
  @click.self="closeModal()"
  @keydown.escape.window="closeModal()"
>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-header">
      <h2 id="modal-title">Edit document</h2>
      <button
        type="button"
        class="modal-close"
        aria-label="Close"
        @click="closeModal()"
      >×</button>
    </header>
    <form
      hx-post="/db/{{ db_name }}/{{ coll_name }}/docs/{{ id_token }}"
      hx-target="#row-{{ id_token }}"
      hx-swap="outerHTML"
      hx-on::after-request="if(event.detail.successful) closeModal()"
    >
      <p class="modal-meta">_id: <code>{{ doc_id }}</code> (immutable)</p>
      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}
      <textarea name="body" rows="20" spellcheck="false">{{ doc_json }}</textarea>
      <div class="modal-actions">
        <button
          type="button"
          class="btn-secondary"
          @click="closeModal()"
        >Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </div>
</div>
