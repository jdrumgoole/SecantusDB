# Pytest + sqla_testing config for the compliance-suite run. The [tool:pytest]
# section pins pytest's rootdir HERE so the repo's pyproject addopts (-n auto,
# coverage of tests/) never leak into SQLAlchemy's suite; [sqla_testing] is
# read by sqlalchemy.testing.plugin (the runner puts the repo root on
# PYTHONPATH so requirement_cls imports).
[tool:pytest]
addopts =

[sqla_testing]
requirement_cls = sqlalchemy_validation.requirements:Requirements
profile_file = .profiles.txt
