<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="SecantusDB — the SQLite of document databases">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap');
      .name { font-family: 'Inter', sans-serif; font-weight: 600; letter-spacing: -0.02em; }
      .tag  { font-family: 'Inter', sans-serif; font-weight: 400; letter-spacing: 0.16em; }
      .url  { font-family: 'Inter', sans-serif; font-weight: 500; letter-spacing: 0.02em; }
    </style>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid texture -->
  <g stroke="#334155" stroke-width="1" opacity="0.18">
    <path d="M0,160 H1200 M0,320 H1200 M0,480 H1200"/>
    <path d="M200,0 V630 M400,0 V630 M600,0 V630 M800,0 V630 M1000,0 V630"/>
  </g>

  <!-- Mark on the left -->
  <g transform="translate(80, 155) scale(1)">
    <path d="M52,36 Q160,14 268,36 L268,254 Q268,306 160,306 Q52,306 52,254 Z" fill="#64748b"/>
    <path d="M60,40 Q160,20 260,40 L260,250 Q260,300 160,300 Q60,300 60,250 Z" fill="#475569"/>
    <path d="M60,40 Q160,20 260,40 L260,250 Q260,300 160,300 Q60,300 60,250 Z" fill="none" stroke="#0f172a" stroke-width="2" opacity="0.5"/>
    <g transform="translate(160,165)">
      <circle r="78" fill="#0891b2" stroke="#0f172a" stroke-width="2"/>
      <g transform="translate(-44,-50)" stroke="#0f172a" stroke-width="2">
        <path d="M0,70 V82 Q0,98 44,98 Q88,98 88,82 V70 Z" fill="#22d3ee"/>
        <ellipse cx="44" cy="70" rx="44" ry="11" fill="#67e8f9"/>
        <path d="M0,38 V58 Q0,74 44,74 Q88,74 88,58 V38 Z" fill="#22d3ee"/>
        <ellipse cx="44" cy="38" rx="44" ry="11" fill="#67e8f9"/>
        <path d="M0,6 V26 Q0,42 44,42 Q88,42 88,26 V6 Z" fill="#22d3ee"/>
        <ellipse cx="44" cy="6" rx="44" ry="11" fill="#67e8f9"/>
      </g>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="500" y="290" class="name" font-size="86" fill="#f1f5f9">Secantus<tspan fill="#22d3ee">DB</tspan></text>
  <line x1="504" y1="320" x2="900" y2="320" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
  <text x="504" y="362" class="tag" font-size="22" fill="#cbd5e1">THE SQLITE OF DOCUMENT DATABASES</text>

  <!-- URL bottom-right -->
  <text x="1120" y="590" class="url" font-size="20" fill="#64748b" text-anchor="end">secantusdb.com</text>
</svg>
