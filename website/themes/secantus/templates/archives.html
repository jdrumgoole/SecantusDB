{% extends 'base.html' %}

{% block title %}Archives — {{ SITENAME }}{% endblock %}
{% block canonical_path %}archives/{% endblock %}

{% block content %}
<section class="page-body">
  <div class="wrap">
    <h1>Archives</h1>
    <ul class="article-list">
      {% for article in dates %}
      <li>
        <h3><a href="{{ SITEURL }}/{{ article.url }}">{{ article.title }}</a></h3>
        <p class="meta">{{ article.locale_date }}</p>
      </li>
      {% endfor %}
    </ul>
  </div>
</section>
{% endblock %}
